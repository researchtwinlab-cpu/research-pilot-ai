function WorkflowStepBadge({ step, status }) {
  const colors = { idle:"var(--navy-600)", running:"var(--gold-500)", done:"#7cc98a", error:"var(--danger)" };
  const labels = { idle:"대기", running:"진행 중", done:"완료", error:"오류" };
  return (
    <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",borderRadius:8,
      background: status==="running" ? "var(--navy-700)" : status==="done" ? "rgba(124,201,138,0.08)" : "var(--navy-800)",
      border:`1px solid ${colors[status]||"var(--navy-600)"}`}}>
      <span style={{fontSize:20}}>{step.icon}</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:700,fontSize:13}}>{step.label}</div>
        <div style={{fontSize:11,color:"var(--slate)"}}>{step.desc}</div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {status==="running" && <svg className="spin" width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#28406b" strokeWidth="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="#c9a227" strokeWidth="3" strokeLinecap="round"/></svg>}
        <span style={{fontSize:11,color:colors[status]||"var(--slate)"}}>{labels[status]||"대기"}</span>
      </div>
    </div>
  );
}

function AutoWorkflow() {
  const proj = useProject();
  const s = proj.state;
  const [file, setFile] = useState(null);
  const [rawText, setRawText] = useState("");
  const [isDragOver, setIsDragOver] = useState(false);
  const [extractError, setExtractError] = useState("");
  const [running, setRunning] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [stepResults, setStepResults] = useState({});
  const [finalText, setFinalText] = useState("");
  const [activeResult, setActiveResult] = useState(null);
  const [copied, setCopied] = useState(false);
  const fileRef = useRef(null);

  const qtKey = s.qualSubType || "질적메타종합";
  const qtInfo = QUAL_TYPES[qtKey];
  const ctx = {
    topic: s.topic || "",
    qtLabel: qtInfo?.label || "질적메타종합",
    keyTerms: qtInfo?.keyTerms?.join(", ") || "",
    checklist: qtInfo?.checklist?.join(" / ") || "",
    papers: (s.papers||[]).map(p=>`${p.authors||p.title}`).join(", ") || "없음",
    revisions: [],
  };

  const handleDrop = async (e) => {
    e.preventDefault(); setIsDragOver(false);
    const f = e.dataTransfer?.files?.[0] || e.target?.files?.[0];
    if (!f) return;
    setFile(f); setRawText(""); setExtractError(""); setStepStatus({}); setStepResults({}); setFinalText("");
    const text = await extractTextFromFile(f);

    // 텍스트 추출 결과 품질 검사
    const isGarbled = text && (
      // 한글 문자 비율이 너무 낮으면 깨진 것
      (text.match(/[\uAC00-\uD7A3]/g)||[]).length < text.length * 0.1 ||
      // 연속 특수문자가 많으면 깨진 것
      (text.match(/[^\w\s가-힣ㄱ-ㅎㅏ-ㅣ.,!?()[\]{}<>;:'"]/g)||[]).length > text.length * 0.3
    );

    if (text && text.trim().length > 50 && !isGarbled) {
      setRawText(text);
    } else {
      const ext = f.name.split('.').pop().toLowerCase();
      setExtractError(
        ext === 'hwp'
          ? `⚠ HWP 파일 텍스트 추출 실패\n\n"${f.name}"은 구형 HWP 바이너리 형식으로 브라우저에서 직접 읽을 수 없습니다.\n\n✅ 해결 방법 (2가지):\n1. 한글 프로그램에서 파일 열기 → Ctrl+A → Ctrl+C → 아래 텍스트 박스에 Ctrl+V\n2. 한글에서 [파일 → 다른 이름으로 저장 → 파일형식: 텍스트(.txt)] 후 .txt 파일 업로드`
          : ext === 'pdf'
          ? `⚠ PDF 텍스트 추출 실패\n\n스캔된 PDF이거나 텍스트 레이어가 없는 파일입니다.\n\n✅ 해결 방법:\n전자 문서 PDF(복사 가능한 PDF)만 지원됩니다. 내용을 직접 복사하여 아래 박스에 붙여넣어 주세요.`
          : `⚠ "${f.name}" 파일 텍스트 추출에 실패했습니다. 내용을 아래에 직접 붙여넣어 주세요.`
      );
    }
  };

  const setStatus = (key, st) => setStepStatus(prev=>({...prev,[key]:st}));
  const setResult = (key, val) => setStepResults(prev=>({...prev,[key]:val}));

  const runWorkflow = async () => {
    if (!rawText.trim()) { setExtractError("텍스트가 없습니다. 파일을 업로드하거나 아래에 직접 붙여넣어 주세요."); return; }
    setRunning(true); setStepStatus({}); setStepResults({}); setFinalText(""); ctx.revisions = [];

    const callStep = async (key, promptFn) => {
      setStatus(key, "running");
      try {
        const { sys, user } = promptFn(rawText, ctx);
        const data = await callClaude([{role:"user",content:user}], {system:sys});
        if (data.error) throw new Error(data.error);
        const text = extractText(data);
        const parsed = parseJSONLoose(text);
        setResult(key, { raw: text, parsed, ok: true });
        if (parsed) ctx.revisions.push(`[${key}]: ${JSON.stringify(parsed).slice(0,200)}`);
        else ctx.revisions.push(`[${key}]: ${text.slice(0,200)}`);
        setStatus(key, "done");
        return { text, parsed, ok: true };
      } catch (e) {
        const fallback = `[오프라인] ${key} 단계를 실시간으로 처리하지 못했습니다. 실제 AI 아티팩트 환경에서 다시 시도해 주세요.`;
        setResult(key, { raw: fallback, parsed: null, ok: false });
        ctx.revisions.push(`[${key} 오프라인]`);
        setStatus(key, "error");
        return { text: fallback, parsed: null, ok: false };
      }
    };

    // 텍스트 추출 단계는 이미 완료
    setStatus("extract", "done");
    setResult("extract", { raw: rawText.slice(0,500)+"...", parsed:null, ok:true });

    // 순차 실행
    await callStep("diagnose", STEP_PROMPTS.diagnose);
    await callStep("academic", STEP_PROMPTS.academic);
    await callStep("logic", STEP_PROMPTS.logic);
    await callStep("rewrite", STEP_PROMPTS.rewrite);
    await callStep("citation", STEP_PROMPTS.citation);
    await callStep("checklist", STEP_PROMPTS.checklist);

    // 최종 통합
    setStatus("final", "running");
    const rewriteText = stepResults["rewrite"]?.raw || rawText;
    const finalData = await callClaude(
      [{role:"user",content:`연구주제: ${ctx.topic}\n연구유형: ${ctx.qtLabel}\n이전 수정 사항:\n${ctx.revisions.join('\n')}\n\n[개선 대상 원고]\n${rewriteText.slice(0,3000)}`}],
      {system:STEP_PROMPTS.final(rewriteText, ctx).sys}
    );
    const finalTxt = finalData.error ? rewriteText : extractText(finalData);
    setFinalText(finalTxt);
    setStatus("final","done");
    setResult("final", {raw:finalTxt, parsed:null, ok:true});

    // 원고 작성실 동기화
    proj.update(prev=>({...prev, paperDraft:{...prev.paperDraft, intro: finalTxt.slice(0,3000)}}));
    setRunning(false);
  };

  const totalSteps = WORKFLOW_STEPS.length;
  const doneSteps = WORKFLOW_STEPS.filter(st=>stepStatus[st.key]==="done").length;
  const progressPct = Math.round((doneSteps/totalSteps)*100);

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="⚡ 논문 자동 개선 워크플로우"
        subtitle="논문 파일을 업로드하면 8단계 자동 순차 분석·수정 작업이 진행됩니다."/>

      {/* 파일 업로드 영역 */}
      <div style={{marginTop:20}}>
        <div
          onDragOver={e=>{e.preventDefault();setIsDragOver(true);}}
          onDragLeave={()=>setIsDragOver(false)}
          onDrop={handleDrop}
          onClick={()=>fileRef.current?.click()}
          style={{border:`2px dashed ${isDragOver?"var(--gold-500)":"var(--navy-600)"}`,
            borderRadius:12,padding:"32px 20px",textAlign:"center",cursor:"pointer",
            background:isDragOver?"rgba(201,162,39,0.05)":"transparent",transition:"all .2s"}}>
          <input ref={fileRef} type="file" accept=".hwp,.hwpx,.txt,.md" style={{display:"none"}} onChange={handleDrop}/>
          <div style={{fontSize:36,marginBottom:8}}>📂</div>
          <div style={{fontSize:15,fontWeight:700,color:"var(--ivory)",marginBottom:4}}>
            논문 파일을 드래그하거나 클릭하여 업로드
          </div>
          <div style={{fontSize:12,color:"var(--slate)"}}>지원 형식: .hwp / .hwpx / .txt / .md</div>
          <div style={{fontSize:11,color:"var(--slate)",marginTop:6}}>
            ⚠ HWP 구형 바이너리는 텍스트 추출이 제한됩니다. HWPX 또는 TXT 저장 후 업로드를 권장합니다.
          </div>
        </div>

        {file && !extractError && (
          <div className="card" style={{padding:10,marginTop:8,fontSize:12,color:"#7cc98a"}}>
            ✓ 파일 로드됨: {file.name} ({rawText.length.toLocaleString()}자 추출)
          </div>
        )}
        {extractError && (
          <div className="card" style={{padding:14,marginTop:10,fontSize:13,color:"var(--danger)",borderLeft:"3px solid var(--danger)",whiteSpace:"pre-line"}}>
            {extractError}
          </div>
        )}

        <div style={{marginTop:12}}>
          <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>또는 논문 텍스트 직접 붙여넣기</label>
          <textarea style={{width:"100%",minHeight:130}}
            placeholder="논문 전체 또는 주요 섹션 텍스트를 붙여넣으세요."
            value={rawText} onChange={e=>{setRawText(e.target.value); setExtractError("");}} />
        </div>
      </div>

      {/* 워크플로우 진행 */}
      {running && (
        <div style={{marginTop:16,marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--slate)",marginBottom:6}}>
            <span>자동 개선 진행 중... ({doneSteps}/{totalSteps} 단계)</span>
            <span className="mono">{progressPct}%</span>
          </div>
          <div style={{height:6,background:"var(--navy-700)",borderRadius:4,overflow:"hidden"}}>
            <div style={{height:"100%",width:`${progressPct}%`,background:"linear-gradient(90deg,var(--gold-500),var(--gold-300))",transition:"width .4s"}}/>
          </div>
        </div>
      )}

      <div style={{marginTop:14,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <button className="btn-gold" onClick={runWorkflow} disabled={running || !rawText.trim()}>
          {running ? `자동 개선 중... (${doneSteps}/${totalSteps})` : "⚡ 8단계 자동 개선 시작"}
        </button>
        {finalText && (
          <>
            <button className="btn-ghost" onClick={()=>navigator.clipboard.writeText(finalText).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);})}>{copied?"복사됨 ✓":"📋 복사"}</button>
            <button className="btn-ghost" onClick={()=>downloadText(`improved-paper-${(s.topic||"untitled").slice(0,15)}.txt`,finalText)}>⬇ 완성본 다운로드</button>
          </>
        )}
      </div>

      {/* 단계별 상태 + 결과 */}
      <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:20}}>
        {WORKFLOW_STEPS.map(step=>(
          <div key={step.key}>
            <div onClick={()=>setActiveResult(activeResult===step.key?null:step.key)} style={{cursor:stepStatus[step.key]==="done"?"pointer":"default"}}>
              <WorkflowStepBadge step={step} status={stepStatus[step.key]||"idle"}/>
            </div>
            {activeResult===step.key && stepResults[step.key] && (
              <div className="card" style={{padding:14,marginTop:4}}>
                <div style={{fontSize:11,color:"var(--gold-400)",marginBottom:8}}>
                  {step.label} 결과 {stepResults[step.key].ok?"✓":"⚠"}
                </div>
                {stepResults[step.key].parsed && step.key==="diagnose" && (
                  <div>
                    <div style={{fontSize:12,color:"var(--slate)",marginBottom:6}}>구조 점수: <span className="mono" style={{color:"var(--gold-300)"}}>{stepResults[step.key].parsed.structureScore}</span></div>
                    {(stepResults[step.key].parsed.sections||[]).map((sc,i)=>(
                      <div key={i} style={{fontSize:13,padding:"3px 0"}}>{sc.name}: <span style={{color:sc.status==="있음"?"#7cc98a":"var(--danger)"}}>{sc.status}</span> {sc.issue && `— ${sc.issue}`}</div>
                    ))}
                    {(stepResults[step.key].parsed.missingParts||[]).map((m,i)=>(<div key={i} style={{fontSize:12,color:"var(--danger)"}}>✗ 누락: {m}</div>))}
                  </div>
                )}
                {stepResults[step.key].parsed && step.key==="checklist" && (
                  <div>
                    <div style={{fontSize:12,color:"var(--slate)",marginBottom:6}}>최종 점수: <span className="mono" style={{color:"var(--gold-300)"}}>{stepResults[step.key].parsed.finalScore}</span></div>
                    {(stepResults[step.key].parsed.checks||[]).map((c,i)=>(
                      <div key={i} style={{fontSize:13,padding:"3px 0",color:c.pass?"#7cc98a":"var(--danger)"}}>
                        {c.pass?"✓":"✗"} {c.item} {c.note && <span style={{color:"var(--slate)",fontSize:11}}>— {c.note}</span>}
                      </div>
                    ))}
                    {(stepResults[step.key].parsed.criticalIssues||[]).map((ci,i)=>(<div key={i} style={{fontSize:12,color:"var(--danger)"}}>🔴 {ci}</div>))}
                  </div>
                )}
                {(!stepResults[step.key].parsed || ["rewrite","citation","final"].includes(step.key)) && (
                  <pre style={{whiteSpace:"pre-wrap",fontSize:12,color:"var(--ivory)",maxHeight:200,overflowY:"auto",margin:0}}>
                    {(stepResults[step.key].raw||"").slice(0,1200)}{stepResults[step.key].raw?.length>1200?"...":""}
                  </pre>
                )}
              </div>
            )}
          </div>
        ))}
      </div>

      {/* 최종 완성본 */}
      {finalText && (
        <div style={{marginTop:28}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:15,fontWeight:700,color:"var(--gold-300)"}}>🏆 최종 완성본</div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn-ghost" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>navigator.clipboard.writeText(finalText).catch(()=>{})}>📋 복사</button>
              <button className="btn-ghost" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>downloadText(`improved-paper-${(s.topic||"untitled").slice(0,15)}.txt`,finalText)}>⬇ 다운로드</button>
            </div>
          </div>
          <div className="card" style={{padding:0,overflow:"hidden"}}>
            <div style={{display:"flex",minHeight:400}}>
              {/* Left: step result summary */}
              <div style={{width:200,flexShrink:0,borderRight:"1px solid var(--navy-700)",overflowY:"auto"}}>
                <div style={{padding:"10px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>단계별 요약</div>
                {WORKFLOW_STEPS.filter(st=>stepStatus[st.key]==="done"||stepStatus[st.key]==="error").map(step=>(
                  <div key={step.key} style={{padding:"8px 12px",borderBottom:"1px solid var(--navy-700)"}}>
                    <div style={{fontSize:11,display:"flex",gap:6,alignItems:"center"}}>
                      <span>{step.icon}</span>
                      <span style={{color:stepStatus[step.key]==="done"?"#7cc98a":"var(--danger)"}}>{step.label}</span>
                    </div>
                    {stepResults[step.key]?.parsed?.structureScore !== undefined && (
                      <div style={{fontSize:10,color:"var(--slate)",marginTop:2}}>구조 점수: {stepResults[step.key].parsed.structureScore}</div>
                    )}
                    {stepResults[step.key]?.parsed?.finalScore !== undefined && (
                      <div style={{fontSize:10,color:"var(--slate)",marginTop:2}}>최종 점수: {stepResults[step.key].parsed.finalScore}</div>
                    )}
                  </div>
                ))}
              </div>
              {/* Right: full text */}
              <div style={{flex:1,display:"flex",flexDirection:"column"}}>
                <div style={{padding:"10px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>👁 완성본 전문</div>
                <pre style={{whiteSpace:"pre-wrap",fontFamily:"'Noto Sans KR',sans-serif",fontSize:13,lineHeight:1.8,color:"var(--ivory)",margin:0,padding:"16px",flex:1,overflowY:"auto",maxHeight:600}}>{finalText}</pre>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================================================================
   ① 연구참여자 관리 — Participant Information Table
   ================================================================ */
function ParticipantsPage() {
  const proj = useProject();
  const s = proj.state;
  const [participants, setP] = useState(s.participants || []);
  const [form, setForm] = useState({id:"", gender:"여", age:"", career:"", role:"", interviewCount:1, interviewMin:60, note:""});
  const [editIdx, setEditIdx] = useState(null);
  const setF = (k,v) => setForm(f=>({...f,[k]:v}));
  const save = (arr) => { setP(arr); proj.update(prev=>({...prev, participants:arr})); };

  const add = () => {
    if (!form.id.trim()) return;
    if (editIdx !== null) {
      const arr = [...participants]; arr[editIdx] = {...form, idx: editIdx+1};
      save(arr); setEditIdx(null);
    } else {
      save([...participants, {...form, idx:participants.length+1}]);
    }
    setForm({id:"",gender:"여",age:"",career:"",role:"",interviewCount:1,interviewMin:60,note:""});
  };
  const startEdit = (i) => { setForm({...participants[i]}); setEditIdx(i); };
  const cancelEdit = () => { setEditIdx(null); setForm({id:"",gender:"여",age:"",career:"",role:"",interviewCount:1,interviewMin:60,note:""}); };
  const remove = (i) => { if (editIdx===i) cancelEdit(); save(participants.filter((_,j)=>j!==i)); };

  const [genLoading, setGenLoading] = useState(false);
  const [genError, setGenError] = useState("");
  const generateTable = async () => {
    if (participants.length===0) { setGenError("먼저 참여자를 추가해 주세요."); return; }
    setGenLoading(true); setGenError("");
    const list = participants.map((p,i)=>`참여자${i+1}: 성별=${p.gender}, 나이=${p.age}, 경력=${p.career}, 역할=${p.role}, 면담횟수=${p.interviewCount}회, 면담시간=${p.interviewMin}분`).join("\n");
    const sys = `당신은 한국 학술논문 연구방법론 전문가입니다. 아래 연구참여자 정보를 학술논문 연구방법 섹션에 적합하게 기술하세요. APA 형식에 맞게, (1) 참여자 특성 기술 문단(목적 표집 근거 포함, 150~200자), (2) 참여자 정보 요약표(연번·성별·연령·경력·역할·면담횟수·면담시간) 순으로 작성하세요. 텍스트만 출력하세요.`;
    const data = await callClaude([{role:"user",content:`연구주제: ${s.topic}\n\n${list}`}], {system:sys});
    setGenLoading(false);
    const text = data.error ? "" : extractText(data);
    if (text) proj.update(prev=>({...prev, paperDraft:{...prev.paperDraft, method: (prev.paperDraft.method||"") + "\n\n[연구참여자 정보]\n" + text}}));
    else setGenError("오프라인 상태 — 표를 직접 작성해 주세요.");
  };

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="👥 연구참여자 관리" subtitle="참여자 정보를 입력하면 방법론 섹션의 참여자 기술 문단과 표를 자동 생성합니다."/>
      <div className="card" style={{padding:18,marginTop:16}}>
        <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10}}>{editIdx!==null ? `✏ ${editIdx+1}번 참여자 수정 중` : "새 참여자 추가"}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:10}}>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>참여자 코드</label><input value={form.id} onChange={e=>setF("id",e.target.value)} placeholder="예: P1"/></div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>성별</label><select value={form.gender} onChange={e=>setF("gender",e.target.value)}><option>여</option><option>남</option><option>비공개</option></select></div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>연령</label>
            <select value={form.age} onChange={e=>setF("age",e.target.value)}>
              <option value="">선택</option>
              {AGE_OPTIONS.map(a=>(<option key={a}>{a}</option>))}
              <option value="직접입력">직접 입력</option>
            </select>
            {form.age==="직접입력" && <input style={{marginTop:4}} placeholder="예: 43세" onChange={e=>setF("age",e.target.value)}/>}
          </div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>경력</label>
            <select value={form.career} onChange={e=>setF("career",e.target.value)}>
              <option value="">선택</option>
              {CAREER_OPTIONS.map(c=>(<option key={c}>{c}</option>))}
              <option value="직접입력">직접 입력</option>
            </select>
            {form.career==="직접입력" && <input style={{marginTop:4}} placeholder="예: 12년 6개월" onChange={e=>setF("career",e.target.value)}/>}
          </div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>역할/직책</label><input value={form.role} onChange={e=>setF("role",e.target.value)} placeholder="예: 초등교사"/></div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>면담 횟수</label><input type="number" min="1" value={form.interviewCount} onChange={e=>setF("interviewCount",e.target.value)} /></div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>면담 시간(분)</label><input type="number" min="10" step="10" value={form.interviewMin} onChange={e=>setF("interviewMin",e.target.value)} /></div>
          <div><label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>비고</label><input value={form.note} onChange={e=>setF("note",e.target.value)} placeholder="특이사항"/></div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn-gold" onClick={add}>{editIdx!==null ? "✓ 수정 완료" : "+ 참여자 추가"}</button>
          {editIdx!==null && <button className="btn-ghost" onClick={cancelEdit}>취소</button>}
        </div>
      </div>
      {participants.length>0 && (
        <div style={{marginTop:16}}>
          <table>
            <thead><tr><th>번호</th><th>코드</th><th>성별</th><th>연령</th><th>경력</th><th>역할</th><th>면담횟수</th><th>면담시간</th><th>비고</th><th>수정</th><th>삭제</th></tr></thead>
            <tbody>
              {participants.map((p,i)=>(
                <tr key={i} style={{background: editIdx===i ? "rgba(201,162,39,0.06)" : "transparent"}}>
                  <td>{i+1}</td><td>{p.id}</td><td>{p.gender}</td><td>{p.age}</td><td>{p.career}</td><td>{p.role}</td><td>{p.interviewCount}회</td><td>{p.interviewMin}분</td><td>{p.note}</td>
                  <td><button className="btn-ghost" style={{padding:"3px 8px",fontSize:11}} onClick={()=>startEdit(i)}>수정</button></td>
                  <td><button className="btn-ghost" style={{padding:"3px 8px",fontSize:11,color:"var(--danger)"}} onClick={()=>remove(i)}>삭제</button></td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{marginTop:12,display:"flex",gap:8}}>
            <button className="btn-gold" onClick={generateTable} disabled={genLoading}>{genLoading?"생성 중...":"AI로 참여자 기술 문단 생성 → 연구방법에 삽입"}</button>
          </div>
          {genError && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{genError}</div>}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   ② 코딩 워크시트
   ================================================================ */
function CodingWorksheet() {
  const proj = useProject();
  const s = proj.state;
  const qtKey = s.qualSubType || "질적메타종합";
  const [codes, setCodes] = useState(s.codingData || []);
  const [newCode, setNewCode] = useState({quote:"",code:"",category:"",subcategory:"",source:""});
  const setNC = (k,v) => setNewCode(c=>({...c,[k]:v}));
  const save = (arr) => { setCodes(arr); proj.update(p=>({...p, codingData:arr})); };
  const add = () => { if(!newCode.quote.trim()) return; save([...codes, {...newCode, id:Date.now()}]); setNewCode({quote:"",code:"",category:"",subcategory:"",source:""}); };
  const remove = (id) => save(codes.filter(c=>c.id!==id));
  const [aiLoading, setAILoading] = useState(false);
  const generateFromData = async () => {
    if (codes.length<2) return;
    setAILoading(true);
    const sys = `당신은 질적연구 코딩 전문가입니다. 아래 코딩 데이터를 분석하여 범주화된 주제 분석 결과를 JSON으로 반환하세요:
{ "themes": [{"theme":"상위 주제","subcategories":["하위 주제1","하위 주제2"],"concepts":["핵심 개념"],"sampleQuote":"대표 인용문"}] }`;
    const data = await callClaude([{role:"user",content:codes.map(c=>`코드: ${c.code} / 범주: ${c.category} / 원자료: "${c.quote}"`).join("\n")}], {system:sys});
    setAILoading(false);
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed && parsed.themes) {
      const themeArr = parsed.themes.map(t=>({source:"코딩 분석",theme:t.theme}));
      proj.update(p=>({...p, themes:[...p.themes, ...themeArr]}));
    }
  };
  const categories = [...new Set(codes.map(c=>c.category).filter(Boolean))];
  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🗂 코딩 워크시트" subtitle={`${QUAL_TYPES[qtKey]?.label || qtKey} 방법론의 코딩 작업을 이 곳에서 진행하세요.`}/>
      <div className="card" style={{padding:16,marginTop:16}}>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <textarea style={{minHeight:70}} placeholder="원자료 인용문 (참여자 진술, 면담 내용 등)" value={newCode.quote} onChange={e=>setNC("quote",e.target.value)}/>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            <input style={{flex:1}} placeholder="코드명" value={newCode.code} onChange={e=>setNC("code",e.target.value)}/>
            <input style={{flex:1}} placeholder="범주" value={newCode.category} onChange={e=>setNC("category",e.target.value)}/>
            <input style={{flex:1}} placeholder="하위범주" value={newCode.subcategory} onChange={e=>setNC("subcategory",e.target.value)}/>
            <input style={{flex:1}} placeholder="출처(참여자코드·논문)" value={newCode.source} onChange={e=>setNC("source",e.target.value)}/>
          </div>
          <button className="btn-gold" style={{width:120}} onClick={add}>+ 코드 추가</button>
        </div>
      </div>
      {codes.length>0 && (
        <div style={{marginTop:16}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:13,color:"var(--slate)"}}>총 {codes.length}개 코드 · {categories.length}개 범주</div>
            <button className="btn-ghost" style={{fontSize:12,padding:"6px 12px"}} onClick={generateFromData} disabled={aiLoading}>{aiLoading?"분석 중...":"AI 주제 분석 → 메타종합 랩에 전송"}</button>
          </div>
          {categories.map(cat=>(
            <div key={cat} style={{marginBottom:12}}>
              <div style={{fontSize:12,color:"var(--gold-400)",fontWeight:700,marginBottom:6,textTransform:"uppercase"}}>📂 {cat}</div>
              {codes.filter(c=>c.category===cat).map(c=>(
                <div key={c.id} className="card" style={{padding:12,marginBottom:6}}>
                  <div style={{display:"flex",justifyContent:"space-between",gap:8}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:11,color:"var(--gold-300)",marginBottom:3}}>코드: {c.code} {c.subcategory && `/ 하위: ${c.subcategory}`} {c.source && `[${c.source}]`}</div>
                      <div style={{fontSize:13,color:"var(--slate)",fontStyle:"italic"}}>"{c.quote}"</div>
                    </div>
                    <button className="btn-ghost" style={{padding:"3px 8px",fontSize:11,flexShrink:0}} onClick={()=>remove(c.id)}>삭제</button>
                  </div>
                </div>
              ))}
            </div>
          ))}
          {codes.filter(c=>!c.category).length>0 && (
            <div style={{marginBottom:12}}>
              <div style={{fontSize:12,color:"var(--slate)",marginBottom:6}}>📂 미분류</div>
              {codes.filter(c=>!c.category).map(c=>(
                <div key={c.id} className="card" style={{padding:12,marginBottom:6}}>
                  <div style={{fontSize:11,color:"var(--gold-300)",marginBottom:3}}>코드: {c.code}</div>
                  <div style={{fontSize:13,color:"var(--slate)",fontStyle:"italic"}}>"{c.quote}"</div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   ③ PRISMA 흐름도 (SVG 자동 생성)
   ================================================================ */
function PRISMAPage() {
  const proj = useProject();
  const s = proj.state;
  const [data, setData] = useState(s.prismaData || {
    identified:0, screened:0, eligibility:0, included:0,
    removedDuplicates:0, excludedScreening:0, excludedEligibility:"",
    databases:"RISS, DBpia, KISS, PubMed",
  });
  const setD = (k,v) => { const next={...data,[k]:v}; setData(next); proj.update(p=>({...p,prismaData:next})); };
  const W=640, H=480;
  const box = (x,y,w,h,text,sub,color="#14243f") => (
    <g key={`${x}-${y}`}>
      <rect x={x} y={y} width={w} height={h} rx="6" fill={color} stroke="#c9a227" strokeWidth="1.5"/>
      <text x={x+w/2} y={y+h/2-6} textAnchor="middle" fontSize="12" fontWeight="700" fill="#f2ecdd">{text}</text>
      {sub && <text x={x+w/2} y={y+h/2+10} textAnchor="middle" fontSize="11" fill="#dbb84e">{sub}</text>}
    </g>
  );
  const arrow = (x1,y1,x2,y2) => (
    <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="#28406b" strokeWidth="2" markerEnd="url(#arr)"/>
  );
  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📊 PRISMA 흐름도" subtitle="체계적 문헌 검색 및 선정 과정을 PRISMA 형식의 흐름도로 자동 생성합니다."/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginTop:16,marginBottom:20}}>
        {[
          ["검색 확인 논문 수",data.identified,"identified"],
          ["제목/초록 검토 논문",data.screened,"screened"],
          ["원문 검토 논문",data.eligibility,"eligibility"],
          ["최종 포함 논문",data.included,"included"],
          ["중복 제거",data.removedDuplicates,"removedDuplicates"],
          ["제목/초록 단계 제외",data.excludedScreening,"excludedScreening"],
        ].map(([label,val,key])=>(
          <div key={key} className="card" style={{padding:12}}>
            <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>{label}</label>
            <input type="number" value={val} onChange={e=>setD(key,+e.target.value)}/>
          </div>
        ))}
        <div className="card" style={{padding:12,gridColumn:"1/-1"}}>
          <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>원문 검토 단계 제외 이유 (예: 포함 기준 미충족 30편, 질 낮음 5편)</label>
          <input style={{width:"100%"}} value={data.excludedEligibility} onChange={e=>setD("excludedEligibility",e.target.value)} placeholder="제외 이유와 편수"/>
        </div>
        <div className="card" style={{padding:12,gridColumn:"1/-1"}}>
          <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>검색 데이터베이스</label>
          <input style={{width:"100%"}} value={data.databases} onChange={e=>setD("databases",e.target.value)}/>
        </div>
      </div>
      <div className="card" style={{padding:20}}>
        <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:12,textTransform:"uppercase"}}>PRISMA 흐름도 (논문에 삽입 가능)</div>
        <svg width="100%" viewBox={`0 0 ${W} ${H}`}>
          <defs>
            <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
              <path d="M0,0 L8,4 L0,8 Z" fill="#28406b"/>
            </marker>
          </defs>
          {box(180,20,280,50,`데이터베이스 검색 (${data.databases.split(",").length}개)`,`n = ${data.identified}`)}
          {arrow(320,70,320,110)}
          {box(180,110,280,50,"제목/초록 선별",`n = ${data.screened}`)}
          {arrow(320,160,320,200)}
          {box(180,200,280,50,"원문 검토",`n = ${data.eligibility}`)}
          {arrow(320,250,320,290)}
          {box(180,290,280,50,"최종 포함 논문","",`rgba(201,162,39,0.18)`)}
          {<text x={320} y={322} textAnchor="middle" fontSize="14" fontWeight="800" fill="#dbb84e">n = {data.included}</text>}
          {box(510,110,120,40,"중복 제거",`n = ${data.removedDuplicates}`, "#14243f")}
          {arrow(460,135,510,135)}
          {box(510,200,120,40,"제외",`n = ${data.screened - data.eligibility}`,"#14243f")}
          {arrow(460,225,510,225)}
          {data.excludedEligibility && box(510,290,120,40,"제외",data.excludedEligibility.slice(0,15),"#14243f")}
          {data.excludedEligibility && arrow(460,315,510,315)}
        </svg>
        <div style={{fontSize:11,color:"var(--slate)",marginTop:8}}>이 흐름도를 논문에 삽입하려면 화면 캡처 또는 SVG 복사를 이용하세요.</div>
      </div>
    </div>
  );
}

/* ================================================================
   ④ 연구자 성찰 일지 (Reflexivity Journal)
   ================================================================ */
function ReflexivityJournal() {
  const proj = useProject();
  const s = proj.state;
  const [entries, setEntries] = useState(s.reflexivityLog || []);
  const [form, setForm] = useState({date:new Date().toISOString().slice(0,10), type:"성찰", content:""});
  const TYPES = ["성찰","편견 확인","참여자 반응","분석 메모","결정 기록","감정 기록"];
  const save = (arr) => { setEntries(arr); proj.update(p=>({...p, reflexivityLog:arr})); };
  const add = () => { if (!form.content.trim()) return; save([...entries, {...form, id:Date.now()}]); setForm({date:new Date().toISOString().slice(0,10), type:"성찰", content:""}); };
  const remove = (id) => save(entries.filter(e=>e.id!==id));
  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📔 연구자 성찰 일지" subtitle="Reflexivity Journal — 연구자 편견 인식·괄호치기 과정을 기록합니다. 심사에서 신뢰성 근거로 활용됩니다."/>
      <div className="card" style={{padding:16,marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
        <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
          <input type="date" style={{width:150}} value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
          <select style={{width:150}} value={form.type} onChange={e=>setForm(f=>({...f,type:e.target.value}))}>
            {TYPES.map(t=>(<option key={t}>{t}</option>))}
          </select>
        </div>
        <textarea style={{minHeight:90}} placeholder="성찰 내용을 자유롭게 기록하세요. (연구자 경험, 편견, 참여자와의 관계, 분석 결정 이유 등)" value={form.content} onChange={e=>setForm(f=>({...f,content:e.target.value}))}/>
        <button className="btn-gold" style={{width:100}} onClick={add}>기록 추가</button>
      </div>
      <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
        {entries.length===0 && <div style={{fontSize:13,color:"var(--slate)"}}>아직 성찰 기록이 없습니다. 연구 진행 중 틈틈이 기록해두세요.</div>}
        {[...entries].reverse().map(e=>(
          <div key={e.id} className="card" style={{padding:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <span className="tag">{e.type}</span>
                <span style={{fontSize:12,color:"var(--slate)"}}>{e.date}</span>
              </div>
              <button className="btn-ghost" style={{padding:"3px 8px",fontSize:11}} onClick={()=>remove(e.id)}>삭제</button>
            </div>
            <div style={{fontSize:13,lineHeight:1.7}}>{e.content}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   ⑤ 연구계획서 (Research Proposal)
   ================================================================ */
function ProposalPage() {
  const proj = useProject();
  const s = proj.state;
  const [proposal, setProposal] = useState(s.proposal || {title:"",background:"",purpose:"",questions:"",method:"",timeline:"",significance:""});
  const setP = (k,v) => { const next={...proposal,[k]:v}; setProposal(next); proj.update(p=>({...p,proposal:next})); };
  const [loading, setLoading] = useState({});
  const [error, setError] = useState("");
  const FIELDS = [
    {key:"title",label:"연구 제목",hint:"연구주제와 방법을 모두 담은 정식 제목",multi:false},
    {key:"background",label:"연구의 필요성 및 배경",hint:"왜 이 연구가 필요한지 사회적·학문적 맥락",multi:true},
    {key:"purpose",label:"연구 목적",hint:"이 연구로 무엇을 달성할 것인가",multi:true},
    {key:"questions",label:"연구 문제",hint:"구체적인 연구 문제 2~3개",multi:true},
    {key:"method",label:"연구 방법",hint:"연구유형, 참여자, 자료수집, 분석방법",multi:true},
    {key:"timeline",label:"연구 일정",hint:"단계별 진행 계획",multi:true},
    {key:"significance",label:"연구의 의의 및 기대 효과",hint:"이론적·실천적 기여",multi:true},
  ];
  const generate = async (field) => {
    setLoading(l=>({...l,[field.key]:true})); setError("");
    const qtInfo = QUAL_TYPES[s.qualSubType||"질적메타종합"];
    const sys = `당신은 한국 대학원 연구계획서 작성 전문가입니다. "${field.label}" 항목을 학술적으로 작성하세요. 200~300자 내외. 텍스트만 출력하세요.`;
    const data = await callClaude([{role:"user",content:`연구주제: ${s.topic}\n연구유형: ${s.type}(${qtInfo?.label||""})\n추천 제목: ${(s.titles||[])[0]||"미정"}\n선행연구: ${(s.papers||[]).map(p=>p.title).join(", ")||"없음"}`}], {system:sys});
    setLoading(l=>({...l,[field.key]:false}));
    const text = data.error ? "" : extractText(data);
    if (text) setP(field.key, text);
    else setError("오프라인 — 직접 작성해 주세요.");
  };
  const download = () => {
    const text = FIELDS.map(f=>`【${f.label}】\n${proposal[f.key]||"(미작성)"}\n`).join("\n");
    downloadText(`proposal-${(s.topic||"untitled").slice(0,15)}.txt`, `연구계획서\n${"=".repeat(30)}\n\n${text}`);
  };
  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📋 연구계획서" subtitle="학위논문 심사위원회 제출용 연구계획서를 자동 작성합니다."/>
      <div style={{marginTop:16,marginBottom:14,display:"flex",justifyContent:"flex-end"}}>
        <button className="btn-gold" onClick={download}>⬇ 연구계획서 다운로드</button>
      </div>
      {error && <div style={{color:"var(--danger)",fontSize:12,marginBottom:10}}>{error}</div>}
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {FIELDS.map(field=>(
          <div key={field.key} className="card" style={{padding:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div>
                <div style={{fontWeight:700}}>{field.label}</div>
                <div style={{fontSize:12,color:"var(--slate)"}}>{field.hint}</div>
              </div>
              <button className="btn-ghost" style={{fontSize:12,padding:"6px 10px"}} disabled={loading[field.key]} onClick={()=>generate(field)}>{loading[field.key]?"생성 중...":"AI 자동 작성"}</button>
            </div>
            {field.multi ? (
              <textarea style={{width:"100%",minHeight:80}} placeholder="AI 자동 작성 또는 직접 입력" value={proposal[field.key]} onChange={e=>setP(field.key,e.target.value)}/>
            ) : (
              <input style={{width:"100%"}} placeholder="AI 자동 작성 또는 직접 입력" value={proposal[field.key]} onChange={e=>setP(field.key,e.target.value)}/>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   ⑥ 면담 질문지 자동 생성
   ================================================================ */
function InterviewGuide() {
  const proj = useProject();
  const s = proj.state;
  const [questions, setQuestions] = useState(s.interviewGuide || []);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [editIdx, setEditIdx] = useState(null);
  const [selectedIdx, setSelectedIdx] = useState(new Set());
  const qtKey = s.qualSubType || "질적메타종합";
  const qtInfo = QUAL_TYPES[qtKey];
  const needsInterviewGuide = ["현상학적연구","근거이론","내러티브연구","사례연구"].includes(qtKey);

  const generate = async () => {
    setLoading(true); setError(""); setSelectedIdx(new Set());
    const sys = `당신은 ${qtInfo?.label||qtKey} 전문 연구자입니다. 이 연구유형에 적합한 심층면담 질문지를 충분하게 작성하세요.
구성: 도입 질문 2개(라포 형성), 핵심 질문 7~9개(연구문제 탐색, 구체적이고 개방적으로), 확장 질문 4개(심화 탐색), 종결 질문 2개(마무리 및 추가 의견)
각 질문은 연구주제와 직접 연결되어야 합니다. 반드시 JSON 배열로만 답변하세요:
[ { "type":"도입/핵심/확장/종결", "question":"질문 내용", "followUp":"심화 탐색 질문" } ]`;
    const data = await callClaude([{role:"user",content:`연구주제: ${s.topic}\n연구유형: ${qtInfo?.label||qtKey}\n연구 목적: ${s.type} 방법으로 "${s.topic}"의 경험을 심층 탐구`}], {system:sys});
    setLoading(false);
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed && Array.isArray(parsed) && parsed.length >= 5) {
      setQuestions(parsed);
      proj.update(p=>({...p, interviewGuide:parsed}));
    } else {
      const fallback = [
        {type:"도입", question:`오늘 면담에 참여해 주셔서 감사합니다. 먼저 본인의 현재 역할과 ${s.topic||"이 주제"}와 관련된 경험을 간략히 소개해 주시겠어요?`, followUp:"이 분야에 처음 발을 들여놓게 된 계기는 무엇인가요?"},
        {type:"도입", question:`${s.topic||"오늘 이야기할 주제"}에 대해 처음 경험하거나 인식하게 된 것이 언제였나요?`, followUp:"그 당시 상황을 좀 더 구체적으로 말씀해 주실 수 있나요?"},
        {type:"핵심", question:"그 경험이 처음 시작될 때 어떤 상황이었나요? 가능한 한 구체적으로 이야기해 주세요.", followUp:"그 순간 어떤 생각과 감정이 드셨나요?"},
        {type:"핵심", question:"그 과정에서 가장 힘들었던 부분은 무엇이었나요?", followUp:"그 어려움을 어떻게 헤쳐나가셨나요? 어떤 도움이 있었나요?"},
        {type:"핵심", question:"그 경험을 통해 본인이 가장 크게 변화하거나 깨달은 것은 무엇인가요?", followUp:"그 변화가 지금의 본인에게 어떤 의미를 갖나요?"},
        {type:"핵심", question:"주변 사람들(동료, 가족, 기관 등)이 그 과정에서 어떤 역할을 했나요?", followUp:"그 지지가 없었다면 어떻게 되었을 것 같으세요?"},
        {type:"핵심", question:"그 경험을 지금 돌이켜보면 어떤 감정이 드시나요?", followUp:"시간이 지나면서 그 경험의 의미가 바뀐 부분이 있나요?"},
        {type:"확장", question:"비슷한 경험을 하는 다른 사람들에게 어떤 말을 해주고 싶으신가요?", followUp:""},
        {type:"확장", question:"이 경험을 더 잘 이해하거나 지원하기 위해 사회적·제도적으로 어떤 변화가 필요하다고 생각하시나요?", followUp:""},
        {type:"확장", question:"혹시 오늘 면담에서 다루지 않았지만 중요하다고 생각하는 내용이 있으신가요?", followUp:""},
        {type:"종결", question:"오늘 나눈 이야기 중 가장 기억에 남는 부분이나 더 강조하고 싶으신 내용이 있으시면 말씀해 주세요.", followUp:""},
        {type:"종결", question:"마지막으로 이 연구와 관련해 연구자에게 하고 싶은 말씀이 있으시다면 자유롭게 말씀해 주세요.", followUp:""},
      ];
      setQuestions(fallback);
      proj.update(p=>({...p, interviewGuide:fallback}));
      setError("오프라인 — 기본 질문지(12개)를 표시합니다. 직접 수정해서 사용하세요.");
    }
  };

  const updateQ = (i,k,v) => {
    const arr=[...questions]; arr[i]={...arr[i],[k]:v}; setQuestions(arr);
    proj.update(p=>({...p, interviewGuide:arr}));
  };
  const toggleSelect = (i) => {
    setSelectedIdx(prev => {
      const next = new Set(prev);
      if (next.has(i)) next.delete(i); else next.add(i);
      return next;
    });
  };
  const addQuestion = () => {
    const q = {type:"핵심", question:"새 질문을 입력하세요.", followUp:""};
    const arr=[...questions, q]; setQuestions(arr);
    proj.update(p=>({...p, interviewGuide:arr}));
    setEditIdx(arr.length-1);
  };
  const removeQ = (i) => {
    const arr=questions.filter((_,j)=>j!==i); setQuestions(arr);
    proj.update(p=>({...p, interviewGuide:arr}));
    setSelectedIdx(prev=>{ const n=new Set([...prev].filter(x=>x!==i).map(x=>x>i?x-1:x)); return n; });
  };

  const TYPE_COLORS = {도입:"#7cc98a",핵심:"var(--gold-300)",확장:"#80c8e9",종결:"var(--slate)"};
  const selectedCount = selectedIdx.size;

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🎙 면담 질문지" subtitle="연구유형에 맞는 반구조화 심층면담 질문지를 자동 생성합니다. 최소 12개 질문으로 구성됩니다."/>
      {!needsInterviewGuide && (
        <div className="card" style={{padding:14,marginTop:16,fontSize:13,color:"var(--gold-300)"}}>
          현재 선택된 유형({qtInfo?.label||qtKey})은 면담이 아닌 문헌 기반 연구입니다. 면담 질문지가 필요하시면 현상학, 근거이론, 내러티브, 사례연구 중 하나를 선택해 주세요.
        </div>
      )}
      <div style={{marginTop:16,display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
        <button className="btn-gold" onClick={generate} disabled={loading}>{loading?"생성 중...":"면담 질문지 자동 생성 (12개 이상)"}</button>
        {questions.length>0 && (
          <>
            <button className="btn-ghost" style={{fontSize:12}} onClick={addQuestion}>+ 질문 추가</button>
            <button className="btn-ghost" style={{fontSize:12}} onClick={()=>downloadText(`interview-guide-${(s.topic||"untitled").slice(0,12)}.txt`, questions.map((q,i)=>`[${q.type}] Q${i+1}. ${q.question}${q.followUp?`\n   → ${q.followUp}`:""}`).join("\n\n"))}>⬇ 다운로드</button>
          </>
        )}
        {selectedCount > 0 && (
          <span className="tag" style={{color:"#7cc98a"}}>{selectedCount}개 선택됨 ✓</span>
        )}
      </div>
      {loading && <div style={{marginTop:10}}><Loader text="면담 질문지를 생성하는 중입니다..."/></div>}
      {error && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{error}</div>}
      {questions.length > 0 && <div style={{fontSize:12,color:"var(--slate)",marginTop:8}}>💡 '선택' 버튼을 클릭하면 완료로 바뀝니다. 실제 사용할 질문을 선택해서 표시해두세요.</div>}
      <div style={{marginTop:16,display:"flex",flexDirection:"column",gap:10}}>
        {questions.map((q,i)=>{
          const isSelected = selectedIdx.has(i);
          return (
            <div key={i} className="card" style={{padding:14,borderLeft:`3px solid ${isSelected?"#7cc98a":TYPE_COLORS[q.type]||"var(--navy-600)"}`}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,gap:6,flexWrap:"wrap"}}>
                <span className="tag" style={{color:isSelected?"#7cc98a":TYPE_COLORS[q.type]||"var(--slate)"}}>{q.type}</span>
                <div style={{display:"flex",gap:5}}>
                  <button className="btn-ghost" style={{fontSize:11,padding:"3px 10px",
                    borderColor:isSelected?"#7cc98a":"var(--navy-600)",
                    color:isSelected?"#7cc98a":"var(--ivory)"}}
                    onClick={()=>toggleSelect(i)}>
                    {isSelected ? "✓ 완료" : "선택"}
                  </button>
                  <button className="btn-ghost" style={{fontSize:11,padding:"3px 8px"}} onClick={()=>setEditIdx(editIdx===i?null:i)}>{editIdx===i?"편집닫기":"편집"}</button>
                  <button className="btn-ghost" style={{fontSize:11,padding:"3px 8px",color:"var(--danger)"}} onClick={()=>removeQ(i)}>삭제</button>
                </div>
              </div>
              {editIdx===i ? (
                <>
                  <div style={{display:"flex",gap:8,marginBottom:6}}>
                    <select style={{width:"auto"}} value={q.type} onChange={e=>updateQ(i,"type",e.target.value)}>
                      {["도입","핵심","확장","종결"].map(t=>(<option key={t}>{t}</option>))}
                    </select>
                  </div>
                  <textarea style={{width:"100%",minHeight:60,marginBottom:6}} value={q.question} onChange={e=>updateQ(i,"question",e.target.value)}/>
                  <input style={{width:"100%"}} placeholder="심화 탐색 질문 (선택)" value={q.followUp||""} onChange={e=>updateQ(i,"followUp",e.target.value)}/>
                </>
              ) : (
                <>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:q.followUp?6:0}}>Q{i+1}. {q.question}</div>
                  {q.followUp && <div style={{fontSize:12,color:"var(--slate)"}}>↳ {q.followUp}</div>}
                </>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ================================================================
   ⑦ 논문 버전 관리 (Version History) — DraftSectionCard 안에도 연동
   ================================================================ */
function VersionHistory() {
  const proj = useProject();
  const s = proj.state;
  const versions = s.draftVersions || [];
  const saveVersion = () => {
    const ver = { id:Date.now(), date:new Date().toLocaleString('ko-KR'), label:`버전 ${versions.length+1}`, paperDraft:{...s.paperDraft} };
    proj.update(p=>({...p, draftVersions:[...(p.draftVersions||[]), ver]}));
  };
  const restore = (ver) => {
    if (!window.confirm(`"${ver.label}" 버전으로 되돌리시겠습니까? 현재 작성 내용이 덮어씌워집니다.`)) return;
    proj.update(p=>({...p, paperDraft:{...ver.paperDraft}}));
  };
  const SECTION_LABELS = {abstract:"국문초록",keywords:"주제어",intro:"서론",theory:"이론적 배경",method:"연구방법",results:"결과",discussion:"결론 및 논의",suggestion:"제언"};
  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🗃 버전 관리" subtitle="현재 원고를 스냅샷으로 저장하고, 이전 버전으로 되돌릴 수 있습니다."/>
      <div style={{marginTop:16,marginBottom:16}}>
        <button className="btn-gold" onClick={saveVersion}>📸 현재 원고 버전 저장</button>
      </div>
      {versions.length===0 && <div style={{fontSize:13,color:"var(--slate)"}}>저장된 버전이 없습니다. 원고 작성 중 주요 시점마다 버전을 저장해두세요.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:12}}>
        {[...versions].reverse().map(ver=>(
          <div key={ver.id} className="card" style={{padding:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:10}}>
              <div>
                <div style={{fontWeight:700}}>{ver.label}</div>
                <div style={{fontSize:12,color:"var(--slate)"}}>{ver.date}</div>
              </div>
              <button className="btn-ghost" style={{fontSize:12,padding:"6px 12px"}} onClick={()=>restore(ver)}>이 버전으로 복원</button>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {Object.entries(ver.paperDraft||{}).filter(([,v])=>v&&v.trim()).map(([k])=>(
                <span key={k} className="tag" style={{color:"#7cc98a"}}>{SECTION_LABELS[k]||k}</span>
              ))}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   ⑧ 표절 / APA 일치 검사기 (Plagiarism & Citation Checker)
      — ReferencesPage 안에 버튼으로 연결
   ================================================================ */
function CitationChecker({ draft, papers }) {
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const check = async () => {
    if (!draft || !draft.trim()) { setError("원고가 없습니다."); return; }
    setLoading(true); setError("");
    const refs = papers.map(p=>`${p.authors} / ${p.title}`).join("\n");
    const sys = `당신은 학술 인용 검증 전문가입니다. 원고에서 APA 본문 인용이 없는 주장을 찾고, 등록된 참고문헌과 원고의 인용이 일치하는지 확인하세요.
반드시 JSON으로만 답변하세요:
{ "missingCitations": ["인용 없는 주요 주장 1","주장 2"], "mismatchedRefs": ["불일치 항목"], "similarityWarnings": ["선행연구 문장과 유사도 높은 문장"], "overallScore": 0-100, "summary": "1~2문장 요약" }`;
    const data = await callClaude([{role:"user",content:`등록 참고문헌:\n${refs}\n\n[원고 텍스트]\n${draft.slice(0,4000)}`}], {system:sys});
    setLoading(false);
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (!parsed) { setError("오프라인 — 실시간 검사를 받지 못했습니다."); return; }
    setResult(parsed);
  };
  return (
    <div style={{marginTop:16}}>
      <button className="btn-ghost" style={{fontSize:12,padding:"7px 12px"}} onClick={check} disabled={loading}>{loading?"검사 중...":"🔍 인용·출처 일치 검사"}</button>
      {loading && <div style={{marginTop:8}}><Loader text="인용 및 출처 일치 여부를 검사하는 중..."/></div>}
      {error && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{error}</div>}
      {result && (
        <div className="card" style={{padding:16,marginTop:10}}>
          <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8}}>인용 검사 결과 — 점수: <span className="mono" style={{color:"var(--gold-300)"}}>{result.overallScore}</span></div>
          <div style={{fontSize:13,marginBottom:8}}>{result.summary}</div>
          {result.missingCitations?.length>0 && <div style={{marginBottom:6}}><div style={{fontSize:11,color:"var(--danger)",marginBottom:4}}>⚠ 인용 없는 주장</div>{result.missingCitations.map((m,i)=>(<div key={i} style={{fontSize:12,padding:"2px 0"}}>• {m}</div>))}</div>}
          {result.similarityWarnings?.length>0 && <div><div style={{fontSize:11,color:"var(--gold-400)",marginBottom:4}}>⚠ 유사도 경고</div>{result.similarityWarnings.map((m,i)=>(<div key={i} style={{fontSize:12,padding:"2px 0"}}>• {m}</div>))}</div>}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   발표 자료(PPT) 스튜디오
   — 논문 중간발표·최종발표용 슬라이드를 AI가 생성하고
     자체 슬라이드쇼 HTML 파일로 다운로드합니다.
   ================================================================ */
const SLIDE_TEMPLATES = [
  { key:"midterm", label:"중간 발표", desc:"연구주제·연구방법·예비 결과 중심 (10~12슬라이드)" },
  { key:"final",   label:"최종 발표", desc:"연구 전체 요약 + 결론·함의·제언 (12~15슬라이드)" },
  { key:"proposal",label:"연구계획 발표", desc:"연구필요성·연구방법 계획 중심 (8~10슬라이드)" },
];

function buildSlideHTML(slides, meta) {
  const esc = (s="") => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const slideBlocks = slides.map((sl, i) => `
    <div class="slide" id="slide-${i}">
      <div class="slide-num">${i+1} / ${slides.length}</div>
      <div class="slide-content">
        ${sl.type === "title"
          ? `<div class="title-block"><div class="main-title">${esc(sl.title)}</div><div class="sub-title">${esc(sl.subtitle||"")}</div><div class="meta-info">${esc(sl.meta||"")}</div></div>`
          : `<h2 class="slide-heading">${esc(sl.title)}</h2>
             <div class="body-area">${
               (sl.bullets||[]).map(b=>`<div class="bullet">▸ ${esc(b)}</div>`).join("")
             }${sl.note ? `<div class="note-box">💡 ${esc(sl.note)}</div>`:""}</div>`
        }
      </div>
    </div>`).join("\n");

  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>${esc(meta.title)} — 발표 자료</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1a30;font-family:'Malgun Gothic','나눔고딕',sans-serif;overflow:hidden;}
.slide{display:none;width:100vw;height:100vh;background:linear-gradient(135deg,#0d1a30 0%,#14243f 60%,#1c3054 100%);
  position:relative;flex-direction:column;justify-content:center;align-items:center;padding:60px;}
.slide.active{display:flex;}
.slide-num{position:absolute;bottom:24px;right:32px;font-size:13px;color:#8fa0ba;font-family:monospace;}
.slide-content{width:100%;max-width:1000px;}
.title-block{text-align:center;}
.main-title{font-size:42px;font-weight:900;color:#f2ecdd;line-height:1.25;margin-bottom:20px;font-family:'Malgun Gothic',sans-serif;}
.sub-title{font-size:22px;color:#c9a227;margin-bottom:16px;}
.meta-info{font-size:16px;color:#8fa0ba;}
.slide-heading{font-size:30px;font-weight:700;color:#c9a227;border-bottom:2px solid #c9a227;padding-bottom:12px;margin-bottom:28px;}
.body-area{display:flex;flex-direction:column;gap:14px;}
.bullet{font-size:19px;color:#f2ecdd;line-height:1.6;padding:10px 16px;background:rgba(255,255,255,0.04);border-left:4px solid #c9a227;border-radius:4px;}
.note-box{font-size:15px;color:#dbb84e;background:rgba(201,162,39,0.08);border:1px solid rgba(201,162,39,0.3);border-radius:6px;padding:12px 16px;margin-top:10px;}
.nav{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);display:flex;gap:16px;z-index:100;}
.nav button{background:rgba(20,36,63,0.9);border:1px solid #28406b;color:#f2ecdd;padding:10px 24px;
  border-radius:6px;cursor:pointer;font-size:14px;font-family:inherit;transition:border-color .15s;}
.nav button:hover{border-color:#c9a227;color:#c9a227;}
.progress{position:fixed;bottom:0;left:0;height:3px;background:#c9a227;transition:width .3s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.slide.active .slide-content{animation:fadeIn .4s ease;}
@media print{.nav,.slide-num,.progress{display:none!important}.slide{display:flex!important;page-break-after:always;width:297mm;height:210mm;}}
</style>
</head>
<body>
${slideBlocks}
<div class="nav">
  <button onclick="go(-1)">← 이전</button>
  <button onclick="toggleFS()">전체화면</button>
  <button onclick="go(1)">다음 →</button>
</div>
<div class="progress" id="prog"></div>
<script>
var cur=0,total=${slides.length};
function show(n){
  document.querySelectorAll('.slide').forEach(function(s){s.classList.remove('active');});
  var el=document.getElementById('slide-'+n);
  if(el){el.classList.add('active');}
  document.getElementById('prog').style.width=((n+1)/total*100)+'%';
}
function go(d){cur=Math.max(0,Math.min(total-1,cur+d));show(cur);}
function toggleFS(){if(!document.fullscreenElement){document.documentElement.requestFullscreen();}else{document.exitFullscreen();}}
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);if(e.key==='f')toggleFS();});
show(0);
<\/script>
</body>
</html>`;
}

function PresentationStudio() {
  const proj = useProject();
  const s = proj.state;
  const [template, setTemplate] = useState("midterm");
  const [loading, setLoading] = useState(false);
  const [slides, setSlides] = useState(null);
  const [error, setError] = useState("");
  const [preview, setPreview] = useState(false);
  const [curSlide, setCurSlide] = useState(0);

  const qtKey = s.qualSubType || "질적메타종합";
  const qtInfo = QUAL_TYPES[qtKey];
  const tmpl = SLIDE_TEMPLATES.find(t=>t.key===template);

  const generateSlides = async () => {
    setLoading(true); setError(""); setSlides(null);
    const selPapers = (s.selectedPaperIds||[]).length > 0
      ? (s.selectedPaperIds).map(id=>s.papers[id]).filter(Boolean)
      : s.papers;
    const paperList = selPapers.slice(0,6).map(p=>`${p.authors||p.title} (${p.docType||""})`).join(", ");
    const themes = (s.themes||[]).map(t=>`${t.source}: ${t.theme}`).join(" / ");

    const sys = `당신은 한국 대학원 학술 발표 자료 전문가입니다. "${tmpl.label}" 슬라이드를 만들어주세요.
반드시 아래 JSON 배열 형식으로만 출력하세요 (설명 없이 JSON만):
[ { "type":"title 또는 content", "title":"슬라이드 제목", "subtitle":"(title 타입만)", "meta":"(title 타입만, 발표자/날짜/소속)", "bullets":["핵심 내용 1","핵심 내용 2","핵심 내용 3"], "note":"슬라이드 설명(선택)" } ]
규칙: 첫 슬라이드는 type=title, 나머지는 type=content. 각 슬라이드 bullets는 3~5개. 학술적이고 간결하게.`;

    const user = `연구주제: ${s.topic||"(미설정)"}
연구유형: ${s.type||"질적연구"} — ${qtInfo?.label||""}
추천 제목: ${(s.titles||[])[0]||"(미정)"}
선행연구: ${paperList||"없음"}
주제분석 결과: ${themes||"없음"}
개념화 문장: ${s.conceptSentence||""}
연구방법론 키워드: ${qtInfo?.keyTerms?.join(", ")||""}
목표 분량: ${s.targetPages||"A4 25매"}
발표 유형: ${tmpl.label} (${tmpl.desc})`;

    const data = await callClaude([{role:"user",content:user}], {system:sys});
    setLoading(false);

    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed && Array.isArray(parsed)) {
      setSlides(parsed);
    } else {
      // 오프라인 폴백 슬라이드
      const fallback = [
        {type:"title", title:s.titles?.[0]||s.topic||"연구 발표", subtitle:`${qtInfo?.label||s.type} 연구`, meta:`발표자: ${new Date().toLocaleDateString('ko-KR')}`},
        {type:"content", title:"연구의 필요성 및 목적", bullets:[`"${s.topic||""}" 관련 현상에 대한 체계적 이해 필요`,`기존 연구의 한계: 통합적 해석 부재`,`본 연구의 목적: ${qtInfo?.purpose||"해당 현상 탐구"}`,`연구 문제: 이 현상의 본질적 의미는 무엇인가?`]},
        {type:"content", title:"이론적 배경", bullets:[`${qtInfo?.label||s.type} 방법론 기반`,`이론가: ${qtInfo?.theorist||""}`,`핵심 개념: ${qtInfo?.keyTerms?.slice(0,3).join(", ")||""}`,`선행연구 ${(s.papers||[]).length}편 검토`]},
        {type:"content", title:"연구 방법", bullets:[`연구 설계: ${qtInfo?.label||s.type}`,`분석 방법: ${qtInfo?.analysisMethod||""}`,`자료: 선행연구 ${(s.papers||[]).length}편 선정`,`절차: 6단계 분석 절차 적용`]},
        ...(s.themes||[]).slice(0,4).map((t,i)=>({type:"content", title:`연구 결과 — 주제 ${i+1}`, bullets:[`출처: ${t.source}`, `핵심 주제: ${t.theme}`, `(결과 상세 내용은 원고 참조)`]})),
        {type:"content", title:"결론 및 함의", bullets:[`개념화: "${s.conceptSentence||""}"`,`이론적 함의: 해당 분야 지식 확장`,`실천적 함의: 현장 적용 방안`,`후속 연구 제언`]},
        {type:"content", title:"참고문헌 (주요)", bullets:(s.papers||[]).slice(0,4).map(p=>`${p.authors||p.title}`)},
        {type:"content", title:"감사합니다", bullets:["질문과 토론 환영합니다","연구의 한계: 추후 보완 예정","이 연구가 현장에 기여하기를 바랍니다"], note:"본 발표 자료는 Research Pilot AI로 생성되었습니다."},
      ];
      setSlides(fallback);
      setError("오프라인 상태 — 기본 슬라이드 구조를 표시합니다. 아티팩트 환경에서 실시간 AI 슬라이드를 받아보세요.");
    }
    setCurSlide(0);
  };

  const downloadPPT = () => {
    if (!slides) return;
    const meta = { title: s.titles?.[0]||s.topic||"연구 발표" };
    const html = buildSlideHTML(slides, meta);
    downloadText(`presentation-${(s.topic||"untitled").slice(0,15)}-${template}.html`, html);
  };

  const editBullet = (si, bi, val) => {
    const next = slides.map((sl,i)=>i===si ? {...sl, bullets:(sl.bullets||[]).map((b,j)=>j===bi?val:b)} : sl);
    setSlides(next);
  };
  const editTitle = (si, val) => setSlides(slides.map((sl,i)=>i===si?{...sl,title:val}:sl));

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🎞 발표 자료 스튜디오" subtitle="연구 중간발표·최종발표·연구계획 발표용 슬라이드를 AI가 생성하고 HTML 파일로 다운로드합니다."/>

      <div style={{marginTop:20,display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
        {SLIDE_TEMPLATES.map(t=>(
          <div key={t.key} className="card" style={{padding:16,cursor:"pointer",flex:1,minWidth:200,
            borderLeft: template===t.key ? "3px solid var(--gold-500)" : "3px solid transparent"}}
            onClick={()=>setTemplate(t.key)}>
            <div style={{fontWeight:700,marginBottom:4}}>{t.label}</div>
            <div style={{fontSize:12,color:"var(--slate)"}}>{t.desc}</div>
          </div>
        ))}
      </div>

      <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:20}}>
        <button className="btn-gold" onClick={generateSlides} disabled={loading}>
          {loading ? "슬라이드 생성 중..." : `🎞 ${tmpl?.label} 슬라이드 생성`}
        </button>
        {slides && (
          <>
            <button className="btn-ghost" onClick={downloadPPT}>⬇ HTML 슬라이드 다운로드 (브라우저에서 실행)</button>
            <button className="btn-ghost" onClick={()=>{setPreview(v=>!v);setCurSlide(0);}}>
              {preview ? "편집 모드로" : "👁 미리보기"}
            </button>
          </>
        )}
      </div>

      {loading && <Loader text="발표 슬라이드를 구성하는 중입니다..."/>}
      {error && <div style={{color:"var(--danger)",fontSize:13,marginBottom:12}}>{error}</div>}

      {slides && (
        <div style={{fontSize:12,color:"var(--slate)",marginBottom:12,padding:"8px 12px",background:"var(--navy-800)",borderRadius:6}}>
          💡 다운로드한 HTML 파일을 브라우저에서 열면 슬라이드쇼가 시작됩니다. 방향키(←→) 또는 스페이스바로 넘기고, F키로 전체화면 전환. Ctrl+P로 인쇄 가능.
        </div>
      )}

      {/* 미리보기 모드 */}
      {slides && preview && (
        <div style={{marginBottom:20}}>
          <div style={{background:"linear-gradient(135deg,#0d1a30,#14243f,#1c3054)",borderRadius:12,padding:"48px 60px",minHeight:380,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",position:"relative"}}>
            <div style={{position:"absolute",top:14,right:20,fontSize:12,color:"#8fa0ba"}}>{curSlide+1} / {slides.length}</div>
            {slides[curSlide]?.type==="title" ? (
              <div style={{textAlign:"center"}}>
                <div style={{fontSize:36,fontWeight:900,color:"#f2ecdd",marginBottom:16,lineHeight:1.25}}>{slides[curSlide].title}</div>
                {slides[curSlide].subtitle && <div style={{fontSize:20,color:"#c9a227",marginBottom:12}}>{slides[curSlide].subtitle}</div>}
                {slides[curSlide].meta && <div style={{fontSize:14,color:"#8fa0ba"}}>{slides[curSlide].meta}</div>}
              </div>
            ) : (
              <div style={{width:"100%",maxWidth:800}}>
                <div style={{fontSize:26,fontWeight:700,color:"#c9a227",borderBottom:"2px solid #c9a227",paddingBottom:10,marginBottom:20}}>{slides[curSlide].title}</div>
                <div style={{display:"flex",flexDirection:"column",gap:12}}>
                  {(slides[curSlide].bullets||[]).map((b,i)=>(

                  ))}

          </div>
          <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:12}}>
            <button className="btn-ghost" disabled={curSlide===0} onClick={()=>setCurSlide(c=>c-1)}>← 이전</button>
            <span style={{fontSize:12,color:"var(--slate)",display:"flex",alignItems:"center"}}>{curSlide+1}/{slides.length}</span>
            <button className="btn-ghost" disabled={curSlide===slides.length-1} onClick={()=>setCurSlide(c=>c+1)}>다음 →</button>
          </div>
          {/* 슬라이드 목차 */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10,justifyContent:"center"}}>
            {slides.map((_,i)=>(
              <button key={i} onClick={()=>setCurSlide(i)} style={{width:28,height:28,borderRadius:4,border:`1px solid ${curSlide===i?"var(--gold-500)":"var(--navy-600)"}`,background:curSlide===i?"var(--gold-500)":"transparent",color:curSlide===i?"var(--navy-950)":"var(--slate)",fontSize:11,cursor:"pointer"}}>{i+1}</button>
            ))}
          </div>
        </div>
      )}

      {/* 편집 모드 */}
      {slides && !preview && (
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {slides.map((sl,si)=>(
            <div key={si} className="card" style={{padding:16,borderLeft:si===0?"3px solid var(--gold-500)":"3px solid var(--navy-600)"}}>
              <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:10,flexWrap:"wrap"}}>
                <span className="tag">{si+1}번 슬라이드</span>
                <span className="tag" style={{color:"var(--gold-300)"}}>{sl.type==="title"?"타이틀":"콘텐츠"}</span>
              </div>
              <div style={{marginBottom:8}}>
                <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>슬라이드 제목</label>
                <input style={{width:"100%"}} value={sl.title||""} onChange={e=>editTitle(si,e.target.value)}/>
              </div>
              {sl.type==="title" && (
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                  <div>
                    <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>부제목</label>
                    <input value={sl.subtitle||""} onChange={e=>setSlides(slides.map((s,i)=>i===si?{...s,subtitle:e.target.value}:s))}/>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>메타 정보 (발표자/날짜)</label>
                    <input value={sl.meta||""} onChange={e=>setSlides(slides.map((s,i)=>i===si?{...s,meta:e.target.value}:s))}/>
                  </div>
                </div>
              )}
              {(sl.bullets||[]).map((b,bi)=>(
                <div key={bi} style={{display:"flex",gap:8,alignItems:"center",marginTop:6}}>
                  <span style={{color:"var(--gold-400)",fontSize:12,flexShrink:0}}>▸ {bi+1}</span>
                  <input style={{flex:1}} value={b} onChange={e=>editBullet(si,bi,e.target.value)}/>
                </div>
              ))}
              {sl.note !== undefined && (
                <div style={{marginTop:8}}>
                  <label style={{fontSize:11,color:"var(--slate)",display:"block",marginBottom:4}}>노트 (화면 하단 표시)</label>
                  <input style={{width:"100%"}} value={sl.note||""} onChange={e=>setSlides(slides.map((s,i)=>i===si?{...s,note:e.target.value}:s))}/>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
