                {QUAL_TYPES[type]?.label?.split(" (")[0]||type} {type===qtKey && <span style={{fontSize:11,color:"#7cc98a"}}> ← 현재 선택</span>}
              </div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {terms.map((t,i)=>(
                  <span key={i} className="tag" style={{cursor:"pointer",color: type===qtKey ? "var(--gold-300)":"var(--slate)",padding:"5px 10px"}}
                    title="클릭하면 복사됩니다"
                    onClick={()=>navigator.clipboard.writeText(t).catch(()=>{})}>
                    {t}
                  </span>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================================================================
   연구 윤리 자가 점검표 (전문가 추가 기능)
   ================================================================ */
function EthicsChecklist() {
  const proj = useProject();
  const [checks, setChecks] = useState(proj.state.ethicsChecks || {});
  const saveChecks = (next) => {
    setChecks(next);
    proj.update(s=>({...s, ethicsChecks: next}));
  };

  const ITEMS = [
    {cat:"IRB·동의", items:[
      "IRB(연구윤리위원회) 승인을 받았거나 면제 확인을 받았다.",
      "모든 연구참여자로부터 서면 동의(informed consent)를 받았다.",
      "참여자에게 연구 목적·절차·위험·이익·비밀보장을 충분히 설명했다.",
      "미성년자 참여 시 보호자 동의를 추가로 받았다.",
    ]},
    {cat:"데이터 관리", items:[
      "참여자 개인 식별 정보는 별도로 암호화하여 보관하고 있다.",
      "원자료(녹음파일, 전사본 등)는 안전한 장소에 5년 이상 보관할 계획이다.",
      "참여자를 식별할 수 없도록 가명 처리를 하였다.",
    ]},
    {cat:"연구 진실성", items:[
      "데이터를 조작·선택적으로 누락한 사실이 없다.",
      "모든 인용은 원문을 직접 확인하였다.",
      "AI 도구 사용 여부를 소속 기관 규정에 따라 공개할 계획이다.",
      "자기 표절(이전 논문 내용의 미공개 재사용)이 없다.",
    ]},
    {cat:"이해 충돌", items:[
      "연구 결과에 영향을 미칠 수 있는 이해 충돌(재정적·개인적)이 없다.",
      "연구비 지원 출처를 논문에 명시할 예정이다.",
    ]},
    {cat:"공동 저자", items:[
      "저자 기여도 기준(ICMJE 등)에 따라 저자 순서를 결정하였다.",
      "기여 없이 이름만 올리는 명예 저자(guest authorship)가 없다.",
    ]},
  ];

  const total = ITEMS.reduce((a,g)=>a+g.items.length, 0);
  const done = Object.values(checks).filter(Boolean).length;
  const pct = Math.round((done/total)*100);

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="⚖ 연구 윤리 자가 점검표" subtitle="학술지 투고 전 필수 점검 — 모든 항목을 확인하세요."/>
      <div style={{marginTop:16,marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:13,color:"var(--slate)",marginBottom:6}}>
          <span>완료 <strong style={{color: pct===100?"#7cc98a":"var(--gold-300)"}}>{done}/{total}</strong> 항목</span>
          <span>{pct}%</span>
        </div>
        <div style={{height:6,background:"var(--navy-700)",borderRadius:4,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${pct}%`,background: pct===100?"#7cc98a":"linear-gradient(90deg,var(--gold-500),var(--gold-300))",transition:"width .4s"}}/>
        </div>
      </div>
      {pct===100 && <div className="card" style={{padding:12,marginBottom:14,borderLeft:"3px solid #7cc98a",fontSize:13,color:"#7cc98a"}}>✅ 모든 연구 윤리 항목을 확인했습니다. 투고 전 소속 기관의 추가 규정도 확인해 주세요.</div>}

      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        {ITEMS.map(group=>(
          <div key={group.cat} className="card" style={{padding:16}}>
            <div style={{fontSize:13,fontWeight:700,color:"var(--gold-300)",marginBottom:10}}>{group.cat}</div>
            {group.items.map((item,i)=>{
              const key = `${group.cat}_${i}`;
              return (
                <label key={i} style={{display:"flex",gap:10,alignItems:"flex-start",padding:"7px 0",borderBottom:i<group.items.length-1?"1px solid var(--navy-700)":"none",cursor:"pointer",fontSize:13}}>
                  <input type="checkbox" style={{marginTop:2,flexShrink:0,width:"auto"}} checked={!!checks[key]} onChange={e=>saveChecks({...checks,[key]:e.target.checked})}/>
                  <span style={{color: checks[key] ? "#7cc98a" : "var(--ivory)"}}>{item}</span>
                </label>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   학술지 투고 트래커 (전문가 추가 기능)
   ================================================================ */
function SubmissionTracker() {
  const proj = useProject();
  const [submissions, setSubmissions] = useState(proj.state.submissions || []);
  const [form, setForm] = useState({journal:"",submitDate:"",status:"투고",decision:"",note:""});
  const STATUS_OPTIONS = ["투고","심사중","수정요청","재투고","게재확정","게재불가","철회"];
  const setF = (k,v) => setForm(f=>({...f,[k]:v}));
  const add = () => {
    if (!form.journal.trim()) return;
    const arr = [...submissions, {...form, id:Date.now()}];
    setSubmissions(arr);
    proj.update(s=>({...s, submissions:arr}));
    setForm({journal:"",submitDate:"",status:"투고",decision:"",note:""});
  };
  const remove = (id) => {
    const arr = submissions.filter(s=>s.id!==id);
    setSubmissions(arr);
    proj.update(s=>({...s, submissions:arr}));
  };
  const updateStatus = (id, status) => {
    const arr = submissions.map(s=>s.id===id ? {...s,status} : s);
    setSubmissions(arr);
    proj.update(s=>({...s, submissions:arr}));
  };
  const STATUS_COLOR = {"투고":"var(--gold-400)","심사중":"#80c8e9","수정요청":"var(--danger)","재투고":"var(--gold-300)","게재확정":"#7cc98a","게재불가":"var(--slate)","철회":"var(--slate)"};

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📬 학술지 투고 관리" subtitle="투고 이력과 심사 진행 상황을 추적합니다."/>
      <div className="card" style={{padding:16,marginTop:16}}>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}>
          <input placeholder="학술지명 (예: 상담학연구)" value={form.journal} onChange={e=>setF("journal",e.target.value)}/>
          <input type="date" value={form.submitDate} onChange={e=>setF("submitDate",e.target.value)}/>
          <select value={form.status} onChange={e=>setF("status",e.target.value)}>
            {STATUS_OPTIONS.map(s=>(<option key={s}>{s}</option>))}
          </select>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10,marginBottom:10}}>
          <input placeholder="심사 결과·메모" value={form.note} onChange={e=>setF("note",e.target.value)}/>
          <button className="btn-gold" onClick={add}>+ 투고 추가</button>
        </div>
      </div>

      {submissions.length===0 && <div style={{color:"var(--slate)",fontSize:13,marginTop:16}}>아직 투고 이력이 없습니다. 첫 학술지 투고 후 기록해두세요.</div>}
      <div style={{display:"flex",flexDirection:"column",gap:10,marginTop:14}}>
        {[...submissions].reverse().map(s=>(
          <div key={s.id} className="card" style={{padding:14,borderLeft:`3px solid ${STATUS_COLOR[s.status]||"var(--navy-600)"}`}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8,flexWrap:"wrap"}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{s.journal}</div>
                <div style={{fontSize:12,color:"var(--slate)",marginTop:2}}>{s.submitDate && `투고일: ${s.submitDate}`} {s.note && `· ${s.note}`}</div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <select value={s.status} onChange={e=>updateStatus(s.id,e.target.value)} style={{width:"auto",fontSize:11,padding:"4px 8px",color:STATUS_COLOR[s.status]}}>
                  {STATUS_OPTIONS.map(st=>(<option key={st}>{st}</option>))}
                </select>
                <button className="btn-ghost" style={{fontSize:11,padding:"4px 8px",color:"var(--danger)"}} onClick={()=>remove(s.id)}>삭제</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   📄 논문 읽기·요약실
   PDF/TXT 업로드 → AI 전문가 요약표 + 핵심 도식 생성
   ================================================================ */
function PaperReader() {
  const proj = useProject();
  const s = proj.state;
  const [files, setFiles] = useState([]); // [{name, text, summary}]
  const [loading, setLoading] = useState(false);
  const [loadingIdx, setLoadingIdx] = useState(null);
  const [error, setError] = useState("");
  const [isDragOver, setIsDragOver] = useState(false);
  const fileRef = useRef(null);

  const readFiles = async (fileList) => {
    setError("");
    const newEntries = [];
    for (const f of Array.from(fileList)) {
      const ext = f.name.split('.').pop().toLowerCase();
      if (!['pdf','txt','md','hwpx'].includes(ext)) { setError(`지원 형식: PDF, TXT, MD, HWPX (${f.name} 건너뜀)`); continue; }
      const text = await extractTextFromFile(f);
      const isGarbled = text && (text.match(/[\uAC00-\uD7A3]/g)||[]).length < text.length * 0.05;
      newEntries.push({ name:f.name, text: (text && !isGarbled) ? text : "", garbled: isGarbled || !text, summary:null });
    }
    setFiles(prev=>[...prev, ...newEntries]);
  };

  const handleDrop = async (e) => {
    e.preventDefault(); setIsDragOver(false);
    await readFiles(e.dataTransfer?.files || e.target?.files || []);
  };

  const summarize = async (idx) => {
    const entry = files[idx];
    if (!entry.text.trim()) { setError(`"${entry.name}": 텍스트를 추출할 수 없습니다. HWP는 .txt로 변환 후 업로드하거나 내용을 직접 붙여넣어 주세요.`); return; }
    setLoading(true); setLoadingIdx(idx); setError("");

    const sys = `당신은 한국 학술논문 분석 전문가입니다. 제공된 논문을 아래 구조로 전문가 수준으로 요약·분석하세요.

출력 형식 (HTML 테이블 + 텍스트):

1. 📋 논문 기본 정보 (표 형식)
   - 제목, 저자, 출처/학술지, 연구유형, 연구방법론, 연구주제

2. 🎯 핵심 요약 (3~5문장)
   - 연구 목적, 방법, 주요 결과, 결론을 압축

3. 📊 연구 설계 요약표
   표 형식: | 항목 | 내용 | 형태로
   - 연구 문제, 참여자/대상, 자료수집방법, 분석방법, 신뢰성 확보 방안

4. 🔑 핵심 발견 (Key Findings)
   번호 목록으로 주요 결과 5~7개

5. 💡 이론적 기여 및 한계점
   - 이론적 기여 2~3가지
   - 연구 한계 2~3가지

6. 📌 본 연구에 활용 가능한 인용 포인트
   - APA 인용 형식으로 활용 가능한 핵심 문장 3~4개

텍스트와 HTML 테이블을 혼합하여 출력하세요.`;

    const data = await callClaude([{role:"user", content:`다음 논문을 분석해 주세요:\n\n${entry.text.slice(0,4000)}`}], {system:sys});
    setLoading(false); setLoadingIdx(null);
    const result = data.error ? null : extractText(data);
    if (result) {
      setFiles(prev=>prev.map((f,i)=>i===idx ? {...f, summary:result} : f));
      // 논문 탐색실에도 추가
      proj.update(p=>({...p, papers:[...p.papers, {
        title: entry.name.replace(/\.[^.]+$/,''),
        authors:"(업로드 논문)", source:"직접 업로드",
        docType:"academic", methodType:"질적", note:result.slice(0,200),
        citationSentence:"", verified:false, needsCheck:true, isSample:false
      }]}));
    } else {
      setError("오프라인 또는 오류 — 아티팩트 환경에서 실행해 주세요.");
    }
  };

  const removeFile = (idx) => setFiles(prev=>prev.filter((_,i)=>i!==idx));

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📄 논문 읽기·요약실" subtitle="PDF·TXT 논문을 업로드하면 AI가 전문가 수준으로 요약표와 핵심 도식을 생성합니다. 요약된 논문은 자동으로 논문 탐색실에 추가됩니다."/>

      <div className="card" style={{padding:14,marginTop:16,fontSize:12,color:"var(--gold-300)",borderLeft:"3px solid var(--gold-500)"}}>
        💡 <strong>HWP 파일은 직접 업로드가 제한됩니다.</strong> 한글에서 <strong>Ctrl+A → Ctrl+C</strong> 후 아래 텍스트 박스에 붙여넣기하거나, <strong>[파일→다른이름저장→텍스트(.txt)]</strong> 로 변환 후 업로드하세요.
      </div>

      {/* 파일 드롭 영역 */}
      <div
        onDragOver={e=>{e.preventDefault();setIsDragOver(true);}}
        onDragLeave={()=>setIsDragOver(false)}
        onDrop={handleDrop}
        style={{marginTop:14,border:`2px dashed ${isDragOver?"var(--gold-500)":"var(--navy-600)"}`,borderRadius:8,padding:"24px 20px",textAlign:"center",cursor:"pointer",transition:"all .2s"}}
        onClick={()=>fileRef.current?.click()}>
        <input ref={fileRef} type="file" multiple accept=".pdf,.txt,.md,.hwpx" style={{display:"none"}} onChange={handleDrop}/>
        <div style={{fontSize:22,marginBottom:6}}>📄</div>
        <div style={{fontSize:14,color:"var(--ivory)"}}>논문 파일을 드래그하거나 클릭하여 업로드</div>
        <div style={{fontSize:12,color:"var(--slate)",marginTop:4}}>PDF · TXT · MD · HWPX | 여러 파일 동시 업로드 가능</div>
      </div>

      {/* 직접 입력 영역 */}
      <div style={{marginTop:10}}>
        <div style={{fontSize:12,color:"var(--slate)",marginBottom:4}}>또는 논문 텍스트 직접 붙여넣기 (HWP Ctrl+A→Ctrl+C 후 여기에 Ctrl+V)</div>
        <div style={{display:"flex",gap:8}}>
          <textarea id="paste-area" style={{flex:1,minHeight:80}} placeholder="논문 내용을 여기에 붙여넣으세요..."/>
          <button className="btn-gold" style={{flexShrink:0,padding:"0 16px"}} onClick={()=>{
            const txt = document.getElementById("paste-area").value;
            if (txt.trim().length < 50) { setError("50자 이상 입력해 주세요."); return; }
            setFiles(prev=>[...prev, {name:`붙여넣기 논문 ${prev.length+1}`, text:txt, garbled:false, summary:null}]);
            document.getElementById("paste-area").value="";
          }}>+ 추가</button>
        </div>
      </div>

      {error && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{error}</div>}

      {/* 업로드된 파일 목록 */}
      {files.length > 0 && (
        <div style={{marginTop:20,display:"flex",flexDirection:"column",gap:16}}>
          {files.map((f,i)=>(
            <div key={i} className="card" style={{padding:0,overflow:"hidden"}}>
              {/* 파일 헤더 */}
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid var(--navy-700)",flexWrap:"wrap",gap:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>📄 {f.name}</div>
                  <div style={{fontSize:11,color:"var(--slate)",marginTop:2}}>
                    {f.garbled ? <span style={{color:"var(--danger)"}}>⚠ 텍스트 추출 실패 — 아래 직접 입력 영역을 이용해 주세요</span>
                    : `${f.text.length.toLocaleString()}자 추출됨`}
                  </div>
                </div>
                <div style={{display:"flex",gap:6}}>
                  {!f.garbled && !f.summary && <button className="btn-gold" style={{fontSize:12}} disabled={loading && loadingIdx===i} onClick={()=>summarize(i)}>{loading && loadingIdx===i ? "분석 중..." : "🔍 AI 전문가 요약 생성"}</button>}
                  {f.summary && <button className="btn-ghost" style={{fontSize:11}} onClick={()=>navigator.clipboard.writeText(f.summary).catch(()=>{})}>📋 복사</button>}
                  <button className="btn-ghost" style={{fontSize:11,color:"var(--danger)"}} onClick={()=>removeFile(i)}>삭제</button>
                </div>
              </div>
              {loading && loadingIdx===i && (
                <div style={{padding:14}}><Loader text="논문을 전문가 수준으로 분석하는 중입니다... 잠시만 기다려 주세요."/></div>
              )}
              {/* 요약 결과 — 좌우 분할 */}
              {f.summary && (
                <div style={{display:"flex",minHeight:200}}>
                  <div style={{flex:1,borderRight:"1px solid var(--navy-700)",overflowY:"auto"}}>
                    <div style={{padding:"8px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>원문 미리보기</div>
                    <div style={{padding:12,fontSize:11,color:"var(--slate)",lineHeight:1.6,maxHeight:400,overflowY:"auto",whiteSpace:"pre-wrap"}}>{f.text.slice(0,800)}…</div>
                  </div>
                  <div style={{flex:2,overflowY:"auto",maxHeight:500}}>
                    <div style={{padding:"8px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>📊 AI 전문가 요약</div>
                    <div style={{padding:16,fontSize:13,lineHeight:1.8,color:"var(--ivory)"}} dangerouslySetInnerHTML={{__html: f.summary.replace(/\n/g,"<br/>").replace(/\|(.+?)\|/g,"<span style='font-family:monospace;font-size:11px;background:rgba(255,255,255,0.05);padding:2px 6px;border-radius:3px'>|$1|</span>")}}/>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
      {files.length > 1 && files.every(f=>f.summary) && (
        <div style={{marginTop:14,textAlign:"center"}}>
          <button className="btn-gold" onClick={()=>nav("/compare")}>📊 이 논문들 비교 분석하기 →</button>
        </div>
      )}
    </div>
  );
}

/* ================================================================
   📊 논문 비교 분석
   여러 논문을 동시 비교 매트릭스로 분석
   ================================================================ */
function PaperCompare() {
  const proj = useProject();
  const s = proj.state;
  const [papers, setPapers] = useState(
    (s.papers||[]).filter(p=>p.note && p.note.length > 50).slice(0,6)
  );
  const [compareResult, setCompareResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [newTitle, setNewTitle] = useState("");
  const [newText, setNewText] = useState("");

  const addPaper = () => {
    if (!newTitle.trim()) return;
    setPapers(prev=>[...prev, {title:newTitle, note:newText, authors:"직접 입력", source:"", docType:"academic", methodType:"질적"}]);
    setNewTitle(""); setNewText("");
  };
  const removePaper = (i) => setPapers(prev=>prev.filter((_,j)=>j!==i));

  const runCompare = async () => {
    if (papers.length < 2) { setError("비교 분석은 최소 2편 이상의 논문이 필요합니다."); return; }
    setLoading(true); setError(""); setCompareResult(null);

    const paperList = papers.map((p,i)=>`[논문${i+1}] 제목: ${p.title}\n저자: ${p.authors||""}\n요약/내용: ${(p.note||"").slice(0,500)}`).join("\n\n---\n\n");

    const sys = `당신은 한국 학술논문 비교 분석 전문가입니다. 제공된 논문들을 다음 항목으로 비교 분석하세요.

반드시 JSON 형식으로만 답변하세요:
{
  "overview": "전체 논문군의 공통 연구 맥락 2~3문장",
  "matrix": [
    {
      "dimension": "비교 항목명",
      "values": ["논문1 내용", "논문2 내용", "논문3 내용"]
    }
  ],
  "commonalities": ["공통점 1", "공통점 2", "공통점 3"],
  "differences": ["차이점 1", "차이점 2", "차이점 3"],
  "methodComparison": "연구방법론 비교 분석 3~5문장",
  "researchGaps": ["선행연구 공백 1", "선행연구 공백 2", "선행연구 공백 3"],
  "synthesisPoint": "이 논문들을 종합하면 도출되는 핵심 통합 명제 2~3문장",
  "citationStrategy": "본 연구에서 이 논문들을 어떻게 인용할지 전략 2~3문장"
}

비교 항목(dimension)은 반드시 아래를 포함하세요:
연구 목적, 연구 참여자/대상, 연구방법론, 자료수집방법, 핵심 발견, 이론적 기여, 연구 한계`;

    const data = await callClaude([{role:"user", content:`연구주제: ${s.topic||"미설정"}\n\n분석 대상 논문 ${papers.length}편:\n\n${paperList}`}], {system:sys});
    setLoading(false);
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed) {
      setCompareResult(parsed);
    } else {
      setError("오프라인 또는 오류 — 아티팩트 환경에서 실행해 주세요.");
    }
  };

  const copyResult = () => {
    if (!compareResult) return;
    const txt = [
      `논문 비교 분석 결과 (${papers.length}편)`,
      `연구주제: ${s.topic||"미설정"}`,
      `${"=".repeat(40)}`,
      `\n[전체 개요]\n${compareResult.overview}`,
      `\n[비교 매트릭스]`,
      ...compareResult.matrix.map(m=>`\n${m.dimension}:\n${m.values.map((v,i)=>` 논문${i+1}: ${v}`).join("\n")}`),
      `\n[공통점]\n${compareResult.commonalities.map((c,i)=>`${i+1}. ${c}`).join("\n")}`,
      `\n[차이점]\n${compareResult.differences.map((d,i)=>`${i+1}. ${d}`).join("\n")}`,
      `\n[연구방법론 비교]\n${compareResult.methodComparison}`,
      `\n[선행연구 공백]\n${compareResult.researchGaps.map((g,i)=>`${i+1}. ${g}`).join("\n")}`,
      `\n[통합 명제]\n${compareResult.synthesisPoint}`,
      `\n[인용 전략]\n${compareResult.citationStrategy}`,
    ].join("\n");
    navigator.clipboard.writeText(txt).catch(()=>{});
  };

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📊 논문 비교 분석" subtitle="여러 논문을 동시에 비교하여 공통점·차이점·연구 공백·인용 전략을 도출합니다."/>

      {/* 논문 목록 */}
      <div style={{marginTop:16}}>
        <div style={{fontSize:13,color:"var(--slate)",marginBottom:10}}>
          비교 대상 논문 {papers.length}편 (최대 6편)
          <button className="btn-ghost" style={{fontSize:11,padding:"4px 10px",marginLeft:10}} onClick={()=>nav("/paperreader")}>+ 논문 읽기·요약실에서 추가</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {papers.map((p,i)=>(
            <div key={i} className="card" style={{padding:12,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
              <div style={{flex:1}}>
                <div style={{fontWeight:700,fontSize:13}}>논문{i+1}. {p.title}</div>
                <div style={{fontSize:11,color:"var(--slate)"}}>{p.authors} {p.source && `· ${p.source}`}</div>
              </div>
              <button className="btn-ghost" style={{fontSize:11,padding:"3px 8px",color:"var(--danger)",flexShrink:0}} onClick={()=>removePaper(i)}>삭제</button>
            </div>
          ))}
        </div>
        {papers.length < 6 && (
          <div className="card" style={{padding:14,marginTop:10}}>
            <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8}}>논문 직접 추가</div>
            <input style={{width:"100%",marginBottom:8}} placeholder="논문 제목" value={newTitle} onChange={e=>setNewTitle(e.target.value)}/>
            <textarea style={{width:"100%",minHeight:60,marginBottom:8}} placeholder="논문 요약 또는 주요 내용 붙여넣기 (선택)" value={newText} onChange={e=>setNewText(e.target.value)}/>
            <button className="btn-ghost" style={{fontSize:12}} onClick={addPaper}>+ 추가</button>
          </div>
        )}
      </div>

      <div style={{marginTop:14,display:"flex",gap:8}}>
        <button className="btn-gold" onClick={runCompare} disabled={loading || papers.length < 2}>{loading ? "비교 분석 중..." : `📊 ${papers.length}편 비교 분석 시작`}</button>
        {compareResult && <button className="btn-ghost" onClick={copyResult}>📋 결과 복사 (한글용)</button>}
      </div>
      {loading && <div style={{marginTop:12}}><Loader text="논문들을 비교 분석하는 중입니다... 잠시만 기다려 주세요."/></div>}
      {error && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{error}</div>}

      {compareResult && (
        <div style={{marginTop:20,display:"flex",flexDirection:"column",gap:16}}>
          {/* 전체 개요 */}
          <div className="card" style={{padding:16,borderLeft:"3px solid var(--gold-500)"}}>
            <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8,textTransform:"uppercase"}}>전체 개요</div>
            <div style={{fontSize:14,lineHeight:1.8}}>{compareResult.overview}</div>
          </div>

          {/* 비교 매트릭스 */}
          <div className="card" style={{padding:0,overflow:"hidden"}}>
            <div style={{padding:"10px 16px",borderBottom:"1px solid var(--navy-700)",fontSize:12,color:"var(--gold-400)",textTransform:"uppercase"}}>📊 비교 매트릭스</div>
            <div style={{overflowX:"auto"}}>
              <table>
                <thead>
                  <tr>
                    <th style={{width:130}}>비교 항목</th>
                    {papers.map((_,i)=>(<th key={i}>논문 {i+1}</th>))}
                  </tr>
                </thead>
                <tbody>
                  {(compareResult.matrix||[]).map((row,i)=>(
                    <tr key={i}>
                      <td style={{color:"var(--gold-300)",fontWeight:700,fontSize:12}}>{row.dimension}</td>
                      {(row.values||[]).map((v,j)=>(<td key={j} style={{fontSize:12}}>{v}</td>))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* 공통점 & 차이점 */}
          <div className="dash-grid-2">
            <div className="card" style={{padding:16}}>
              <div style={{fontSize:12,color:"#7cc98a",marginBottom:10,textTransform:"uppercase"}}>✅ 공통점</div>
              {(compareResult.commonalities||[]).map((c,i)=>(<div key={i} style={{fontSize:13,padding:"6px 0",borderBottom:"1px solid var(--navy-700)"}}>• {c}</div>))}
            </div>
            <div className="card" style={{padding:16}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>⚡ 차이점</div>
              {(compareResult.differences||[]).map((d,i)=>(<div key={i} style={{fontSize:13,padding:"6px 0",borderBottom:"1px solid var(--navy-700)"}}>• {d}</div>))}
            </div>
          </div>

          {/* 연구 공백 & 통합 명제 */}
          <div className="card" style={{padding:16}}>
            <div style={{fontSize:12,color:"var(--danger)",marginBottom:10,textTransform:"uppercase"}}>🔍 선행연구 공백 (본 연구의 필요성 근거)</div>
            {(compareResult.researchGaps||[]).map((g,i)=>(<div key={i} style={{fontSize:13,padding:"6px 0",borderBottom:"1px solid var(--navy-700)",display:"flex",gap:8}}><span style={{color:"var(--gold-300)",flexShrink:0}}>{i+1}.</span>{g}</div>))}
          </div>

          <div className="card" style={{padding:16,borderLeft:"3px solid #7cc98a"}}>
            <div style={{fontSize:12,color:"#7cc98a",marginBottom:8,textTransform:"uppercase"}}>💡 통합 명제 (서론·이론 배경 활용)</div>
            <div style={{fontSize:14,lineHeight:1.8}}>{compareResult.synthesisPoint}</div>
          </div>

          <div className="card" style={{padding:16,borderLeft:"3px solid var(--gold-400)"}}>
            <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8,textTransform:"uppercase"}}>📌 인용 전략</div>
            <div style={{fontSize:13,lineHeight:1.8}}>{compareResult.citationStrategy}</div>
          </div>

          <div style={{textAlign:"center"}}>
            <button className="btn-gold" onClick={()=>nav("/theorymodel")}>🔷 이 분석으로 이론 모형 도출하기 →</button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================================================================
   🔷 이론 모형 도출
   비교 분석 + 메타종합 결과에서 이론 모형 자동 생성
   ================================================================ */
function TheoryModel() {
  const proj = useProject();
  const s = proj.state;
  const [model, setModel] = useState(s.theoryModel || null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const [customInput, setCustomInput] = useState("");

  const themes = s.themes || [];
  const conceptSentence = s.conceptSentence || "";
  const synthesisDraft = s.synthesisDraft || "";
  const papers = (s.papers || []).filter(p=>p.note);

  const generate = async () => {
    setLoading(true); setError("");
    const themeList = themes.map((t,i)=>`주제${i+1}: ${t.source} → ${t.theme}`).join("\n");
    const paperSummaries = papers.slice(0,5).map((p,i)=>`논문${i+1}: ${p.title} / ${p.note?.slice(0,200)}`).join("\n");

    const sys = `당신은 한국 학술논문 이론 모형 도출 전문가입니다. 제공된 연구 결과를 바탕으로 이론 모형을 도출하세요.

반드시 JSON 형식으로만 답변하세요:
{
  "modelName": "이론 모형 명칭 (예: '상담자 소진-회복 순환 모형')",
  "modelType": "모형 유형 (예: 과정 모형 / 순환 모형 / 다층 모형 / 영향 요인 모형)",
  "coreComponents": [
    {"name":"구성요소명", "description":"설명 1~2문장", "subElements":["하위요소1","하위요소2"]}
  ],
  "relationships": [
    {"from":"구성요소A", "to":"구성요소B", "type":"인과/순환/상호작용/조절", "description":"관계 설명"}
  ],
  "stages": ["단계1", "단계2", "단계3"],
  "contextualFactors": ["촉진 요인 또는 맥락 요인"],
  "diagramDescription": "이 모형을 화살표 도식으로 표현할 때의 구조 설명 (독자가 그릴 수 있도록 구체적으로)",
  "theoreticalBasis": "이 모형의 이론적 근거 (선행 이론과의 연관성)",
  "practicalImplication": "실천적 함의 2~3가지",
  "modelProposition": "이 모형을 한 문장으로 표현한 핵심 명제"
}`;

    const data = await callClaude([{role:"user", content:`연구주제: ${s.topic||""}\n연구유형: ${s.type||""}\n\n[개념화 문장]\n${conceptSentence}\n\n[주제 분석 결과]\n${themeList||"없음"}\n\n[통합 해석 초안]\n${synthesisDraft||"없음"}\n\n[선행연구 요약]\n${paperSummaries||"없음"}\n\n[추가 입력]\n${customInput}`}], {system:sys});
    setLoading(false);
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed) {
      setModel(parsed);
      proj.update(p=>({...p, theoryModel:parsed}));
    } else {
      setError("오프라인 또는 오류 — 아티팩트 환경에서 실행해 주세요.");
    }
  };

  const copyModel = () => {
    if (!model) return;
    const txt = [
      `이론 모형: ${model.modelName}`,
      `유형: ${model.modelType}`,
      `핵심 명제: ${model.modelProposition}`,
      `\n[핵심 구성요소]`,
      ...(model.coreComponents||[]).map((c,i)=>`${i+1}. ${c.name}: ${c.description}\n   하위요소: ${(c.subElements||[]).join(", ")}`),
      `\n[구성요소 간 관계]`,
      ...(model.relationships||[]).map(r=>`${r.from} → ${r.to} (${r.type}): ${r.description}`),
      `\n[단계별 과정]`,
      ...(model.stages||[]).map((st,i)=>`${i+1}단계: ${st}`),
      `\n[도식 설명]\n${model.diagramDescription}`,
      `\n[이론적 근거]\n${model.theoreticalBasis}`,
      `\n[실천적 함의]\n${(model.practicalImplication||"").toString()}`,
    ].join("\n");
    navigator.clipboard.writeText(txt).catch(()=>{});
  };

  const hasData = themes.length > 0 || conceptSentence || synthesisDraft || papers.length > 0;

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🔷 이론 모형 도출" subtitle="메타종합·비교 분석 결과를 바탕으로 본 연구만의 이론 모형을 자동 생성합니다."/>

      {!hasData && (
        <div className="card" style={{padding:14,marginTop:16,fontSize:12,color:"var(--gold-300)",borderLeft:"3px solid var(--gold-500)"}}>
          💡 이론 모형은 <strong>메타종합 랩</strong>에서 주제 분석과 개념화 문장을 완성하거나, <strong>논문 비교 분석</strong>을 먼저 실행한 후 이 페이지로 오면 더 풍부한 모형이 생성됩니다.
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button className="btn-ghost" style={{fontSize:11}} onClick={()=>nav("/meta")}>메타종합 랩으로</button>
            <button className="btn-ghost" style={{fontSize:11}} onClick={()=>nav("/compare")}>논문 비교 분석으로</button>
          </div>
        </div>
      )}

      <div style={{marginTop:16}}>
        {hasData && (
          <div className="card" style={{padding:14,marginBottom:14,fontSize:12}}>
            <div style={{color:"var(--gold-400)",marginBottom:6}}>모형 도출 기반 데이터</div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              {themes.length>0 && <span className="tag" style={{color:"#7cc98a"}}>주제 분석 {themes.length}개</span>}
              {conceptSentence && <span className="tag" style={{color:"#7cc98a"}}>개념화 문장</span>}
              {synthesisDraft && <span className="tag" style={{color:"#7cc98a"}}>통합 해석 초안</span>}
              {papers.length>0 && <span className="tag" style={{color:"#7cc98a"}}>선행연구 {papers.length}편</span>}
            </div>
          </div>
        )}
        <div style={{marginBottom:10}}>
          <label style={{fontSize:12,color:"var(--slate)",display:"block",marginBottom:4}}>추가 입력 (선택) — 모형에 포함하고 싶은 개념이나 방향성</label>
          <textarea style={{width:"100%",minHeight:60}} placeholder="예: '소진-회복-성장의 순환 과정', '맥락 요인으로 기관 지원 포함'" value={customInput} onChange={e=>setCustomInput(e.target.value)}/>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn-gold" onClick={generate} disabled={loading}>{loading ? "이론 모형 도출 중..." : "🔷 이론 모형 자동 생성"}</button>
          {model && <button className="btn-ghost" onClick={copyModel}>📋 한글 붙여넣기용 복사</button>}
        </div>
        {loading && <div style={{marginTop:12}}><Loader text="연구 데이터를 분석하여 이론 모형을 도출하는 중입니다..."/></div>}
        {error && <div style={{color:"var(--danger)",fontSize:12,marginTop:8}}>{error}</div>}
      </div>

      {model && (
        <div style={{marginTop:20,display:"flex",flexDirection:"column",gap:14}}>
          {/* 모형 헤더 */}
          <div className="card" style={{padding:20,borderLeft:"4px solid var(--gold-500)",background:"linear-gradient(135deg,var(--navy-800),var(--navy-900))"}}>
            <div style={{fontSize:22,fontWeight:900,color:"var(--gold-300)",marginBottom:6}}>{model.modelName}</div>
            <div style={{fontSize:14,color:"var(--slate)",marginBottom:10}}>유형: {model.modelType}</div>
            <div style={{fontSize:15,lineHeight:1.8,color:"var(--ivory)",fontStyle:"italic",borderLeft:"3px solid var(--gold-400)",paddingLeft:12}}>
              "{model.modelProposition}"
            </div>
          </div>

          {/* 핵심 구성요소 */}
          <div className="card" style={{padding:16}}>
            <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:12,textTransform:"uppercase"}}>🔹 핵심 구성요소</div>
            <div className="dash-grid-3">
              {(model.coreComponents||[]).map((c,i)=>(
                <div key={i} style={{padding:14,background:"var(--navy-900)",borderRadius:8,border:"1px solid var(--navy-600)"}}>
                  <div style={{fontWeight:700,color:"var(--gold-300)",marginBottom:6,fontSize:14}}>{c.name}</div>
                  <div style={{fontSize:12,color:"var(--ivory)",marginBottom:8,lineHeight:1.6}}>{c.description}</div>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {(c.subElements||[]).map((el,j)=>(<span key={j} className="tag" style={{fontSize:10}}>{el}</span>))}
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* 단계별 과정 */}
          {(model.stages||[]).length > 0 && (
            <div className="card" style={{padding:16}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:12,textTransform:"uppercase"}}>📍 단계별 과정</div>
              <div style={{display:"flex",gap:0,flexWrap:"wrap"}}>
                {model.stages.map((st,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center"}}>
                    <div style={{padding:"10px 16px",background:"var(--navy-900)",borderRadius:8,border:"1px solid var(--gold-500)",fontSize:13,textAlign:"center",minWidth:100}}>
                      <div style={{fontSize:10,color:"var(--gold-400)",marginBottom:3}}>단계 {i+1}</div>
                      <div style={{fontWeight:700,color:"var(--ivory)"}}>{st}</div>
                    </div>
                    {i < model.stages.length-1 && <div style={{padding:"0 8px",color:"var(--gold-400)",fontSize:16}}>→</div>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* 구성요소 관계 */}
          {(model.relationships||[]).length > 0 && (
            <div className="card" style={{padding:16}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>🔗 구성요소 간 관계</div>
              {model.relationships.map((r,i)=>(
                <div key={i} style={{display:"flex",gap:10,alignItems:"center",padding:"8px 0",borderBottom:"1px solid var(--navy-700)"}}>
                  <span style={{color:"var(--gold-300)",fontWeight:700,fontSize:13,minWidth:100}}>{r.from}</span>
                  <span style={{color:"var(--slate)",fontSize:12}}>→ ({r.type})</span>
                  <span style={{color:"var(--gold-300)",fontWeight:700,fontSize:13,minWidth:100}}>{r.to}</span>
                  <span style={{fontSize:12,color:"var(--slate)"}}>{r.description}</span>
                </div>
              ))}
            </div>
          )}

          {/* 도식 설명 */}
          <div className="card" style={{padding:16}}>
            <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8,textTransform:"uppercase"}}>✏ 도식 구조 설명 (논문에 삽입할 그림의 설명)</div>
            <div style={{fontSize:13,lineHeight:1.8,color:"var(--ivory)"}}>{model.diagramDescription}</div>
          </div>

          {/* 이론적 근거 & 실천적 함의 */}
          <div className="dash-grid-2">
            <div className="card" style={{padding:16}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8,textTransform:"uppercase"}}>📚 이론적 근거</div>
              <div style={{fontSize:13,lineHeight:1.8}}>{model.theoreticalBasis}</div>
            </div>
            <div className="card" style={{padding:16}}>
              <div style={{fontSize:12,color:"#7cc98a",marginBottom:8,textTransform:"uppercase"}}>💼 실천적 함의</div>
              <div style={{fontSize:13,lineHeight:1.8}}>{model.practicalImplication}</div>
            </div>
          </div>

          <div style={{textAlign:"center",fontSize:12,color:"var(--slate)"}}>
            이 이론 모형은 AI 생성 초안입니다. 실제 논문 수록 전 지도교수 검토 및 연구 데이터 재확인이 필요합니다.
          </div>
        </div>
      )}
    </div>
  );
}
