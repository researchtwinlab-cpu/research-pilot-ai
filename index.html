<script type="text/babel" data-presets="react">
const {useState, useEffect, useRef, useContext, createContext} = React;

/* ⚙ 운영자 설정 — AI 모델 (최신 모델로 변경하려면 이 값만 수정하세요)
   현재 최신: claude-sonnet-4-6 (Claude Sonnet)
   업그레이드 가이드: https://docs.anthropic.com/en/docs/about-claude/models
*/
const AI_MODEL = "claude-sonnet-4-6";
async function callClaude(messages, {tools, system, timeoutMs} = {}) {
  const body = { model: AI_MODEL, max_tokens: 1000, messages };
  if (system) body.system = system;
  if (tools) body.tools = tools;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs || 30000);
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timer);
    if (!res.ok) {
      let detail = "";
      try { detail = JSON.stringify(await res.json()); } catch (e2) {}
      return { error: `HTTP ${res.status} ${detail}` };
    }
    const json = await res.json();
    if (json && json.error) return { error: json.error.message || JSON.stringify(json.error) };
    return json;
  } catch (e) {
    clearTimeout(timer);
    return { error: e.name === "AbortError" ? "요청 시간이 초과되었습니다." : String(e) };
  }
}
function extractText(data) {
  if (!data || !data.content) return "";
  return data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
}
function parseJSONLoose(text) {
  const cleaned = text.replace(/```json/g, "").replace(/```/g, "").trim();
  const start = cleaned.indexOf("{");
  const arrStart = cleaned.indexOf("[");
  let s = start;
  if (arrStart !== -1 && (start === -1 || arrStart < start)) s = arrStart;
  try { return JSON.parse(cleaned.slice(s)); } catch (e) { return null; }
}

/* ---------------- Offline draft generators ----------------
   이 파일은 다운로드/미리보기 형태로 열리기 때문에 브라우저에서 api.anthropic.com으로 보내는
   실시간 요청이 인증되지 않아 항상 실패합니다(인터넷 연결 문제가 아닙니다). 아래 함수들은
   그 상황에서도 화면이 항상 쓸모 있는 결과를 보여주도록 만든 오프라인 템플릿 생성기입니다. */
const OFFLINE_NOTE = "🧩 오프라인 템플릿 — 이 파일에서는 실시간 AI 응답을 받을 수 없어 아래 뼈대를 대신 생성했습니다. 내용을 직접 다듬어 사용하세요.";

const SECTION_BUILDERS = {
  abstract: (ctx) => `본 연구는 "${ctx.topic}"을(를) 주제로 ${ctx.type} 방법을 통해 접근한다. ${ctx.titleFirst ? `연구 제목은 "${ctx.titleFirst}"(안)으로 설정하였다.` : ""} 연구목적은 [연구목적을 한두 문장으로 기술]이며, 이를 위해 [자료수집/분석 방법]을 활용하였다. 주요 결과로 [핵심 발견 1~2가지]를 확인하였고, 이는 [함의/시사점]을 갖는다.`,
  keywords: (ctx) => [ctx.topic, ctx.type, ...(ctx.themeWords.slice(0,3))].filter(Boolean).join(", "),
  intro: (ctx) => `${ctx.topic} 현상은 최근 [사회적/학문적 배경]으로 인해 주목받고 있다. 그러나 기존 연구는 주로 [기존 연구의 경향]에 초점을 두어 왔으며, ${ctx.gap || "[본 연구가 주목하는 공백]"}에 대한 이해는 상대적으로 부족한 실정이다.\n\n이에 본 연구는 "${ctx.topic}"에 관하여 ${ctx.type} 방법으로 접근함으로써 [연구목적]을 밝히고자 한다. 구체적인 연구문제는 다음과 같다: 1) [연구문제 1], 2) [연구문제 2].`,
  theory: (ctx) => `${ctx.topic}과 관련된 주요 개념은 [핵심 개념 정의]로 정리할 수 있다. ${ctx.paperList ? `선행연구를 살펴보면 ${ctx.paperList} 등에서 관련 논의가 이루어졌다.` : "관련 선행연구는 '연구 시작' 또는 '참고문헌' 페이지에서 확보한 뒤 이곳에 정리하는 것을 권장한다."}\n\n이들 연구를 종합하면 [선행연구 간 공통점과 차이점]으로 요약되며, 본 연구는 이러한 논의를 바탕으로 [본 연구의 이론적 입장]을 취한다.`,
  method: (ctx) => `본 연구는 ${ctx.type}로 설계되었다. 연구참여자는 [선정기준과 인원 수]이며, 자료는 [면담/설문/기존문헌 등] 방법으로 수집하였다.\n\n분석은 다음 절차를 따른다(위 도식 참고): ${ctx.stageNames}. 자료의 신뢰성과 타당성 확보를 위해 [삼각검증/동료검토 등 전략]을 사용하였다.`,
  results: (ctx) => `분석 결과 ${ctx.themeCount > 0 ? `${ctx.themeCount}개의 핵심 주제(${ctx.themeWords.join(", ")} 등)가 도출되었다` : "[핵심 주제 목록]이 도출되었다"}. 각 주제는 다음과 같이 요약된다.\n\n1) [주제 1]: [주제 1에 대한 설명 및 참여자 진술 예시]\n2) [주제 2]: [주제 2에 대한 설명 및 참여자 진술 예시]\n\n이러한 결과는 ${ctx.topic}에 대한 [통합적 해석 방향]을 시사한다.`,
  discussion: (ctx) => `본 연구는 "${ctx.topic}"에 관하여 ${ctx.type}로 접근하여 [핵심 결과 요약]을 확인하였다. 이는 선행연구의 [선행연구와의 일치/불일치 지점]과 비교할 때 [본 연구의 차별점]을 지닌다.\n\n${ctx.conceptSentence ? `이러한 결과는 "${ctx.conceptSentence}"라는 개념화 문장으로 정리될 수 있으며, ` : ""}실천적으로는 [현장 적용 시사점], 이론적으로는 [학문적 기여]를 갖는다. 다만 [연구의 제한점]이 있어 해석에 유의할 필요가 있다.`,
  suggestion: (ctx) => `본 연구의 결과를 바탕으로 다음을 제언한다.\n\n첫째, 실천적 측면에서 [현장/정책 제언].\n둘째, 후속 연구를 위해 ${ctx.topic}과 관련하여 [추가로 필요한 연구 방향]을 제안한다.\n셋째, 방법론적으로는 [표본 확대, 종단연구 등 후속 설계 제안]을 고려할 수 있다.`,
};

function localFallbackSection(secKey, label, s, targetLen) {
  const ctx = {
    topic: s.topic || "(연구주제 미입력)",
    type: s.type || "질적연구",
    titleFirst: (s.titles||[])[0] || "",
    gap: "",
    paperList: (s.papers||[]).slice(0,3).map(p=>p.authors || p.title).join(", "),
    themeWords: (s.themes||[]).map(t=>t.theme),
    themeCount: (s.themes||[]).length,
    conceptSentence: s.conceptSentence || "",
    stageNames: (s.designerStages||[]).map(d=>d.name.replace(/^\d+\.\s*/,"")).join(" → "),
  };
  const build = SECTION_BUILDERS[secKey] || (()=>`"${ctx.topic}"의 ${label} 섹션 뼈대입니다.`);
  let text = `${OFFLINE_NOTE}\n\n` + build(ctx);
  if (text.length < targetLen * 0.6 && secKey !== "keywords") {
    text += `\n\n(참고) 목표 분량 ${targetLen}자에 맞춰 위 대괄호 [ ] 부분을 실제 내용으로 채우면 분량이 자연스럽게 늘어납니다.`;
  }
  return text;
}
function localFallbackScore(label) {
  return {
    score: 70,
    comment: `${OFFLINE_NOTE} "${label}" 섹션에 대한 실시간 채점 대신 기준 점수(70점)를 표시합니다.`,
    suggestions: "구체적인 사례·인용·데이터를 추가하면 완성도를 높일 수 있습니다.",
  };
}
function localFallbackSynthesis(themes, conceptSentence) {
  const list = themes.map(t=>`'${t.theme}'(${t.source})`).join(", ");
  return `${OFFLINE_NOTE}\n\n제시된 개별 연구 주제(${list})는 서로 연결되는 지점이 있는 것으로 보인다. 이를 통합적으로 해석하면 "${conceptSentence}"라는 개념화 문장과 맥을 같이 하는 것으로 잠정 정리할 수 있다. [각 주제 간 구체적 연결 논리를 직접 보완해 주세요.]`;
}
function localFallbackStageCheck(note) {
  const len = (note||"").trim().length;
  if (len >= 40) return { complete:true, reason: `${OFFLINE_NOTE} 메모 분량(${len}자) 기준으로 완료 처리했습니다. 실제 방법론적 충족 여부는 직접 한 번 더 검토해 주세요.` };
  return { complete:false, reason: `${OFFLINE_NOTE} 메모가 아직 짧습니다(${len}자). 최소 40자 이상 구체적으로 작성해 보세요.` };
}


const ProjectContext = createContext(null);
function useProject(){ return useContext(ProjectContext); }

function useHashRoute() {
  const [route, setRoute] = useState(window.location.hash.replace("#","") || "/");
  useEffect(() => {
    const onHash = () => setRoute(window.location.hash.replace("#","") || "/");
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  return route;
}
function nav(path){ window.location.hash = path; }

/* ---------------- Small shared components ---------------- */
function SealGauge({ value=0, size=120, label="" }) {
  const r = size/2 - 10;
  const c = 2*Math.PI*r;
  const offset = c - (value/100)*c;
  return (
    <div style={{textAlign:"center"}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#1c3054" strokeWidth="8"/>
        <circle className="seal-ring" cx={size/2} cy={size/2} r={r} fill="none" stroke="#c9a227" strokeWidth="8"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          transform={`rotate(-90 ${size/2} ${size/2})`}/>
        <text x="50%" y="48%" textAnchor="middle" fill="#f2ecdd" fontSize="22" fontWeight="700" fontFamily="JetBrains Mono">{value}</text>
        <text x="50%" y="64%" textAnchor="middle" fill="#8fa0ba" fontSize="10">/ 100</text>
      </svg>
      {label && <div style={{fontSize:13,color:"#8fa0ba",marginTop:4}}>{label}</div>}
    </div>
  );
}
function ProgressCard({title, percent, sub}) {
  return (
    <div className="card" style={{padding:18}}>
      <div style={{fontSize:12,color:"#8fa0ba",marginBottom:6}}>{title}</div>
      <div style={{display:"flex",alignItems:"baseline",gap:6,marginBottom:10}}>
        <span style={{fontSize:28,fontWeight:700,fontFamily:"JetBrains Mono"}}>{percent}%</span>
        <span style={{fontSize:12,color:"#8fa0ba"}}>{sub}</span>
      </div>
      <div style={{height:6,background:"#1c3054",borderRadius:4,overflow:"hidden"}}>
        <div style={{height:"100%",width:`${percent}%`,background:"linear-gradient(90deg,#c9a227,#e9cf80)"}}/>
      </div>
    </div>
  );
}
function ScoreCard({label, score}) {
  const color = score>=85 ? "#dab64e" : score>=70 ? "#8fa0ba" : "#c9654e";
  return (
    <div className="card" style={{padding:16,textAlign:"center"}}>
      <div style={{fontSize:26,fontWeight:700,fontFamily:"JetBrains Mono",color}}>{score}</div>
      <div style={{fontSize:12,color:"#8fa0ba",marginTop:4}}>{label}</div>
    </div>
  );
}
function TodoCard({items}) {
  return (
    <div className="card" style={{padding:18}}>
      <div style={{fontSize:12,color:"#8fa0ba",marginBottom:10,textTransform:"uppercase",letterSpacing:"0.05em"}}>오늘 할 일</div>
      {items.length===0 && <div style={{fontSize:13,color:"#8fa0ba"}}>등록된 할 일이 없습니다.</div>}
      {items.map((it,i)=>(
        <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",fontSize:14,borderBottom:i<items.length-1?"1px solid #1c3054":"none"}}>
          <span style={{color: it.done ? "#dab64e" : "#8fa0ba"}}>{it.done ? "●" : "○"}</span>
          <span style={{textDecoration: it.done ? "line-through" : "none", color: it.done ? "#8fa0ba":"#f2ecdd"}}>{it.text}</span>
        </div>
      ))}
    </div>
  );
}
function Loader({text}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:10,color:"#dab64e",fontSize:14}}>
      <svg className="spin" width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="9" stroke="#28406b" strokeWidth="3"/>
        <path d="M21 12a9 9 0 0 0-9-9" stroke="#c9a227" strokeWidth="3" strokeLinecap="round"/>
      </svg>
      {text}
    </div>

function Sidebar({route}) {
  const proj = useProject();
  const [msg, setMsg] = useState("");
  const [collapsed, setCollapsed] = useState({});

  const save = async () => {
    try {
      const ok = await window.storage.set("project-state", JSON.stringify(proj.state), false);
      setMsg(ok ? "저장됨 ✓" : "저장 실패");
    } catch (e) { setMsg("저장 실패"); }
    setTimeout(()=>setMsg(""), 2000);
  };
  const load = async () => {
    try {
      const res = await window.storage.get("project-state", false);
      if (res && res.value) { proj.update(()=>JSON.parse(res.value)); setMsg("불러옴 ✓"); }
      else setMsg("저장된 자료 없음");
    } catch (e) { setMsg("저장된 자료 없음"); }
    setTimeout(()=>setMsg(""), 2000);
  };
  const toggleGroup = (label) => setCollapsed(c=>({...c,[label]:!c[label]}));
  const navMap = {};
  NAV_ITEMS.forEach(it=>{ navMap[it.path]=it; });

  return (
    <div style={{width:250,minWidth:250,background:"var(--navy-900)",borderRight:"1px solid var(--navy-700)",
      display:"flex",flexDirection:"column",height:"100vh",position:"sticky",top:0}}>

      <div style={{padding:"18px 16px 12px",borderBottom:"1px solid var(--navy-700)",flexShrink:0}}>

        <div style={{fontSize:12,color:"var(--slate)",marginTop:2}}>논문을 통과시키는 AI</div>
        {proj.state.topic && <div style={{fontSize:11,color:"var(--gold-300)",marginTop:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>📌 {proj.state.topic.slice(0,22)}…</div>}
      </div>
      {/* Scrollable nav */}
      <nav style={{flex:1,overflowY:"auto",padding:"8px 10px"}}>
        {NAV_GROUPS.map(grp=>(
          <div key={grp.label} style={{marginBottom:4}}>
            <div onClick={()=>toggleGroup(grp.label)}

                padding:"6px 6px 4px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",userSelect:"none"}}>
              <span>{grp.label}</span>
              <span style={{fontSize:9}}>{collapsed[grp.label]?"▶":"▼"}</span>
            </div>

              const it = navMap[path]; if(!it) return null;
              const isActive = route===path;
              return (
                <a key={path} className={"sidebar-link"+(isActive?" active":"")} onClick={()=>nav(path)}

function ApplicationStatsCard() {
  const [summary, setSummary] = useState(null);
  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(APPLICATIONS_KEY, true);
        setSummary(res && res.value ? JSON.parse(res.value) : []);
      } catch (e) { setSummary([]); }
    })();
  }, []);
  if (summary === null) return (
    <div className="card" style={{padding:18}}>
      <div style={{fontSize:12,color:"var(--slate)"}}>신청 현황 불러오는 중...</div>
    </div>
  );
  const total = summary.length;
  const done = summary.filter(a=>a.status==="완료").length;
  const inProgress = summary.filter(a=>a.status==="진행중").length;
  const pending = summary.filter(a=>a.status==="접수" || a.status==="입금확인중").length;
  const donePct = total ? Math.round((done/total)*100) : 0;
  const totalRevenue = summary.filter(a=>["입금완료","진행중","완료"].includes(a.status)).reduce((sum,a)=>sum+(a.total||0),0);
  return (
    <div className="card" style={{padding:20}}>
      <div style={{fontSize:12,color:"var(--slate)",marginBottom:14,textTransform:"uppercase",letterSpacing:"0.05em"}}>💳 신청 현황 (운영자 전용)</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
        <ScoreCard label="총 신청자 수" score={total}/>
        <ScoreCard label="접수/입금대기" score={pending}/>
        <ScoreCard label="진행중" score={inProgress}/>
        <ScoreCard label="완료율 %" score={donePct}/>
      </div>
      <div style={{marginTop:10,fontSize:13,color:"var(--slate)"}}>입금 확인된 누적 금액: <span className="mono" style={{color:"var(--gold-300)",fontWeight:700}}>{formatWon(totalRevenue)}</span></div>
      <div style={{marginTop:12}}><button className="btn-ghost" style={{fontSize:12,padding:"7px 12px"}} onClick={()=>nav("/apply")}>신청 현황 관리로 이동 →</button></div>
    </div>
  );
}

              {dotColor && <div style={{position:"absolute",top:8,right:8,width:8,height:8,borderRadius:"50%",background:dotColor}}/>}
              <div style={{fontSize:22,marginBottom:6}}>{it.icon}</div>
              <div style={{fontSize:12,fontWeight:700,lineHeight:1.3}}>{it.label}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function getStagesForType(type) {
  const key = ["현상학적연구","근거이론","내러티브연구","사례연구","질적메타종합","질적메타요약","질적메타분석"].includes(type) ? type : "질적메타종합";
  return (QUAL_TYPES[key]?.stages || QUAL_TYPES["질적메타종합"].stages).map(s=>({...s, done:false, note:"", reason:""}));
}

function computeDocCounts(papers) {
  const c = { academicQual:0, academicQuant:0, academicMixed:0, master:0, doctoral:0, total: papers.length };
  papers.forEach(p => {
    if (p.docType === "academic") {
      if (p.methodType === "질적") c.academicQual++;
      else if (p.methodType === "양적") c.academicQuant++;
      else c.academicMixed++;
    } else if (p.docType === "master") c.master++;
    else if (p.docType === "doctoral") c.doctoral++;
  });
  return c;
}
function formatAuthors(authorsStr) {
  if (!authorsStr) return "";
  const parts = authorsStr.split(/[·,、]/).map(a=>a.trim()).filter(Boolean);
  if (parts.length <= 2) return parts.join(", ");
  return `${parts[0]} 외 ${parts.length-1}명`;
}
function matchMockPapers(topic) {
  const q = topic.toLowerCase();
  const scored = MOCK_PAPERS.map(p => ({
    p, score: p.keywords.reduce((acc,k)=> acc + (q.includes(k.toLowerCase()) || k.toLowerCase().includes(q) ? 1 : 0), 0)
  })).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  const picked = scored.slice(0,20).map((x,i)=>({ ...x.p, relevance: Math.max(50, 97 - i*3) }));
  let genericIdx = 0;
  while (picked.length < 12) {
    const tail = GENERIC_TAIL[genericIdx % GENERIC_TAIL.length];
    picked.push({
      title: `${topic} 관련 ${DOC_TYPES.find(d=>d.key===tail.docType)?.label||"연구"} (샘플 ${picked.length+1})`,
      authors: "샘플저자·공동저자", year: 2023 - (genericIdx % 4), docType: tail.docType, methodType: tail.methodType, source: tail.source,
      summary: `"${topic}" 관련 실제 문헌은 RISS·KCI·DBpia 등에서 직접 검색해 확인해 주세요. 이 항목은 화면 테스트용 예시입니다.`,
      isGeneric: true, relevance: 45 - genericIdx,
    });
    genericIdx++;
  }
  return picked;
}
function buildCitationSentence(p, topic) {
  if (p.isGeneric) return `[예시] ${p.authors}(${p.year})은 ${topic}와 관련된 주요 발견을 보고한 것으로 가정한 샘플 문장입니다. 실제 인용 전 원문을 확인하세요.`;
  return `[예시] ${p.authors}(${p.year})은 ${p.summary.replace(/\.$/,"")}고 밝혔다.`;
}
function generateMockResult(topic, type, docFilter, methodFilter) {
  const allCandidates = matchMockPapers(topic).map(p => ({
    title: p.title, authors: `${p.authors} (${p.year})`, docType: p.docType, methodType: p.methodType, source: p.source,
    note: p.summary, citationSentence: buildCitationSentence(p, topic), isSample: true, relevance: p.relevance,
  }));
  const papers = allCandidates
    .filter(p => docFilter[p.docType] && methodFilter[p.methodType])
    .sort((a,b)=>b.relevance-a.relevance);
  const templates = TITLE_TEMPLATES[type] || TITLE_TEMPLATES["질적연구"];
  const titles = templates.map(t => t.replace("{t}", topic));
  const gap = `"${topic}" 관련 선행연구(샘플 기준)는 주로 현상 기술에 집중되어 있어, 개입 방안이나 장기적 변화 과정에 대한 후속 연구가 필요할 수 있습니다. (예시 문장 — 실제 문헌 검토로 대체해 주세요)`;
  return { allCandidates, papers: papers.length ? papers : allCandidates, titles, gap, isMock: true };
}

        </div>
        <div style={{display:"flex",gap:10,flexWrap:"wrap",fontSize:13}}>
          <span className="tag">학술지·질적 {counts.academicQual}편</span>
          <span className="tag">학술지·양적 {counts.academicQuant}편</span>
          <span className="tag">학술지·혼합 {counts.academicMixed}편</span>
          <span className="tag">석사학위논문 {counts.master}편</span>
          <span className="tag">박사학위논문 {counts.doctoral}편</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:8,flexWrap:"wrap",gap:8}}>
          <div style={{fontSize:12,color:"var(--slate)"}}>전체 {counts.total}편 중 <strong style={{color:"var(--gold-300)"}}>{papers.length}편</strong> 추천 (관련도 순 정렬)</div>
          <div style={{display:"flex",gap:6,alignItems:"center"}}>
            <span style={{fontSize:11,color:"var(--slate)"}}>한번에 보기:</span>
            {[5,10].map(n=>(
              <button key={n} className="btn-ghost" style={{fontSize:11,padding:"4px 10px",
                borderColor: pageSize===n ? "var(--gold-500)" : "var(--navy-600)",
                color: pageSize===n ? "var(--gold-300)" : "var(--ivory)"}}
                onClick={()=>changePageSize(n)}>{n}개씩</button>
            ))}
          </div>
        </div>
      </div>

      {shown.map((p,i)=>(
        <div key={page*pageSize+i} className="card" style={{padding:16}}>
          <div style={{fontWeight:700,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {page*pageSize+i < 3 && !isMock && <span className="tag" style={{color:"#7cc98a",background:"rgba(124,201,138,0.12)"}}>🏆 추천 {page*pageSize+i+1}위</span>}
            {p.title}
            <span className="tag">{DOC_TYPES.find(d=>d.key===p.docType)?.label || "학술지 논문"}{p.methodType ? ` · ${p.methodType}` : ""}</span>
            {typeof p.relevance === "number" && <span className="tag" style={{color:"var(--gold-300)"}}>관련도 {p.relevance}</span>}
            {(p.isSample || p.verified===false) && <span className="flag-warn">[출처 확인 필요]</span>}
          </div>
          <div style={{fontSize:12,color:"var(--slate)",marginTop:2}}>{formatAuthors(p.authors)} · {p.source}</div>
          <div style={{fontSize:13,marginTop:4}}>{p.note}</div>
          {p.citationSentence && <div style={{fontSize:13,marginTop:6,padding:"8px 10px",background:"var(--navy-900)",borderRadius:6,color:"var(--gold-300)"}}>✒ {p.citationSentence}</div>}
          <div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
            {(() => { const l = searchLinks(p.title); return DB_LINKS.map(db=>(
              <a key={db.key} href={l[db.key]} target="_blank" rel="noopener noreferrer" className="btn-ghost" style={{fontSize:10,padding:"4px 8px",textDecoration:"none"}}>{db.label}</a>
            )); })()}
          </div>
        </div>
      ))}
      {papers.length > pageSize && (
        <div style={{display:"flex",gap:8,justifyContent:"center",alignItems:"center"}}>
          <button className="btn-ghost" disabled={page===0} onClick={()=>setPage(p=>p-1)}>이전 {pageSize}개</button>
          <span style={{fontSize:12,color:"var(--slate)"}}>{page+1} / {totalPages}</span>
          <button className="btn-ghost" disabled={page>=totalPages-1} onClick={()=>setPage(p=>p+1)}>다음 {pageSize}개</button>
        </div>
      )}
    </div>
  );
}

function ResearchStart() {
  const proj = useProject();
  const [category, setCategory] = useState(proj.state.category || "");
  const [history, setHistory] = useState([]);
  const snapshot = () => setHistory(h => [...h.slice(-9), { category, topic, type }]);
  const undo = () => {
    if (history.length === 0) return;
    const last = history[history.length-1];
    setCategory(last.category); setTopic(last.topic); setType(last.type);
    setHistory(h => h.slice(0, -1));
  };
  const [topic, setTopic] = useState(proj.state.topic);
  const [type, setType] = useState(proj.state.type || "질적메타종합");
  const [docFilter, setDocFilter] = useState({academic:true, master:true, doctoral:true});
  const [methodFilter, setMethodFilter] = useState({질적:true, 양적:true, 혼합:true});
  const [liveSearch, setLiveSearch] = useState(false);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState("");

  const toggleDoc = (key) => setDocFilter(f => ({...f, [key]: !f[key]}));
  const toggleMethod = (key) => setMethodFilter(f => ({...f, [key]: !f[key]}));

  const saveToProject = (parsed) => {
    setResult(parsed);
    proj.update(s => ({
      ...s, topic, type, category,
      papers: (parsed.papers||[]).map(p=>({
        title:p.title, authors:p.authors, docType:p.docType, methodType:p.methodType, source:p.source,
        note:p.note, citationSentence:p.citationSentence, relevance:p.relevance,
        needsCheck: p.isSample ? true : !p.verified, isSample: !!p.isSample,
      })),
      titles: parsed.titles || [],
    }));
  };

  const runMock = () => {
    if (!topic.trim()) { setError("연구 핵심어를 입력해 주세요."); return; }
    setError("");
    saveToProject(generateMockResult(topic, type, docFilter, methodFilter));
  };

  const runLiveSearch = async () => {
    if (!topic.trim()) { setError("연구 핵심어를 입력해 주세요."); return; }
    setError(""); setLoading(true); setResult(null);
    const sys = `당신은 한국 학술 연구방법론 전문가입니다. 사용자가 입력한 핵심어와 연구유형을 바탕으로 웹 검색을 활용해 실제 존재하는 선행연구를 찾고, 논문 제목 후보와 서론/이론적배경에 활용 가능한 인용 예시 문장을 제안하세요.
반드시 아래 JSON 형식으로만 답변하세요 (설명 문장 없이 JSON만 출력):
{
  "papers": [ { "title":"논문 제목", "authors":"저자(연도)", "docType":"academic 또는 master 또는 doctoral 중 하나", "methodType":"질적 또는 양적 또는 혼합 중 하나", "source":"학술지명 또는 학위수여 대학원", "note":"핵심 내용 한 줄 요약", "citationSentence":"서론/이론적배경에 쓸 수 있는 인용 예시 문장", "relevance": 0-100 정수(핵심어와의 관련도 추정치), "verified": true 또는 false } ],
  "titles": [ "추천 논문 제목 후보 1", "추천 논문 제목 후보 2", "추천 논문 제목 후보 3" ],
  "gap": "선행연구에서 발견한 연구 공백 한두 문장"
}
검색으로 실제 출처를 확인하지 못한 논문은 verified를 false로 표시하세요. 개수를 채우기 위해 논문을 지어내지 마세요 — 검색으로 실제 확인되는 논문만, 최대 15편까지 포함하세요. 확인된 논문이 적으면 적은 개수만 반환해도 됩니다.`;
    const data = await callClaude(
      [{ role: "user", content: `연구 핵심어: ${topic}\n연구유형: ${type}\n관련 선행연구를 검색하고 위 JSON 형식으로 정리해 주세요.` }],
      { system: sys, tools: [{ type: "web_search_20250305", name: "web_search" }] }
    );
    setLoading(false);
    if (data.error) { setError("이 파일에서는 실시간 웹 검색 연결이 되지 않아 샘플 데이터로 대체합니다."); runMock(); return; }
    const parsed = parseJSONLoose(extractText(data));
    if (!parsed) { setError("실시간 탐색 결과를 해석하지 못해 샘플 데이터로 대체합니다."); runMock(); return; }
    const allCandidates = (parsed.papers||[]).map(p=>({...p, isSample:false, relevance: typeof p.relevance==="number" ? p.relevance : 60}));
    const papers = allCandidates.filter(p => docFilter[p.docType] && methodFilter[p.methodType]).sort((a,b)=>b.relevance-a.relevance);
    saveToProject({ ...parsed, allCandidates, papers: papers.length ? papers : allCandidates, isMock:false });
  };

  const runSearch = () => { liveSearch ? runLiveSearch() : runMock(); };

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="연구 시작" subtitle="카테고리를 고르고 핵심어를 입력하면 선행연구 샘플과 인용 예시 문장을 확인할 수 있습니다."/>
      <div style={{marginTop:24,display:"flex",flexDirection:"column",gap:14}}>
        <div>
          <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>연구 카테고리</label>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {Object.keys(CATEGORIES).map(c=>(
              <button key={c} className="btn-ghost" style={{padding:"7px 14px",fontSize:13,
                borderColor: category===c ? "var(--gold-500)" : "var(--navy-600)",
                color: category===c ? "var(--gold-300)" : "var(--ivory)"}}
                onClick={()=>{snapshot(); setCategory(c);}}>{c}</button>
            ))}
          </div>
        </div>
        {category && (
          <div>
            <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>추천 핵심어 (클릭할 때마다 콤마로 추가됩니다)</label>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {CATEGORIES[category].map(k=>(
                <span key={k} className="tag" style={{cursor:"pointer",padding:"5px 10px"}}
                  onClick={()=>setTopic(t => t.trim() ? (t.includes(k) ? t : `${t}, ${k}`) : k)}>{k}</span>
              ))}
            </div>
          </div>
        )}
        <div>
          <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>연구 핵심어</label>
          <div style={{display:"flex",gap:8}}>
            <input style={{flex:1}} placeholder="예: 상담자 소진과 회복, 장기 구직 청년 진로절망감..." value={topic} onChange={e=>setTopic(e.target.value)} />
            {topic && <button className="btn-ghost" style={{flexShrink:0,fontSize:12,padding:"9px 12px"}} onClick={()=>setTopic("")}>🔄 지우기</button>}
          </div>
        </div>
        <div>
          <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>연구 유형</label>
          <select style={{width:260}} value={type} onChange={e=>{snapshot(); setType(e.target.value);}}>
            <option>질적연구</option>
            <option>양적연구</option>
            <option>혼합연구</option>
            <option>질적메타종합</option>
            <option>연구동향분석</option>
          </select>
        </div>
        {(type==="질적연구"||type==="질적메타종합") && (
          <div>
            <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>질적 연구 세부 유형 (설계실 절차에 반영됩니다)</label>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {Object.keys(QUAL_TYPES).map(k=>(
                <button key={k} className="btn-ghost" style={{fontSize:12,padding:"6px 12px",
                  borderColor: proj.state.qualSubType===k ? "var(--gold-500)" : "var(--navy-600)",
                  color: proj.state.qualSubType===k ? "var(--gold-300)" : "var(--ivory)"}}
                  onClick={()=>proj.update(s=>({...s, qualSubType:k, designerStages:getStagesForType(k)}))}>
                  {QUAL_TYPES[k].label.split(" (")[0]}
                </button>
              ))}
            </div>
            <div style={{fontSize:11,color:"var(--slate)",marginTop:6}}>선택한 유형의 상세 가이드 →
              <button className="btn-ghost" style={{fontSize:11,padding:"3px 8px",marginLeft:6}} onClick={()=>nav("/qualtype")}>🔬 질적유형 가이드</button>
            </div>
          </div>
        )}
        <div>
          <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>논문 유형 필터</label>
          <div style={{display:"flex",gap:14}}>
            {DOC_TYPES.map(d=>(
              <label key={d.key} style={{fontSize:13,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                <input type="checkbox" checked={docFilter[d.key]} onChange={()=>toggleDoc(d.key)} />
                {d.label}
              </label>
            ))}
          </div>
        </div>
        <div>
          <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>연구방법 필터 (학술지·학위논문 공통)</label>
          <div style={{display:"flex",gap:14}}>
            {METHOD_TYPES.map(m=>(
              <label key={m} style={{fontSize:13,display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
                <input type="checkbox" checked={methodFilter[m]} onChange={()=>toggleMethod(m)} />
                {m}
              </label>
            ))}
          </div>
        </div>
        <div style={{display:"flex",gap:14,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:220}}>
            <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>목표 논문 분량</label>
            <input style={{width:"100%"}} placeholder="예: A4 25매 이상" value={proj.state.targetPages} onChange={e=>proj.update(s=>({...s, targetPages:e.target.value}))} />
          </div>
          <div style={{flex:1,minWidth:220}}>
            <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>제출 기한</label>
            <input type="date" style={{width:"100%"}} value={proj.state.deadline} onChange={e=>proj.update(s=>({...s, deadline:e.target.value}))} />
          </div>
        </div>
        <label style={{fontSize:12,color:"var(--slate)",display:"flex",alignItems:"center",gap:6,cursor:"pointer"}}>
          <input type="checkbox" checked={liveSearch} onChange={e=>setLiveSearch(e.target.checked)} />
          실시간 AI 웹 검색 시도 (이 파일 형태에서는 보통 연결되지 않아 자동으로 샘플로 대체됩니다)
        </label>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {history.length > 0 && (
            <button className="btn-ghost" style={{fontSize:12,padding:"9px 14px"}} onClick={undo}>↩ 이전 단계로</button>
          )}
          <button className="btn-gold" onClick={runSearch} disabled={loading}>
            {loading ? "탐색 중..." : liveSearch ? "🔍 실시간 논문 탐색 + 제목 생성" : "🧪 논문 탐색 + 제목 생성 (샘플 모드, API 불필요)"}
          </button>
        </div>
        {loading && <Loader text="선행연구를 검색하고 제목 후보를 구성하는 중입니다..."/>}
        {error && <div style={{color:"var(--danger)",fontSize:13}}>{error}</div>}

        {result && (
          <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:18}}>
            {result.isMock && (
              <div className="card" style={{padding:12,fontSize:12,color:"var(--gold-300)",borderLeft:"3px solid var(--gold-500)"}}>
                🧪 지금은 <strong>샘플 모드</strong>입니다 (오프라인 파일이거나 "실시간 웹 검색" 체크를 안 하신 경우). 아티팩트 환경에서 "실시간 AI 웹 검색"을 체크하면 이 샘플 문구 없이 실제 검색된 선행연구가 표시됩니다.
              </div>
            )}
            <div className="card" style={{padding:18}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>추천 논문 제목</div>
              {result.titles.map((t,i)=>(<div key={i} style={{padding:"8px 0",borderBottom:i<result.titles.length-1?"1px solid var(--navy-700)":"none"}}>{i+1}. {t}</div>))}
            </div>
            <div className="card" style={{padding:18}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>발견한 연구 공백</div>
              <div style={{fontSize:14,color:"var(--ivory)"}}>{result.gap}</div>
            </div>
            <PaperResultsBlock allCandidates={result.allCandidates || result.papers} papers={result.papers} isMock={result.isMock} />
            <div><button className="btn-ghost" onClick={()=>nav("/explorer")}>논문 탐색실에서 계속 관리하기 →</button></div>
          </div>
        )}
      </div>
    </div>
  );
}

function PaperExplorer() {
  const proj = useProject();
  const papers = proj.state.papers;
  const [newTitle, setNewTitle] = useState("");
  const [searchQuery, setSearchQuery] = useState("");
  const [searchResults, setSearchResults] = useState([]);
  const [searching, setSearching] = useState(false);

  const addPaper = () => {
    if (!newTitle.trim()) return;
    proj.update(s => ({...s, papers: [...s.papers, {title:newTitle, authors:"직접 추가", note:"", needsCheck:true}]}));
    setNewTitle("");
  };

  const runSearch = async () => {
    if (!searchQuery.trim()) return;
    setSearching(true); setSearchResults([]);
    const sys = `당신은 한국 학술 문헌 전문가입니다. 아래 주제어 또는 논문 제목으로 실제 또는 실제에 가까운 관련 선행연구를 최대 10편 찾아주세요.
반드시 아래 JSON 배열 형식으로만 출력하세요:
[ { "title":"논문 제목", "authors":"저자(연도)", "source":"학술지명 또는 학위수여기관", "docType":"academic 또는 master 또는 doctoral", "methodType":"질적 또는 양적 또는 혼합", "abstract":"100자 내외 요약", "relevance":0-100 } ]
출처를 확인하지 못한 논문은 포함하지 마세요. 확인된 논문이 적으면 적은 수만 반환해도 됩니다.`;
    const data = await callClaude(
      [{ role:"user", content: `검색어: ${searchQuery}\n관련 선행연구를 검색해 주세요.` }],
      { system: sys, tools: [{ type:"web_search_20250305", name:"web_search" }] }
    );
    setSearching(false);
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed && Array.isArray(parsed)) {
      setSearchResults(parsed.sort((a,b)=>b.relevance-a.relevance));
    } else {
      const mock = matchMockPapers(searchQuery).map(p=>({
        title:p.title, authors:`${p.authors} (${p.year})`, source:p.source,
        docType:p.docType, methodType:p.methodType, abstract:p.summary, relevance:p.relevance, isSample:true,
      }));
      setSearchResults(mock);
    }
  };

  const addFromSearch = (r) => {
    const l = searchLinks(r.title);
    proj.update(s=>({...s, papers:[...s.papers, {
      title:r.title, authors:r.authors, source:r.source, docType:r.docType,
      methodType:r.methodType, note:r.abstract, needsCheck:true, isSample:r.isSample,
      riss:l.riss, dbpia:l.dbpia, scholar:l.scholar,
    }]}));
  };

  const toggleSelect = (i) => {
    proj.update(s => {
      const ids = s.selectedPaperIds.includes(i)
        ? s.selectedPaperIds.filter(x=>x!==i)
        : [...s.selectedPaperIds, i];
      return {...s, selectedPaperIds: ids};
    });
  };
  const selIds = proj.state.selectedPaperIds;
  const selectedPapers = papers.filter((_,i)=>selIds.includes(i));

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="논문 탐색실" subtitle="주제어·논문 제목으로 선행연구를 탐색하고 목록에 추가합니다."/>

      <div className="card" style={{padding:18,marginTop:16,display:"flex",flexDirection:"column",gap:10}}>

function StageCard({ st, i, proj }) {
  const [loading, setLoading] = useState(false);
  const [reason, setReason] = useState(st.reason || "");
  const s = proj.state;
  const qtLabel = QUAL_TYPES[s.qualSubType || "질적메타종합"]?.label || "질적 연구";

  const toggle = () => proj.update(prev=>{
    const arr=[...prev.designerStages]; arr[i]={...arr[i], done: !arr[i].done}; return {...prev, designerStages: arr};
  });
  const setNote = (val) => proj.update(prev=>{
    const arr=[...prev.designerStages]; arr[i]={...arr[i], note: val}; return {...prev, designerStages: arr};
  });
  const setDoneWithReason = (done, why) => proj.update(prev=>{
    const arr=[...prev.designerStages]; arr[i]={...arr[i], done, reason: why}; return {...prev, designerStages: arr};
  });

  const checkCompletion = async () => {
    if (!st.note.trim()) { setReason("메모를 먼저 작성해야 확인할 수 있습니다."); return; }
    setLoading(true);
    const sys = `당신은 ${qtLabel} 전문 연구방법론 교수입니다. 아래는 "${st.name}" 단계(${st.desc})에 대해 연구자가 작성한 진행 메모입니다. 이 메모가 해당 단계를 학술적으로 충분히 수행했다고 볼 수 있는지 엄격하게 판단하세요. 단순히 계획만 있거나 분량이 매우 짧으면 미완료로 판단하세요.
반드시 아래 JSON 형식으로만 답변하세요:
{ "complete": true 또는 false, "reason": "구체적인 판단 근거 1~2문장" }`;
    const data = await callClaude([{ role:"user", content: st.note }], { system: sys, timeoutMs: 15000 });
    setLoading(false);
    let parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (!parsed) parsed = localFallbackStageCheck(st.note);
    setReason(parsed.reason);
    setDoneWithReason(!!parsed.complete, parsed.reason);
  };

  return (
    <div className="card" style={{padding:16,borderLeft: st.done ? "3px solid var(--gold-500)" : "3px solid var(--navy-600)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontWeight:700,fontSize:15}}>{st.name}</div>
          <div style={{fontSize:13,color:"var(--slate)",marginTop:2}}>{st.desc}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn-gold" style={{fontSize:12,padding:"7px 10px"}} disabled={loading} onClick={checkCompletion}>{loading ? "확인 중..." : "AI로 내용 확인 → 자동 완료"}</button>
          <button className="btn-ghost" style={{fontSize:12,padding:"7px 10px"}} onClick={toggle}>{st.done ? "완료 해제(수동)" : "수동 완료 표시"}</button>
        </div>
      </div>
      <textarea style={{width:"100%",marginTop:10,minHeight:50}} placeholder="이 단계의 진행 메모를 작성한 뒤 'AI로 내용 확인'을 눌러보세요." value={st.note} onChange={e=>setNote(e.target.value)} />
      {reason && (
        <div style={{marginTop:8,fontSize:12,color: st.done ? "var(--gold-300)" : "var(--slate)"}}>
          {st.done ? "✅ " : "⏳ "}{reason}
        </div>
      )}
    </div>
  );
}

  const proj = useProject();

function AIProfessor() {
  const proj = useProject();
  const s = proj.state;
  const [draft, setDraft] = useState("");
  const [loading, setLoading] = useState(false);
  const [panelResults, setPanelResults] = useState([]);
  const [error, setError] = useState("");
  const [rewriting, setRewriting] = useState(false);
  const [rewriteResult, setRewriteResult] = useState("");
  const [isDragOver, setIsDragOver] = useState(false);
  const [revisionRound, setRevisionRound] = useState(0); // 0=최초평가, 1=1차수정(70→80), 2=2차(80→90), 3=최종(90→100)
  const [roundHistory, setRoundHistory] = useState([]); // 라운드별 평균점수 기록
  const fileRef = useRef(null);

  const handleDrop = async (e) => {
    e.preventDefault(); setIsDragOver(false);
    const file = e.dataTransfer?.files?.[0] || e.target?.files?.[0];
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'pdf' || ext === 'hwp' || ext === 'hwpx' || ext === 'txt' || ext === 'md') {
      const text = await extractTextFromFile(file);
      if (text && text.trim().length > 30) {
        setDraft(text);
      } else {
        setError(`"${file.name}" 텍스트 추출이 제한됩니다.\n\n💡 해결 방법:\n1. 한글에서 [파일 → 다른이름으로저장 → 파일형식: 텍스트(.txt)] 선택 후 저장\n2. 저장된 .txt 파일을 업로드하거나 내용을 아래 텍스트 박스에 복사·붙여넣기\n\nPDF는 텍스트 레이어가 있는 전자 PDF여야 합니다 (스캔본 불가).`);
      }
    } else {
      setError("지원 형식: .hwp, .hwpx, .pdf, .txt, .md");
    }
  };

  const qtKey = s.qualSubType || "질적메타종합";
  const qtInfo = QUAL_TYPES[qtKey];
  const qtLabel = qtInfo?.label || "질적 연구";
  const checklist = (qtInfo?.checklist || []).join(" / ");

  // 라운드별 목표 점수대와 집중 포커스
  const ROUND_CONFIG = [
    { label:"최초 평가", targetMin:0,  targetMax:100, focus:"전면 진단 — 구조·내용·방법론 전반의 문제점을 모두 찾아내세요." },
    { label:"1차 수정 (70→80점대)", targetMin:70, targetMax:80,  focus:"치명적 문제(방법론 오류, 논리 비약, 핵심 인용 누락)를 집중 수정합니다." },
    { label:"2차 수정 (80→90점대)", targetMin:80, targetMax:90,  focus:"학술적 완성도(문체, 이론 연결, 세부 인용 정확성)를 높이는 데 집중합니다." },
    { label:"3차 수정 (90→100점대)", targetMin:90, targetMax:100, focus:"최종 완성도(문장 정교함, 흐름, 논문 전체 일관성)를 극대화합니다." },
  ];

  const currentRoundConfig = ROUND_CONFIG[Math.min(revisionRound, 3)];

  const evaluatePanel = async (panel) => {
    const rc = currentRoundConfig;
    const sys = `당신은 ${panel.role}이며 한국 최상위 학술지의 심사위원입니다.
연구유형: ${qtLabel}. 전문 평가 포커스: ${panel.focus}.
심사 기준: ${checklist}
현재 평가 라운드: ${rc.label}
이번 라운드 집중 포커스: ${rc.focus}

【매우 중요】 극도로 엄격하게 평가하세요.
- 사소한 문제도 구체적으로 지적하세요. "좋습니다" 같은 모호한 평가는 금지입니다.
- "~문단의 ~문장을 ~방향으로 수정"처럼 위치와 개선방향을 구체적으로 제시하세요.
- 각 문제점에 학술적 근거를 제시하세요.

반드시 아래 JSON 형식으로만 답변하세요:
{ "scores":[{"item":"평가항목","score":0-100,"basis":"점수 근거"}], "issues":["[치명적/중요/경미] 문제점 — 위치·내용·개선방향 포함"], "suggestions":["구체적 수정 제안"], "journalFit":0-100, "fatalIssues":["게재 불가 요인 (없으면 빈 배열)"] }`;
    const data = await callClaude(
      [{ role:"user", content:`연구주제: ${s.topic}\n연구유형: ${s.type} (${qtLabel})\n평가 라운드: ${rc.label}\n\n[심사 대상 원고]\n${draft.slice(0,3000)}` }],
      { system: sys }
    );
    const parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (parsed) return { ...panel, ...parsed };
    const fb = localFallbackScore(panel.role);
    return { ...panel, scores:[{item:panel.role, score:fb.score, basis:"오프라인 임시 점수"}], issues:[fb.comment], suggestions:[fb.suggestions||""], journalFit:65, fatalIssues:[] };
  };

  const runAllPanels = async () => {
    if (!draft.trim()) { setError("원고를 붙여넣거나 파일을 업로드해 주세요."); return; }
    setError(""); setLoading(true); setPanelResults([]); setRewriteResult("");
    const results = await Promise.allSettled(PROFESSOR_PANELS.map(p=>evaluatePanel(p)));
    const final = results.map((r,i)=> r.status==="fulfilled" ? r.value : { ...PROFESSOR_PANELS[i], scores:[], issues:["평가 중 오류"], suggestions:[], journalFit:0, fatalIssues:[] });
    setPanelResults(final);
    const avgJournalFit = Math.round(final.reduce((a,r)=>a+(r.journalFit||0),0)/final.length);
    const allIssues = final.flatMap(r=>r.issues||[]).filter(Boolean);
    setRoundHistory(h=>[...h, { round: revisionRound, label: currentRoundConfig.label, avg: avgJournalFit }]);
    proj.update(prev=>({
      ...prev,
      scores: final.flatMap(r=>(r.scores||[]).map(sc=>({item:sc.item, score:sc.score}))),
      feedbackLog: [...prev.feedbackLog, {
        date: new Date().toLocaleDateString('ko-KR'),
        overall: `[${currentRoundConfig.label}] 8인 패널 평균 ${avgJournalFit}%. 주요 지적: ${allIssues.slice(0,3).join(" / ")}`,
        scores: final.flatMap(r=>r.scores||[]), resolved:false
      }]
    }));
    setLoading(false);
  };

  const generateFinalReport = async () => {
    if (!draft.trim() || panelResults.length===0) { setError("먼저 8인 패널 평가를 실행해 주세요."); return; }
    setRewriting(true); setRewriteResult("");
    const issues = panelResults.flatMap(r=>(r.issues||[])).join("\n");
    const suggestions = panelResults.flatMap(r=>(r.suggestions||[])).join("\n");
    const rc = currentRoundConfig;
    const sys = `당신은 한국 학술논문 수정 전문가입니다. 지도교수 8인 패널의 지적을 반영하여 원고를 개선하세요.
현재 수정 라운드: ${rc.label}
이번 라운드 집중 사항: ${rc.focus}
규칙: (1) 원고 기본 내용 유지, (2) APA 본문인용 표기, (3) 문단 연결 자연스럽게, (4) [수정됨: 이유] 형태로 수정 위치 표시.
수정된 논문 텍스트만 출력하세요.`;
    const data = await callClaude(
      [{ role:"user", content:`[현재 원고]\n${rewriteResult||draft}\n\n[이번 라운드 지적사항]\n${issues}\n\n[수정 제안]\n${suggestions}` }],
      { system: sys }
    );
    const text = data.error ? "" : extractText(data);
    if (!text.trim()) {
      setRewriteResult(`[오프라인] 다음 수정 제안을 직접 반영해 주세요:\n\n지적사항:\n${issues}\n\n수정 제안:\n${suggestions}`);
    } else {
      setRewriteResult(text);
      // 수정 완료 후 다음 라운드로 이동 가능
      setRevisionRound(r=>Math.min(r+1, 3));
    }
    setRewriting(false);
  };

  const avgFit = panelResults.length ? Math.round(panelResults.reduce((a,r)=>a+(r.journalFit||0),0)/panelResults.length) : 0;

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🎓 지도교수 8인 패널" subtitle="방법론·이론·글쓰기·윤리·학술지심사·분석·영향력·편집 전문가 8인이 동시에 원고를 평가합니다."/>

      {/* 단계별 수정 라운드 진행바 */}
      <div className="card" style={{padding:14,marginTop:16,marginBottom:8}}>
        <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10}}>📈 단계별 점수 향상 로드맵</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {ROUND_CONFIG.map((rc,i)=>(
            <div key={i} style={{flex:1,minWidth:160,padding:"10px 12px",borderRadius:6,
              background: i===revisionRound ? "rgba(201,162,39,0.12)" : "var(--navy-900)",
              border: i===revisionRound ? "1px solid var(--gold-500)" : "1px solid var(--navy-700)",
              cursor:"pointer"}} onClick={()=>setRevisionRound(i)}>
              <div style={{fontSize:11,fontWeight:700,color: i===revisionRound?"var(--gold-300)":"var(--slate)"}}>{rc.label}</div>
              {roundHistory.find(h=>h.round===i) && (
                <div style={{fontSize:12,color:"#7cc98a",marginTop:4}}>달성 점수: {roundHistory.find(h=>h.round===i).avg}점</div>
              )}
              {i>0 && !roundHistory.find(h=>h.round===i) && (
                <div style={{fontSize:11,color:"var(--slate)",marginTop:2}}>이전 라운드 완료 후 활성화</div>
              )}
            </div>
          ))}
        </div>
        <div style={{fontSize:11,color:"var(--slate)",marginTop:8}}>
          💡 현재 라운드: <strong style={{color:"var(--gold-300)"}}>{currentRoundConfig.label}</strong> — {currentRoundConfig.focus}
        </div>
      </div>

      <div style={{marginTop:8}}>
        <div
          onDragOver={e=>{e.preventDefault();setIsDragOver(true);}}
          onDragLeave={()=>setIsDragOver(false)}
          onDrop={handleDrop}
          style={{border:`2px dashed ${isDragOver?"var(--gold-500)":"var(--navy-600)"}`,borderRadius:8,padding:16,marginBottom:10,transition:"border-color .2s",textAlign:"center",cursor:"pointer"}}
          onClick={()=>fileRef.current?.click()}>
          <input ref={fileRef} type="file" accept=".hwp,.hwpx,.pdf,.txt,.md" style={{display:"none"}} onChange={handleDrop}/>
          <div style={{fontSize:13,color:"var(--slate)"}}>📁 논문 파일을 드래그하거나 클릭하여 업로드</div>
          <div style={{fontSize:11,color:"var(--slate)",marginTop:4}}>지원 형식: .hwp · .hwpx · .pdf · .txt · .md</div>
          <div style={{fontSize:11,color:"var(--gold-400)",marginTop:2}}>※ HWP 깨짐 시: 한글에서 다른이름저장 → .txt 로 저장 후 업로드하거나 내용을 아래 박스에 직접 붙여넣기</div>
        </div>
        <textarea style={{width:"100%",minHeight:200}} placeholder="원고 텍스트를 붙여넣으세요. (HWP 파일이 깨지면 한글에서 Ctrl+A → Ctrl+C 후 여기에 Ctrl+V)" value={draft} onChange={e=>{setDraft(e.target.value); setError("");}} />
        {draft.length > 0 && <div style={{fontSize:11,color:"var(--slate)",marginTop:4}}>{draft.length.toLocaleString()}자 입력됨</div>}
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap"}}>
          <button className="btn-gold" onClick={runAllPanels} disabled={loading}>{loading ? "8인 패널 평가 중..." : `🎓 [${currentRoundConfig.label}] 8인 평가 시작`}</button>
          {panelResults.length>0 && <button className="btn-ghost" onClick={generateFinalReport} disabled={rewriting}>{rewriting ? "수정본 생성 중..." : `📝 수정 반영 → ${revisionRound<3?`${ROUND_CONFIG[Math.min(revisionRound+1,3)].label} 수정본`:"최종 완성본"} 생성`}</button>}
        </div>
        {loading && <div style={{marginTop:12}}><Loader text={`8인 패널이 병렬로 원고를 평가하는 중입니다... (${panelResults.length}/${PROFESSOR_PANELS.length} 완료)`}/></div>}
        {error && <div style={{color:"var(--danger)",fontSize:13,marginTop:10,whiteSpace:"pre-line"}}>{error}</div>}
      </div>

      {panelResults.length>0 && (
        <div style={{marginTop:24,display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
            <div className="card" style={{padding:18}}>
              <SealGauge value={avgFit} size={100} label="평균 학술지 적합도"/>
            </div>
            <div className="card" style={{padding:16,flex:1,minWidth:200}}>
              <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:8}}>종합 평가</div>
              <div style={{fontSize:13,color:avgFit>=80?"#7cc98a":avgFit>=60?"var(--gold-300)":"var(--danger)"}}>
                {avgFit>=80?"✅ 학술지 게재 가능성 높음 — 소폭 수정 후 투고 권장":avgFit>=60?"⚠ 일부 보완 필요 — 주요 지적 사항을 반영한 후 재투고 검토":
                "❌ 상당한 수정 필요 — 8인 패널의 지적 사항을 전면 반영하세요"}
              </div>
            </div>
          </div>

          {panelResults.map((r,i)=>(
            <div key={i} className="card" style={{padding:16,borderLeft:`3px solid ${r.color}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
                <div>
                  <div style={{fontWeight:700,color:r.color}}>#{i+1} {r.role}</div>
                  <div style={{fontSize:12,color:"var(--slate)"}}>포커스: {r.focus}</div>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span className="mono" style={{fontSize:18,color:r.color}}>{r.journalFit||0}</span>
                  <span style={{fontSize:11,color:"var(--slate)"}}>/ 100 학술지 적합도</span>
                </div>
              </div>
              {(r.scores||[]).length>0 && (
                <table style={{marginBottom:10}}>
                  <tbody>
                    {r.scores.map((sc,j)=>(
                      <tr key={j}><td style={{color:"var(--slate)",width:180,fontSize:12}}>{sc.item}</td><td className="mono" style={{color:r.color}}>{sc.score}</td></tr>
                    ))}
                  </tbody>
                </table>
              )}
              {(r.fatalIssues||[]).length>0 && (
                <div style={{marginBottom:8,padding:"8px 10px",background:"rgba(201,101,78,0.12)",borderRadius:6,border:"1px solid var(--danger)"}}>
                  <div style={{fontSize:11,color:"var(--danger)",marginBottom:4,fontWeight:700}}>🔴 게재 불가 요인</div>
                  {r.fatalIssues.map((fi,j)=>(<div key={j} style={{fontSize:12,color:"var(--danger)"}}>• {fi}</div>))}
                </div>
              )}
              {(r.issues||[]).length>0 && (
                <div style={{marginBottom:8}}>
                  <div style={{fontSize:11,color:"var(--slate)",marginBottom:4}}>지적 사항</div>
                  {r.issues.map((issue,j)=>(<div key={j} style={{fontSize:13,padding:"4px 0",color:"var(--ivory)"}}>• {issue}</div>))}
                </div>
              )}
              {(r.suggestions||[]).length>0 && (
                <div>
                  <div style={{fontSize:11,color:"var(--slate)",marginBottom:4}}>수정 제안</div>
                  {r.suggestions.map((sg,j)=>(<div key={j} style={{fontSize:13,padding:"4px 0",color:"var(--gold-300)"}}>→ {sg}</div>))}
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {rewriteResult && (
        <div style={{marginTop:24}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div style={{fontSize:14,fontWeight:700,color:"var(--gold-300)"}}>📄 수정 완료 논문 (최종 보고서)</div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn-ghost" style={{fontSize:12}} onClick={()=>navigator.clipboard.writeText(rewriteResult)}>📋 복사</button>
              <button className="btn-gold" style={{fontSize:12}} onClick={()=>downloadText(`revised-paper-${(s.topic||"untitled").slice(0,15)}.txt`, rewriteResult)}>⬇ 다운로드</button>
            </div>
          </div>
          <div className="card" style={{padding:0,overflow:"hidden"}}>
            <div style={{display:"flex",minHeight:400}}>
              {/* Left: panel score summary */}
              <div style={{width:220,flexShrink:0,borderRight:"1px solid var(--navy-700)",overflowY:"auto"}}>
                <div style={{padding:"10px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>패널 점수 요약</div>
                {panelResults.map((r,i)=>(
                  <div key={i} style={{padding:"10px 12px",borderBottom:"1px solid var(--navy-700)"}}>
                    <div style={{fontSize:11,fontWeight:700,color:r.color,marginBottom:3}}>{r.role.split(" ")[0]}</div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span style={{fontSize:10,color:"var(--slate)"}}>학술지 적합도</span>
                      <span className="mono" style={{fontSize:14,color:r.color}}>{r.journalFit||0}</span>
                    </div>
                    {(r.issues||[]).slice(0,1).map((issue,j)=>(
                      <div key={j} style={{fontSize:10,color:"var(--slate)",marginTop:3}}>• {issue.slice(0,40)}{issue.length>40?"…":""}</div>
                    ))}
                  </div>
                ))}
              </div>
              {/* Right: full text */}
              <div style={{flex:1,overflowY:"auto"}}>
                <div style={{padding:"10px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>👁 수정 완성본</div>
                <pre style={{whiteSpace:"pre-wrap",fontFamily:"'Noto Sans KR',sans-serif",fontSize:13,lineHeight:1.8,color:"var(--ivory)",margin:0,padding:"16px",maxHeight:600,overflowY:"auto"}}>{rewriteResult}</pre>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FeedbackRoom() {
  const proj = useProject();
  const log = proj.state.feedbackLog;
  const [filter, setFilter] = useState("전체");
  const toggleResolved = (realIdx) => proj.update(s=>{
    const arr=[...s.feedbackLog]; arr[realIdx]={...arr[realIdx], resolved: !arr[realIdx].resolved}; return {...s, feedbackLog: arr};
  });
  const deleteEntry = (realIdx) => proj.update(s=>({...s, feedbackLog: s.feedbackLog.filter((_,i)=>i!==realIdx)}));
  const clearAll = () => { if(window.confirm("피드백 이력을 모두 삭제하시겠습니까?")) proj.update(s=>({...s, feedbackLog:[]})); };

  const pending = log.filter(f=>!f.resolved).length;
  const done = log.filter(f=>f.resolved).length;
  const filtered = filter==="반영대기" ? log.map((f,i)=>({...f,_i:i})).filter(f=>!f.resolved)
    : filter==="반영완료" ? log.map((f,i)=>({...f,_i:i})).filter(f=>f.resolved)
    : log.map((f,i)=>({...f,_i:i}));

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="💬 교수 피드백 반영실" subtitle="지도교수 8인 패널의 평가 이력을 추적하고 반영 여부를 관리합니다."/>

      {/* Summary stats */}
      <div style={{display:"flex",gap:14,marginTop:16,marginBottom:16,flexWrap:"wrap"}}>
        <div className="card" style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:26,fontWeight:700,fontFamily:"JetBrains Mono",color:"var(--gold-300)"}}>{log.length}</span>
          <span style={{fontSize:13,color:"var(--slate)"}}>전체 피드백</span>
        </div>
        <div className="card" style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:26,fontWeight:700,fontFamily:"JetBrains Mono",color:"var(--danger)"}}>{pending}</span>
          <span style={{fontSize:13,color:"var(--slate)"}}>반영 대기중</span>
        </div>
        <div className="card" style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:26,fontWeight:700,fontFamily:"JetBrains Mono",color:"#7cc98a"}}>{done}</span>
          <span style={{fontSize:13,color:"var(--slate)"}}>반영 완료</span>
        </div>
        {log.length > 0 && (
          <div className="card" style={{padding:"12px 20px",display:"flex",alignItems:"center",gap:12}}>
            <span style={{fontSize:26,fontWeight:700,fontFamily:"JetBrains Mono",color:"var(--gold-300)"}}>{Math.round((done/log.length)*100)}%</span>
            <span style={{fontSize:13,color:"var(--slate)"}}>반영률</span>
          </div>
        )}
        <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
          {log.length>0 && <button className="btn-ghost" style={{fontSize:11,padding:"5px 10px",color:"var(--danger)"}} onClick={clearAll}>전체 삭제</button>}
        </div>
      </div>

      {/* Filter tabs */}
      <div style={{display:"flex",gap:6,marginBottom:14}}>

function HealthCheck() {
  const proj = useProject();
  const s = proj.state;
  const designerPct = Math.round((s.designerStages.filter(x=>x.done).length / s.designerStages.length) * 100);
  const avgScore = s.scores.length ? Math.round(s.scores.reduce((a,b)=>a+b.score,0)/s.scores.length) : 0;
  const verifiedRatio = s.papers.length ? Math.round((s.papers.filter(p=>!p.needsCheck).length / s.papers.length)*100) : 0;
  const draftKeys = Object.keys(s.paperDraft || {});
  const draftPct = draftKeys.length ? Math.round((draftKeys.filter(k=>(s.paperDraft[k]||"").trim()).length / draftKeys.length)*100) : 0;
  const qaTotal = (s.qaLog||[]).length;
  const qaPct = qaTotal ? Math.round(((s.qaLog||[]).filter(q=>q.answer && q.answer.trim()).length / qaTotal)*100) : 0;
  const participantPct = (s.participants||[]).length >= 3 ? 100 : Math.round(((s.participants||[]).length / 3)*100);
  const codingPct = (s.codingData||[]).length >= 5 ? 100 : Math.round(((s.codingData||[]).length / 5)*100);
  const overall = Math.round((designerPct + avgScore + verifiedRatio + draftPct + qaPct + participantPct + codingPct)/7);
  const warnings = s.papers.filter(p=>p.needsCheck);

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🩺 논문 건강검진" subtitle="설계 진행률, 지도교수 점수, 출처 검증 상태를 종합 점검합니다."/>
      <div style={{marginTop:24,display:"flex",gap:32,alignItems:"center",flexWrap:"wrap"}}>
        <div className="card" style={{padding:28}}>
          <SealGauge value={overall} size={150} label="종합 건강 점수"/>
        </div>
        <div className="dash-grid-4" style={{flex:1,minWidth:280}}>
          <ScoreCard label="연구 설계 진행률" score={designerPct}/>
          <ScoreCard label="지도교수 평균 점수" score={avgScore}/>
          <ScoreCard label="출처 검증률" score={verifiedRatio}/>
          <ScoreCard label="원고 작성률" score={draftPct}/>
          <ScoreCard label="질문응답 완료율" score={qaPct}/>
          <ScoreCard label="연구참여자 충족도" score={participantPct}/>
          <ScoreCard label="코딩 데이터 충족도" score={codingPct}/>
        </div>
      </div>

      <div className="card" style={{padding:18,marginTop:28}}>
        <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>주의가 필요한 항목</div>
        {warnings.length===0 && <div style={{fontSize:14,color:"var(--slate)"}}>현재 출처 미검증 논문이 없습니다.</div>}
        {warnings.map((w,i)=>(
          <div key={i} style={{padding:"6px 0",fontSize:14}}><span className="flag-warn">⚠</span> {w.title} — 출처 확인이 필요합니다.</div>
        ))}
        {designerPct < 100 && <div style={{padding:"6px 0",fontSize:14}}><span className="flag-warn">⚠</span> 연구 설계 절차 중 미완료 단계가 있습니다.</div>}
      </div>

      {(() => {
        const qtKey = s.qualSubType || "질적메타종합";
        const qtInfo = QUAL_TYPES[qtKey];
        if (!qtInfo) return null;
        return (
          <div className="card" style={{padding:18,marginTop:20}}>
            <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>
              {qtInfo.label} — 심사 최종 체크리스트
            </div>
            {qtInfo.checklist.map((c,i)=>(
              <div key={i} style={{display:"flex",gap:8,alignItems:"flex-start",padding:"6px 0",borderBottom:i<qtInfo.checklist.length-1?"1px solid var(--navy-700)":"none",fontSize:13}}>
                <span style={{color:"var(--gold-400)",fontWeight:700,flexShrink:0}}>✓{i+1}</span>
                <span>{c}</span>
              </div>
            ))}
          </div>
        );
      })()}
    </div>
  );
}

function MetaSynthesisLab() {
  const proj = useProject();
  const [conceptSentence, setConceptSentence] = useState(proj.state.conceptSentence);
  const [themes, setThemes] = useState(proj.state.themes);
  const [newTheme, setNewTheme] = useState({source:"", theme:""});
  const [loading, setLoading] = useState(false);
  const [draft, setDraft] = useState(proj.state.synthesisDraft);
  const [error, setError] = useState("");

  const addTheme = () => {
    if (!newTheme.source.trim() || !newTheme.theme.trim()) return;
    const arr = [...themes, newTheme];
    setThemes(arr);
    proj.update(s=>({...s, themes: arr}));
    setNewTheme({source:"", theme:""});
  };

  const generateDraft = async () => {
    if (themes.length===0) { setError("먼저 주제 분석 표에 항목을 추가해 주세요."); return; }
    setError(""); setLoading(true);
    const sys = `당신은 Noblit & Hare(1988) 메타에스노그라피 방법론에 정통한 질적연구 전문가입니다. 제공된 개별 연구의 핵심주제들을 상호 번역(reciprocal translation)하여 하나의 통합적 해석(line of argument)으로 종합하는 학술적 문단을 작성하세요. 250~400자 내외의 한국어 학술 문체로 작성하고, 마지막에는 제시된 개념화 문장과 자연스럽게 연결되도록 하세요. 문단 텍스트만 출력하세요.`;
    const themeText = themes.map(t=>`- ${t.source}: ${t.theme}`).join("\n");
    const data = await callClaude(
      [{ role:"user", content: `개념화 문장: ${conceptSentence}\n\n개별 연구 핵심주제:\n${themeText}` }],
      { system: sys }
    );
    setLoading(false);
    if (data.error) {
      setError("이 파일에서는 실시간 AI 연결이 되지 않아 오프라인 템플릿 문단으로 대체합니다.");
      const fb = localFallbackSynthesis(themes, conceptSentence);
      setDraft(fb);
      proj.update(s=>({...s, synthesisDraft: fb, conceptSentence}));
      return;
    }
    const text = extractText(data);
    if (!text.trim()) {
      setError("빈 응답을 받아 오프라인 샘플로 대체합니다.");
      const fb = localFallbackSynthesis(themes, conceptSentence);
      setDraft(fb);
      proj.update(s=>({...s, synthesisDraft: fb, conceptSentence}));
      return;
    }
    setDraft(text);
    proj.update(s=>({...s, synthesisDraft: text, conceptSentence}));
  };

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="🧬 메타종합 랩" subtitle="개별 연구 주제를 통합 해석으로 종합하는 작업공간"/>
      <div style={{marginTop:20}}>
        <label style={{fontSize:13,color:"var(--slate)",display:"block",marginBottom:6}}>목표 개념화 문장</label>
        <input style={{width:"100%"}} value={conceptSentence} onChange={e=>setConceptSentence(e.target.value)} placeholder="예: 관계 속에서 무너진 전문가적 자기가, 관계를 통해 다시 일어서다." />
      </div>

      <div style={{marginTop:20}}>
        <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:10,textTransform:"uppercase"}}>주제 분석 표</div>
        <table>
          <thead><tr><th>출처(저자, 연도)</th><th>핵심 주제</th></tr></thead>
          <tbody>
            {themes.map((t,i)=>(<tr key={i}><td>{t.source}</td><td>{t.theme}</td></tr>))}
          </tbody>
        </table>
        <div style={{display:"flex",gap:8,marginTop:10}}>
          <input style={{flex:1}} placeholder="출처(예: 김OO, 2021)" value={newTheme.source} onChange={e=>setNewTheme({...newTheme, source:e.target.value})}/>
          <input style={{flex:2}} placeholder="핵심 주제" value={newTheme.theme} onChange={e=>setNewTheme({...newTheme, theme:e.target.value})}/>
          <button className="btn-ghost" onClick={addTheme}>행 추가</button>
        </div>
      </div>

      {themes.length > 0 && (
        <div className="card" style={{padding:18,marginTop:20}}>
          <div style={{fontSize:12,color:"var(--gold-400)",marginBottom:6,textTransform:"uppercase"}}>주제 통합 도식 (자동 생성, 오프라인)</div>
          <ThemeConvergenceDiagram themes={themes} conceptSentence={conceptSentence} />
        </div>
      )}

      <div style={{marginTop:20}}>
        <button className="btn-gold" onClick={generateDraft} disabled={loading}>{loading ? "종합 중..." : "AI로 종합 초안 생성"}</button>
        {loading && <div style={{marginTop:10}}><Loader text="개별 주제를 통합 해석으로 종합하는 중입니다..."/></div>}
        {error && <div style={{color:"var(--danger)",fontSize:13,marginTop:10}}>{error}</div>}
        {draft && (
          <div className="card" style={{padding:0,marginTop:16,borderLeft:"3px solid var(--gold-500)",overflow:"hidden"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 14px",borderBottom:"1px solid var(--navy-700)"}}>
              <span style={{fontSize:12,color:"var(--gold-400)",textTransform:"uppercase"}}>통합 해석 초안</span>
              <button className="btn-ghost" style={{fontSize:11,padding:"4px 10px"}} onClick={()=>navigator.clipboard.writeText(draft).catch(()=>{})}>📋 복사</button>
            </div>
            <div style={{display:"flex",minHeight:160}}>
              <div style={{flex:1,borderRight:"1px solid var(--navy-700)"}}>
                <div style={{padding:"6px 12px",fontSize:10,color:"var(--slate)",borderBottom:"1px solid var(--navy-700)"}}>✏ 편집</div>
                <textarea style={{width:"100%",minHeight:140,background:"transparent",border:"none",padding:"12px"}} value={draft} onChange={e=>setDraft(e.target.value)} />
              </div>
              <div style={{flex:1}}>
                <div style={{padding:"6px 12px",fontSize:10,color:"var(--slate)",borderBottom:"1px solid var(--navy-700)"}}>👁 미리보기</div>
                <div style={{padding:"12px",fontSize:13,lineHeight:1.8,whiteSpace:"pre-wrap",color:"var(--ivory)",overflowY:"auto",maxHeight:200}}>{draft}</div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function MethodDiagram({ stages }) {
  const w = 720, stepW = w / stages.length;
  return (
    <svg width="100%" height="110" viewBox={`0 0 ${w} 110`}>
      {stages.map((st, i) => {
        const cx = stepW * i + stepW / 2;
        return (
          <g key={i}>
            {i < stages.length - 1 && (
              <line x1={cx + 46} y1="40" x2={cx + stepW - 46} y2="40" stroke="#28406b" strokeWidth="2" markerEnd="url(#arrow)" />
            )}
            <circle cx={cx} cy="40" r="26" fill={st.done ? "#c9a227" : "#14243f"} stroke="#c9a227" strokeWidth="2" />
            <text x={cx} y="45" textAnchor="middle" fontSize="14" fontWeight="700" fill={st.done ? "#080f1e" : "#dbb84e"}>{i + 1}</text>
            <text x={cx} y="82" textAnchor="middle" fontSize="10" fill="#8fa0ba">
              {st.name.replace(/^\d+\.\s*/, "").slice(0, 10)}
            </text>
          </g>
        );
      })}
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
          <path d="M0,0 L8,4 L0,8 Z" fill="#28406b" />
        </marker>
      </defs>
    </svg>
  );
}

function useCopyText(text) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    if (!text) return;
    navigator.clipboard.writeText(text).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),2000); }).catch(()=>{});
  };
  return [copied, copy];
}

    const searchData = await callClaude(
