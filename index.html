      { system: searchSys, tools: [{ type:"web_search_20250305", name:"web_search" }] }
    );

    let searchContext = "";
    if (!searchData.error) {
      const parsed = parseJSONLoose(extractText(searchData));
      if (parsed) {
        const stats = (parsed.statistics||[]).map(s=>`• [통계 근거] ${s}`).join("\n");
        const news = (parsed.news||[]).map(n=>`• [최신 이슈] ${n}`).join("\n");
        const policy = (parsed.policy||[]).map(p=>`• [정책 동향] ${p}`).join("\n");
        const gap = parsed.researchGap ? `• [연구 공백] ${parsed.researchGap}` : "";
        const ctx = parsed.socialContext ? `• [사회적 맥락] ${parsed.socialContext}` : "";
        searchContext = [stats, news, policy, ctx, gap].filter(Boolean).join("\n");
        setSearchInfo(searchContext);
      }
    }

    // Step 2: 검색 결과를 포함해 초안 생성
    const writeSys = `당신은 한국 최상위 학술지에 게재된 논문을 다수 작성한 연구방법론 전문가입니다.
제공된 최신 뉴스·통계·보도자료를 단순 나열이 아닌, 연구의 필요성을 뒷받침하는 '논증의 근거'로 녹여 넣어
"${sec.label}" 섹션을 작성하세요.

【절대 금지 사항】
- 통계·사례를 그냥 나열하지 마세요. 반드시 "왜 이 연구가 필요한가"와 연결하세요.
- "매우 중요하다", "것 같다", "아마도" 등 비학술 표현 사용 금지.
- 확인되지 않은 수치나 출처를 지어내지 마세요. 불확실하면 [출처 확인 필요]로 표시.

【필수 작성 구조 — ${sec.key==="intro" ? "서론" : "이론적 배경"}】
${sec.key==="intro" ? `① 사회적 맥락과 문제 제기: 최신 통계·뉴스로 "왜 지금 이 문제를 연구해야 하는가"를 설득력 있게 열어라.
② 기존 연구의 한계: 선행연구가 무엇을 놓쳤는지 짚어라 (APA 인용 포함).
③ 본 연구의 목적과 의의: 이 연구가 어떤 공백을 채우는지 명시하라.
④ 연구문제 예고: 연구문제 또는 연구질문으로 자연스럽게 마무리하라.` :
`① 핵심 개념 정의: 이 연구의 중심 개념을 이론적으로 정의하고 출처를 밝혀라.
② 이론적 흐름: 관련 이론의 역사적 발전 흐름을 간략히 기술하라 (APA 인용 포함).
③ 선행연구 검토: 관련 연구의 공통점·차이점·한계를 체계적으로 서술하라.
④ 본 연구와의 연결: 이론적 배경이 본 연구 설계에 어떻게 적용되는지 명시하라.`}

【인용 형식】
- 선행연구: 홍길동(2023); Kim & Lee(2022); 홍길동, 이순신(2021)
- 뉴스·보도자료: (매체명, 연도) — 예: (교육부, 2024); (한국일보, 2024년 3월)
- 통계: 기관명 + 연도 + 구체적 수치 순으로 기술

목표 분량: ${targetLen}자 내외. 섹션 본문 텍스트만 출력하세요.`;

    const data = await callClaude([{ role:"user", content: buildContext(searchContext) }], { system: writeSys });
    setLoading(false);
    if (data.error) {
      setError("이 파일에서는 실시간 AI 연결이 되지 않아 오프라인 템플릿으로 대신 작성했습니다.");
      setSectionText(localFallbackSection(sec.key, sec.label, s, targetLen));
      return;
    }
    const t2 = extractText(data);
    if (!t2.trim()) { setError("빈 응답 — 오프라인 템플릿으로 대체합니다."); setSectionText(localFallbackSection(sec.key, sec.label, s, targetLen)); return; }
    setSectionText(t2);
  };

  const generateNew = async () => {
    if (needsWebSearch) { await generateWithSearch(); return; }
    setError(""); setLoading(true);
    const sys = `당신은 한국 학술논문 작성을 돕는 연구방법론 전문가입니다. 제공된 연구 맥락을 바탕으로 논문의 "${sec.label}" 섹션 초안을 학술적 한국어 문체로 작성하세요. 규칙: (1) 선행연구 APA 본문 인용 필수, (2) 확인 불가 출처는 [출처 확인 필요], (3) 근거 없는 수치 금지. 목표 분량: ${targetLen}자. 본문만 출력하세요.`;
    const data = await callClaude([{ role:"user", content: buildContext() }], { system: sys });
    setLoading(false);
    if (data.error) { setError("오프라인 — 템플릿으로 대체합니다."); setSectionText(localFallbackSection(sec.key, sec.label, s, targetLen)); return; }
    const t2 = extractText(data);
    if (!t2.trim()) { setError("빈 응답 — 오프라인 템플릿으로 대체합니다."); setSectionText(localFallbackSection(sec.key, sec.label, s, targetLen)); return; }
    setSectionText(t2);
  };

  const continueWriting = async () => {
    if (!text.trim()) { setError("이어서 작성하려면 먼저 초안이 있어야 합니다."); return; }
    setError(""); setLoading(true);
    const sys = `논문 "${sec.label}" 섹션 이어쓰기 전문가입니다. 처음부터 다시 쓰지 말고, 자연스럽게 이어지는 내용만 약 ${Math.round(targetLen*0.5)}자 작성하세요. 이어지는 텍스트만 출력하세요.`;
    const data = await callClaude([{ role:"user", content: `${buildContext()}\n\n[지금까지 작성된 원고]\n${text}` }], { system: sys });
    setLoading(false);
    if (data.error) { setError("오프라인 — 이어쓰기를 사용할 수 없습니다."); return; }
    setSectionText(text + "\n" + extractText(data));
  };

  const gradeSection = async () => {
    if (!text.trim()) { setError("채점받을 내용이 없습니다."); return; }
    setError(""); setLoading(true);
    const sys = `당신은 엄격한 한국 대학원 지도교수입니다. 논문의 "${sec.label}" 섹션을 평가하세요.
반드시 JSON으로만 답변하세요:
{ "score": 0-100, "comment": "구체적 코멘트 2~3문장", "suggestions": "바로 반영 가능한 보완 제안 1~2가지" }`;
    const data = await callClaude([{ role:"user", content: `연구주제: ${s.topic}\n\n[${sec.label} 원고]\n${text}` }], { system: sys });
    setLoading(false);
    let parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (!parsed) { setError("오프라인 — 임시 점수를 표시합니다."); parsed = localFallbackScore(sec.label); }
    const entry = { ...parsed, date: new Date().toLocaleDateString('ko-KR') };
    proj.update(prev => ({
      ...prev,
      sectionScores: { ...prev.sectionScores, [sec.key]: entry },
      feedbackLog: [...prev.feedbackLog, { date: entry.date, overall: `[${sec.label}] ${entry.comment} — ${entry.suggestions}`, scores: [{item:sec.label, score:entry.score, comment:entry.comment}], resolved:false }]
    }));
  };

  const btnLabel = needsWebSearch ? `🔍+✒ 최신 이슈 검색 후 AI 초안` : "AI 초안 생성";

  // Split-view: left = controls, right = result
  return (
    <div className="card" style={{padding:0,overflow:"hidden"}}>
      {/* Header bar */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid var(--navy-700)",flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontWeight:700,fontSize:14}}>{sec.label}</div>
          <div style={{fontSize:11,color:"var(--slate)"}}>{sec.hint}</div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <select style={{fontSize:11,padding:"5px 8px",width:"auto"}} value={lenMode} onChange={e=>setLenMode(e.target.value)}>
            {Object.keys(LENGTH_OPTIONS).map(k=>(<option key={k} value={k}>{LENGTH_LABELS[k]}</option>))}
          </select>
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px"}} disabled={loading} onClick={generateNew}>
            {loading ? "생성 중..." : btnLabel}
          </button>
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px"}} disabled={loading||!text} onClick={continueWriting}>이어서</button>
          <button className="btn-gold" style={{fontSize:11,padding:"6px 10px"}} disabled={loading||!text} onClick={gradeSection}>채점</button>
          {text && <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px",borderColor:copied?"#7cc98a":"var(--navy-600)",color:copied?"#7cc98a":"var(--ivory)"}} onClick={copy}>{copied?"✓ 복사됨":"📋 복사"}</button>}
        </div>
      </div>

      {/* Status messages */}
      {loading && <div style={{padding:"6px 16px"}}><Loader text={needsWebSearch ? "최신 뉴스·통계 검색 중 → 초안 생성 중..." : "초안을 생성하는 중입니다..."}/></div>}
      {error && <div style={{padding:"6px 16px",color:"var(--danger)",fontSize:12}}>{error}</div>}

      {/* Split layout */}
      <div style={{display:"flex",minHeight:220}}>
        {/* Left — Input / Edit */}
        <div style={{flex:1,borderRight:"1px solid var(--navy-700)",display:"flex",flexDirection:"column"}}>
          <div style={{padding:"8px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",letterSpacing:".05em",borderBottom:"1px solid var(--navy-700)"}}>
            ✏ 편집 영역
          </div>
          {sec.key === "method" && <div style={{padding:"8px 12px"}}><MethodDiagram stages={s.designerStages} /></div>}
          <textarea
            style={{flex:1,minHeight:180,resize:"vertical",border:"none",borderRadius:0,background:"transparent",padding:"12px"}}
            placeholder={needsWebSearch ? `'${btnLabel}' 버튼을 누르면 최신 통계·뉴스를 검색 후 자동으로 작성합니다.\n또는 직접 입력하세요.` : "AI 초안 생성을 누르거나 직접 입력하세요."}
            value={text}
            onChange={e=>setSectionText(e.target.value)}
          />
          {/* Word count bar */}
          <div style={{padding:"6px 12px",borderTop:"1px solid var(--navy-700)"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"var(--slate)",marginBottom:3}}>
              <span>{text.length.toLocaleString()}자</span>
              <span style={{color: text.length>=targetLen ? "#7cc98a" : "var(--slate)"}}>목표 {targetLen.toLocaleString()}자 ({Math.min(100,Math.round((text.length/targetLen)*100))}%)</span>
            </div>
            <div style={{height:3,background:"var(--navy-700)",borderRadius:4,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${Math.min(100,Math.round((text.length/targetLen)*100))}%`,
                background: text.length>=targetLen ? "#7cc98a" : "linear-gradient(90deg,var(--gold-500),var(--gold-300))",transition:"width .3s"}}/>
            </div>
          </div>
        </div>

        {/* Right — Result / Preview */}
        <div style={{flex:1,display:"flex",flexDirection:"column"}}>
          <div style={{padding:"8px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",letterSpacing:".05em",borderBottom:"1px solid var(--navy-700)"}}>
            👁 결과 미리보기
            {text && <button onClick={copy} style={{float:"right",background:"none",border:"none",cursor:"pointer",fontSize:11,color:copied?"#7cc98a":"var(--slate)"}}>{copied?"✓ 복사됨":"📋 복사"}</button>}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"12px",fontSize:13,lineHeight:1.9,color:"var(--ivory)",whiteSpace:"pre-wrap",minHeight:180}}>
            {text || <span style={{color:"var(--slate)",fontSize:12}}>왼쪽에서 초안을 생성하거나 직접 입력하면 여기에 미리보기가 표시됩니다.</span>}
          </div>
          {/* Search info panel (intro/theory only) */}
          {needsWebSearch && searchInfo && (
            <div style={{padding:"8px 12px",borderTop:"1px solid var(--navy-700)",fontSize:11,color:"var(--gold-300)",background:"rgba(201,162,39,0.04)"}}>
              <div style={{fontWeight:700,marginBottom:4}}>🔍 활용된 최신 근거</div>
              <pre style={{whiteSpace:"pre-wrap",fontSize:11,color:"var(--slate)",margin:0}}>{searchInfo.slice(0,400)}{searchInfo.length>400?"...":""}</pre>
            </div>
          )}
          {/* Score panel */}
          {scoreInfo && (
            <div style={{padding:"10px 12px",borderTop:"1px solid var(--navy-700)",background:"var(--navy-900)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                <span style={{fontSize:11,color:"var(--gold-400)"}}>채점 결과</span>
                <span className="mono" style={{fontSize:16,fontWeight:700,color:"var(--gold-300)"}}>{scoreInfo.score}</span>
              </div>
              <div style={{fontSize:12,marginBottom:3}}>{scoreInfo.comment}</div>
              <div style={{fontSize:11,color:"var(--slate)"}}>💡 {scoreInfo.suggestions}</div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function PaperDraftStudio() {
  const proj = useProject();
  const s = proj.state;
  const filledCount = DRAFT_SECTIONS.filter(sec => (s.paperDraft[sec.key]||"").trim()).length;
  const selIds = s.selectedPaperIds || [];
  const selPapers = selIds.length > 0 ? selIds.map(id=>s.papers[id]).filter(Boolean) : s.papers;
  const [copiedAll, setCopiedAll] = useState(false);

  const fullManuscript = DRAFT_SECTIONS.map(sec => {
    const text = (s.paperDraft[sec.key]||"").trim();
    return text ? `【${sec.label}】\n\n${text}` : "";
  }).filter(Boolean).join("\n\n" + "─".repeat(40) + "\n\n");

  const copyAll = () => {
    navigator.clipboard.writeText(fullManuscript).then(()=>{
      setCopiedAll(true); setTimeout(()=>setCopiedAll(false), 2500);
    }).catch(()=>{});
  };

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📝 원고 작성실" subtitle="서론·이론적배경은 최신 뉴스·통계를 검색 후 자동 생성됩니다. 좌측 편집 → 우측 미리보기 방식으로 작업하세요."/>
      <div style={{marginTop:16,marginBottom:10,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:13,color:"var(--slate)"}}>작성 완료 <strong style={{color:"var(--gold-300)"}}>{filledCount}</strong> / {DRAFT_SECTIONS.length} 섹션 ({Math.round((filledCount/DRAFT_SECTIONS.length)*100)}%)</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px",borderColor:copiedAll?"#7cc98a":"var(--navy-600)",color:copiedAll?"#7cc98a":"var(--ivory)"}} onClick={copyAll}>
            {copiedAll ? "✓ 전체 복사됨" : "📋 전체 원고 복사"}
          </button>
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>downloadText(`manuscript-${(s.topic||"untitled").slice(0,15)}.txt`, fullManuscript)}>
            ⬇ 전체 다운로드
          </button>
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>{
            const ver={id:Date.now(),date:new Date().toLocaleString('ko-KR'),label:`버전 ${(s.draftVersions||[]).length+1}`,paperDraft:{...s.paperDraft}};
            proj.update(p=>({...p,draftVersions:[...(p.draftVersions||[]),ver]}));
            alert(`${ver.label}이 저장되었습니다.`);
          }}>📸 버전 저장</button>
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 10px"}} onClick={()=>nav("/reflexivity")}>📔 성찰 일지</button>
        </div>
      </div>
      {!s.topic && <div className="card" style={{padding:12,marginBottom:14,fontSize:12,color:"var(--gold-300)",borderLeft:"3px solid var(--gold-500)"}}>먼저 '연구 시작' 페이지에서 연구주제를 설정하면 더 정확한 초안이 생성됩니다.</div>}
      <div className="card" style={{padding:10,marginBottom:14,borderLeft:"3px solid var(--gold-500)"}}>
        <div style={{fontSize:11,color:"var(--slate)",marginBottom:3}}>원고 작성 기반 논문 ({selPapers.length}편)</div>
        {selPapers.length===0 ? (
          <div style={{fontSize:12,color:"var(--danger)"}}>선택된 논문 없음 — <button className="btn-ghost" style={{fontSize:11,padding:"3px 8px"}} onClick={()=>nav("/explorer")}>논문 탐색실에서 선택</button></div>
        ) : (
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {selPapers.slice(0,5).map((p,i)=>(<span key={i} className="tag" style={{fontSize:10}}>{(p.title||"").slice(0,20)}…</span>))}
            {selPapers.length>5 && <span className="tag" style={{fontSize:10}}>+{selPapers.length-5}편</span>}
            <button className="btn-ghost" style={{fontSize:10,padding:"2px 7px"}} onClick={()=>nav("/explorer")}>변경</button>
          </div>
        )}
      </div>

      <div style={{display:"flex",flexDirection:"column",gap:20}}>
        {DRAFT_SECTIONS.map(sec => (<DraftSectionCard key={sec.key} sec={sec} proj={proj} s={s} />))}
      </div>
    </div>
  );
}

const SOCIETY_STYLES = ["한국상담학회", "한국심리학회", "한국교육학회", "한국질적탐구학회", "한국상담심리학회"];

function ReferencesPage() {
  const proj = useProject();
  const s = proj.state;
  const [society, setSociety] = useState(s.citationStyle && s.citationStyle !== "APA" ? s.citationStyle : "");
  const style = society || "APA";
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");
  const formatted = (s.formattedReferences && s.formattedReferences[style]) || null;
  const hasUnsyncedPapers = s.papers.length > 0 && !formatted;

  const formatRefs = async () => {
    if (s.papers.length === 0) { setError("먼저 '논문 탐색실'에 참고할 논문을 추가해 주세요."); return; }
    setError(""); setLoading(true);
    const styleName = society ? `${society} 투고규정 (APA 7판을 기본 틀로 하되 학회 지정 세부사항 반영)` : "APA 7판";
    const sys = `당신은 학술 논문 참고문헌 작성 전문가입니다. 아래 논문 목록을 ${styleName} 인용 형식으로 각각 포맷팅하세요.
반드시 제공된 정보만 사용하고, 학술지명·권호·페이지 등 제공되지 않은 정보는 절대 추정하거나 지어내지 말고 "[정보 확인 필요]"로 표기하세요.
입력 목록과 동일한 순서, 동일한 개수로 아래 JSON 배열 형식으로만 출력하세요:
[ { "formatted": "포맷팅된 인용 문자열" } ]`;
    const list = s.papers.map((p,i)=>`${i+1}. 제목: ${p.title} / 저자정보: ${p.authors || "정보 확인 필요"} / 비고: ${p.note || ""} / 출처검증: ${p.needsCheck ? "미검증" : "검증됨"}`).join("\n");
    const data = await callClaude([{ role:"user", content: list }], { system: sys });
    setLoading(false);
    let parsed = data.error ? null : parseJSONLoose(extractText(data));
    if (!parsed || !Array.isArray(parsed)) {
      setError("이 파일에서는 실시간 AI 연결이 되지 않아 APA 기본 규칙으로 대신 정리했습니다. 학회 지정 세부사항은 직접 반영해 주세요.");
      parsed = s.papers.map(p => ({
        formatted: `${p.authors || "[저자 확인 필요]"}. ${p.title}. ${p.source || "[출처 확인 필요]"}.`
      }));
    }
    proj.update(prev => ({
      ...prev, citationStyle: style,
      formattedReferences: { ...prev.formattedReferences, [style]: parsed.map((x,i)=>({ formatted: x.formatted, needsCheck: prev.papers[i] ? prev.papers[i].needsCheck : false })) }
    }));
  };

  return (
    <div style={{padding:"28px 36px"}}>
      <Header title="📖 참고문헌" subtitle="APA 형식을 기본으로 하며, 필요 시 학회 지정 양식을 선택할 수 있습니다."/>
      {hasUnsyncedPapers && (
        <div className="card" style={{padding:12,marginTop:16,borderLeft:"3px solid var(--gold-500)",fontSize:12,color:"var(--gold-300)"}}>
          🔄 논문 목록이 변경되어 참고문헌이 초기화되었습니다. 아래에서 다시 포맷팅해 주세요.
        </div>
      )}
      <div style={{marginTop:16,display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <span className="tag" style={{padding:"7px 14px",color:"var(--gold-300)"}}>APA 7판 (기본)</span>
        <select style={{minWidth:200,width:"auto"}} value={society} onChange={e=>setSociety(e.target.value)}>
          <option value="">학회 지정 양식 없음</option>
          {SOCIETY_STYLES.map(name=>(<option key={name} value={name}>{name} 지정 양식</option>))}
        </select>
        <button className="btn-gold" onClick={formatRefs} disabled={loading}>{loading ? "정리 중..." : `AI로 ${society || "APA"} 형식 포맷팅`}</button>
        {formatted && (
          <button className="btn-ghost" style={{fontSize:11,padding:"6px 12px"}} onClick={()=>{
            const txt = formatted.map((r,i)=>`${i+1}. ${r.formatted}`).join("\n");
            navigator.clipboard.writeText(txt).catch(()=>{});
          }}>📋 전체 복사</button>
        )}
      </div>
      {society && <div style={{fontSize:12,color:"var(--gold-300)",marginTop:8}}>ℹ {society} 투고규정에 맞춰 APA를 기본 틀로 조정합니다. 최종 제출 전 학회 최신 규정과 대조해 주세요.</div>}
      {loading && <div style={{marginTop:12}}><Loader text="인용 형식에 맞춰 정리하는 중입니다..."/></div>}
      {error && <div style={{color:"var(--danger)",fontSize:13,marginTop:12}}>{error}</div>}

      {/* Split view */}
      {s.papers.length > 0 && (
        <div className="card" style={{padding:0,marginTop:16,overflow:"hidden"}}>
          <div style={{display:"flex",minHeight:300}}>
            {/* Left: raw paper list */}
            <div style={{flex:1,borderRight:"1px solid var(--navy-700)",overflowY:"auto"}}>
              <div style={{padding:"9px 14px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>수집 논문 ({s.papers.length}편)</div>
              {s.papers.map((p,i)=>(
                <div key={i} style={{padding:"10px 14px",borderBottom:"1px solid var(--navy-700)",fontSize:12}}>
                  <div style={{fontWeight:700,marginBottom:2}}>{i+1}. {p.title}</div>
                  <div style={{color:"var(--slate)"}}>{p.authors||"저자정보 없음"} {p.source && `· ${p.source}`}</div>
                  {p.needsCheck && <span className="flag-warn" style={{fontSize:10}}>⚠ 출처 미검증</span>}
                </div>
              ))}
            </div>
            {/* Right: formatted references */}
            <div style={{flex:1,overflowY:"auto"}}>
              <div style={{padding:"9px 14px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",borderBottom:"1px solid var(--navy-700)"}}>
                포맷팅된 참고문헌 ({style})
              </div>
              {formatted ? formatted.map((r,i)=>(
                <div key={i} style={{padding:"10px 14px",borderBottom:"1px solid var(--navy-700)",fontSize:13,lineHeight:1.6,display:"flex",justifyContent:"space-between",gap:8,alignItems:"flex-start"}}>
                  <span>{i+1}. {r.formatted} {r.needsCheck && <span className="flag-warn">⚠</span>}</span>
                  <button style={{background:"none",border:"none",cursor:"pointer",color:"var(--slate)",fontSize:11,flexShrink:0,padding:"2px 6px"}}
                    onClick={()=>navigator.clipboard.writeText(r.formatted).catch(()=>{})}>📋</button>
                </div>
              )) : (
                <div style={{padding:"20px 14px",color:"var(--slate)",fontSize:13}}>
                  포맷팅 버튼을 눌러 {style} 형식으로 변환하세요.

      {s.papers.length===0 && <div style={{color:"var(--slate)",fontSize:14,marginTop:16}}>아직 등록된 논문이 없습니다. '논문 탐색실'에서 먼저 논문을 추가해 주세요.</div>}
      <CitationChecker draft={(s.paperDraft?.intro||"")+" "+(s.paperDraft?.theory||"")} papers={s.papers||[]} />
    </div>
  );
}

function ThemeConvergenceDiagram({ themes, conceptSentence }) {
  if (!themes || themes.length === 0) return null;
  const w = 720, nodeW = 150, nodeH = 40, top = 20, gap = 14;
  const n = Math.min(themes.length, 6);
  const startX = (w - (n*nodeW + (n-1)*gap)) / 2;
  const centerX = w/2, bottomY = top + nodeH + 70;
  return (
    <svg width="100%" height="170" viewBox={`0 0 ${w} 170`}>
      {themes.slice(0,6).map((t,i) => {
        const x = startX + i*(nodeW+gap);
        const cx = x + nodeW/2;
        return (
          <g key={i}>
            <rect x={x} y={top} width={nodeW} height={nodeH} rx="6" fill="#14243f" stroke="#c9a227" strokeWidth="1.5"/>
            <text x={cx} y={top+17} textAnchor="middle" fontSize="10" fill="#dbb84e">{(t.source||"").slice(0,14)}</text>
            <text x={cx} y={top+31} textAnchor="middle" fontSize="10" fill="#f2ecdd">{(t.theme||"").slice(0,16)}</text>
            <line x1={cx} y1={top+nodeH} x2={centerX} y2={bottomY-20} stroke="#28406b" strokeWidth="1.5"/>
          </g>
        );
      })}
      <rect x={centerX-170} y={bottomY-20} width="340" height="46" rx="8" fill="#c9a227"/>
      <foreignObject x={centerX-165} y={bottomY-17} width="330" height="40">
        <div style={{fontSize:11,fontWeight:700,color:"#080f1e",textAlign:"center",lineHeight:1.3,padding:"2px 4px"}}>{conceptSentence || "개념화 문장을 입력해 주세요"}</div>
      </foreignObject>
    </svg>
  );
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildReportText(s) {
  const parts = [];
  parts.push(`# Research Pilot AI 종합 보고서`);
  parts.push(`_생성일: ${new Date().toLocaleDateString('ko-KR')}_`);
  parts.push(`\n## 1. 연구 개요`);
  parts.push(`| 항목 | 내용 |`);
  parts.push(`|---|---|`);
  parts.push(`| 연구 카테고리 | ${s.category || "미설정"} |`);
  parts.push(`| 연구주제 | ${s.topic || "미설정"} |`);
  parts.push(`| 연구유형 | ${s.type || "미설정"} (${QUAL_TYPES[s.qualSubType||"질적메타종합"]?.label || ""}) |`);
  parts.push(`| 목표 분량 | ${s.targetPages || "미설정"} |`);
  parts.push(`| 제출 기한 | ${s.deadline || "미설정"} |`);
  parts.push(`\n**추천 제목**`);
  parts.push((s.titles||[]).map((t,i)=>`${i+1}. ${t}`).join("\n") || "없음");

  parts.push(`\n## 2. 선행연구 / 참고문헌 후보 (${(s.papers||[]).length}편)`);
  (s.papers||[]).forEach((p,i)=>{
    const docLabel = DOC_TYPES.find(d=>d.key===p.docType)?.label || "선행연구";
    parts.push(`${i+1}. **${p.title}** — ${p.authors||""} · ${p.source||""} \`${docLabel}${p.methodType?` · ${p.methodType}`:""}\`${p.needsCheck?" ⚠️출처확인필요":""}`);
  });
  if ((s.papers||[]).length === 0) parts.push("등록된 논문 없음");
  const apaRefs = (s.formattedReferences && s.formattedReferences["APA"]) || null;
  if (apaRefs) {
    parts.push(`\n**APA 형식 참고문헌**`);
    apaRefs.forEach(r=>parts.push(`- ${r.formatted}`));
  }

  parts.push(`\n## 3. 연구 설계 (6단계)`);
  (s.designerStages||[]).forEach((st)=>{
    parts.push(`- [${st.done?"x":" "}] **${st.name}**${st.note ? ` — ${st.note}` : ""}`);
  });

  parts.push(`\n## 4. 원고 초안`);
  Object.keys(DRAFT_LABELS).forEach(key=>{
    const text = (s.paperDraft||{})[key];
    parts.push(`\n### ${DRAFT_LABELS[key]}`);
    parts.push(text && text.trim() ? text : "_(미작성)_");
  });

  parts.push(`\n## 5. 지도교수 피드백 이력`);
  if ((s.feedbackLog||[]).length === 0) parts.push("없음");
  (s.feedbackLog||[]).forEach((f,i)=>{
    parts.push(`${i+1}. **[${f.date}]** ${f.overall} _(${f.resolved ? "반영완료":"반영대기"})_`);
  });

  parts.push(`\n## 6. 메타종합`);
  parts.push(`**개념화 문장:** ${s.conceptSentence || "미설정"}`);
  parts.push(`\n**주제 분석 표**\n`);
  parts.push(`| 출처 | 핵심 주제 |`);
  parts.push(`|---|---|`);
  (s.themes||[]).forEach((t)=>parts.push(`| ${t.source} | ${t.theme} |`));
  if ((s.themes||[]).length === 0) parts.push("| 없음 | — |");
  parts.push(`\n**통합 해석 초안**\n\n${s.synthesisDraft||"_(미작성)_"}`);

  parts.push(`\n## 7. 질문응답실 Q&A`);
  const qa = (s.qaLog||[]).filter(q=>q.answer && q.answer.trim());
  if (qa.length === 0) parts.push("답변된 질문 없음");
  qa.forEach((q,i)=>parts.push(`**Q${i+1}. [${q.category}]** ${q.question}\n**A${i+1}.** ${q.answer}`));

  const qtCheck = QUAL_TYPES[s.qualSubType||"질적메타종합"]?.checklist || [];
  if (qtCheck.length) {
    parts.push(`\n## 8. 심사 체크리스트 (${QUAL_TYPES[s.qualSubType||"질적메타종합"]?.label})`);
    qtCheck.forEach((c,i)=>parts.push(`- [ ] ${c}`));
  }

  parts.push(`\n---\n_생성: Research Pilot AI (오프라인 초안 도구 — 실제 게재 전 반드시 전문가 검토 및 출처 재확인이 필요합니다.)_`);
  return parts.join("\n");
}

function buildPlainText(s) {
  // Markdown 기호 없는 순수 텍스트 — 한글 붙여넣기용
  const parts = [];
  parts.push("Research Pilot AI 종합 보고서");
  parts.push(`생성일: ${new Date().toLocaleDateString('ko-KR')}`);
  parts.push("=".repeat(50));

  parts.push("\n1. 연구 개요");
  parts.push(`연구 카테고리: ${s.category || "미설정"}`);
  parts.push(`연구주제: ${s.topic || "미설정"}`);
  parts.push(`연구유형: ${s.type || "미설정"} (${QUAL_TYPES[s.qualSubType||"질적메타종합"]?.label || ""})`);
  parts.push(`목표 분량: ${s.targetPages || "미설정"}`);
  parts.push(`제출 기한: ${s.deadline || "미설정"}`);
  if ((s.titles||[]).length) {
    parts.push(`\n추천 제목:`);
    (s.titles||[]).forEach((t,i)=>parts.push(`  ${i+1}. ${t}`));
  }

  parts.push("\n" + "=".repeat(50));
  parts.push(`2. 선행연구 (${(s.papers||[]).length}편)`);
  (s.papers||[]).forEach((p,i)=>{
    parts.push(`  ${i+1}. ${p.title} — ${p.authors||""} · ${p.source||""}`);
  });

  parts.push("\n" + "=".repeat(50));
  parts.push("3. 원고 초안");
  Object.keys(DRAFT_LABELS).forEach(key=>{
    const t = (s.paperDraft||{})[key];
    if (t && t.trim()) {
      parts.push(`\n[${DRAFT_LABELS[key]}]`);
      parts.push(t);
    }
  });

  parts.push("\n" + "=".repeat(50));
  parts.push("4. 메타종합");
  parts.push(`개념화 문장: ${s.conceptSentence || "미설정"}`);
  if (s.synthesisDraft) parts.push(`\n통합 해석:\n${s.synthesisDraft}`);

  parts.push("\n" + "=".repeat(50));
  parts.push("5. Q&A");
  const qa = (s.qaLog||[]).filter(q=>q.answer && q.answer.trim());
  qa.forEach((q,i)=>parts.push(`Q${i+1}. ${q.question}\nA${i+1}. ${q.answer}`));

  parts.push("\n" + "=".repeat(50));
  parts.push("생성: Research Pilot AI — IWS AI 욜로 (전효숙)");
  return parts.join("\n");
}

function ReportPage() {
  const proj = useProject();
  const s = proj.state;
  const text = buildReportText(s);
  const plainText = buildPlainText(s);

  const [copiedPlain, setCopiedPlain] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); setCopied(true); setTimeout(()=>setCopied(false), 2000); }
    catch(e) { setCopied(false); }

  const copyPlain = async () => {
    try { await navigator.clipboard.writeText(plainText); setCopiedPlain(true); setTimeout(()=>setCopiedPlain(false), 2000); }

        <button className="btn-ghost" style={{borderColor:copiedPlain?"#7cc98a":"var(--gold-500)",color:copiedPlain?"#7cc98a":"var(--gold-300)"}} onClick={copyPlain} title="서식 없는 텍스트 — 한글/워드에 바로 붙여넣기 가능">
          {copiedPlain ? "✓ 복사됨" : "📋 한글 붙여넣기용 복사"}
        </button>
        <div style={{marginLeft:"auto",display:"flex",gap:12,fontSize:12,color:"var(--slate)"}}>
          <span>논문 {paperCount}편</span>
          <span>원고 {draftFilled}/8섹션</span>
          <span>피드백 {feedbackCount}건</span>
        </div>
      </div>

      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <div style={{display:"flex",minHeight:600}}>
          <div style={{width:180,flexShrink:0,borderRight:"1px solid var(--navy-700)",overflowY:"auto"}}>
            <div style={{padding:"10px 12px",fontSize:10,color:"var(--slate)",textTransform:"uppercase",letterSpacing:".05em",borderBottom:"1px solid var(--navy-700)"}}>목차</div>
            {SECTIONS_MENU.map((m,i)=>(
              <div key={i} style={{padding:"10px 12px",borderBottom:"1px solid var(--navy-700)",fontSize:12,cursor:"pointer",color:"var(--slate)"}}
                onClick={()=>{
                  const el = document.getElementById("report-content");
                  if (!el) return;
                  const lines = text.split("\n");
                  const idx = lines.findIndex(l=>l.includes(m.anchor));
                  if (idx>=0) { const approx = (idx/lines.length)*el.scrollHeight; el.scrollTop=approx; }
                }}
                onMouseEnter={e=>e.currentTarget.style.color="var(--gold-300)"}
                onMouseLeave={e=>e.currentTarget.style.color="var(--slate)"}>
                {m.label}
              </div>
            ))}
            <div style={{padding:"12px",display:"flex",flexDirection:"column",gap:6,marginTop:4}}>
              <button className="btn-ghost" style={{width:"100%",fontSize:10,padding:"6px 0"}} onClick={copy}>{copied?"✓":"📋"} Markdown</button>
              <button className="btn-ghost" style={{width:"100%",fontSize:10,padding:"6px 0",borderColor:"var(--gold-500)",color:"var(--gold-300)"}} onClick={copyPlain}>{copiedPlain?"✓":"📋"} 한글용</button>
            </div>
          </div>
          <div style={{flex:1,overflowY:"auto",maxHeight:700}} id="report-content">
            <pre style={{whiteSpace:"pre-wrap",fontFamily:"'Noto Sans KR',sans-serif",fontSize:13,lineHeight:1.75,color:"var(--ivory)",margin:0,padding:"20px"}}>{text}</pre>
          </div>
        </div>
      </div>
    </div>
  );
}

function formatWon(n) { return n.toLocaleString('ko-KR') + "원"; }

function AccountQRCode({ text }) {
  const ref = useRef(null);
  const [failed, setFailed] = useState(false);
  useEffect(() => {
    if (!ref.current) return;
    ref.current.innerHTML = "";
    try {
      if (window.QRCode) {
        new window.QRCode(ref.current, { text, width:120, height:120, colorDark:"#080f1e", colorLight:"#f2ecdd" });
      } else { setFailed(true); }
    } catch (e) { setFailed(true); }
  }, [text]);
  if (failed) return <div style={{fontSize:12,color:"var(--slate)"}}>QR 코드를 표시할 수 없습니다. 계좌 정보를 텍스트로 확인해 주세요.</div>;
  return <div ref={ref} style={{background:"#f2ecdd",padding:8,borderRadius:8,display:"inline-block"}} />;
}

  const setField = (k,v) => setForm(f=>({...f, [k]:v}));
  const isOwner = proj.state.userRole === "owner";

    setSelected(sel => ({...sel, [name]: !sel[name]}));
    setShowAccount(false);
    setDepositConfirmed(false);

              </div>
              <select value={a.status} onChange={e=>updateStatus(a.id, e.target.value)}>
                {STATUS_OPTIONS.map(st=>(<option key={st} value={st}>{st}</option>))}

        </div>
      )}
    </div>
  );
}

/* -------- 참고문헌 자동 연동 훅 -------- */
function useAutoReferences(state, update) {
  const prevPapers = useRef(null);
  useEffect(() => {
    const currentTitles = (state.papers||[]).map(p=>p.title).join("|");
    if (prevPapers.current === null) { prevPapers.current = currentTitles; return; }
    if (prevPapers.current === currentTitles) return;
    prevPapers.current = currentTitles;
    update(s => ({
      ...s,
      formattedReferences: {},
    }));
  }, [state.papers]);
}

/* ========================================================
   AutoWorkflow — 논문 자동 개선 (한글/txt/md 업로드 → 순차 처리)
   ======================================================== */

/* 한글(.hwp) 파일 텍스트 추출 — HWP는 바이너리 포맷이라
   브라우저에서 완전한 파싱이 불가능합니다. UTF-8 기반 HWPX(zip)는
   FileReader로 XML을 읽어 텍스트를 추출하고, 구형 HWP는
   가능한 범위 내에서 읽기 시도 후 안내를 표시합니다. */
async function extractTextFromFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'txt' || ext === 'md') {
    return await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = e => res(e.target.result);
      r.onerror = () => rej(new Error("파일 읽기 실패"));
      r.readAsText(file, 'UTF-8');
    });
  }
  if (ext === 'hwpx') {
    try {
      // HWPX는 ZIP 구조 — 브라우저에서 ArrayBuffer로 읽어 XML 추출 시도
      const buf = await file.arrayBuffer();
      const decoder = new TextDecoder('utf-8', { fatal: false });
      const raw = decoder.decode(buf);
      // XML 태그 사이의 텍스트만 추출
      const text = raw.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      return text.length > 100 ? text : null;
    } catch (e) { return null; }
  }
  if (ext === 'hwp') {
    // 구형 HWP 바이너리 — 제한적 UTF-8 텍스트 영역만 추출
    try {
      const buf = await file.arrayBuffer();
      const decoder = new TextDecoder('euc-kr', { fatal: false });
      const raw = decoder.decode(buf);
      const chunks = raw.match(/[\uAC00-\uD7A3ㄱ-ㅎㅏ-ㅣ\s,.!?()\[\]"'가-힣]{10,}/g) || [];
      return chunks.join(' ').slice(0, 20000) || null;
    } catch (e) { return null; }
  }
  return null;
}
